# backstop-mcp chart defaults — portable app only.
# Unique hostname / TLS / NP-on live in the monorepo Argo overlay (Gateway API routes).
# Third parties: helm install + expose however they want (LB, Ingress controller, Mesh…).

nameOverride: backstop-mcp
fullnameOverride: backstop-mcp
selectorComponentLabel: server

# Loki scrapes use this label to parse stderr as pino-json
# (unique_mcp.configure_logging).
podLabels:
  logging.unique.app/format: pino-json

env:
  APP_ENV: production
  LOG_LEVEL: info
  PORT: "8000"
  # PUBLIC_BASE_URL must be the externally-reachable OAuth issuer URL (set in overlay).
  # BACKSTOP_BASE_URL defaults to https://api.backstopsolutions.com inside the app.

  # In-memory catalog caches, one flag per feature, all off. A catalog is a small instance-wide
  # `{id: dto}` map (custom-field definitions and groups, activity tags, system users) that many
  # tool calls read and nothing writes; with a flag off, every read re-walks Backstop instead.
  #
  # They ship off on purpose. A TTL trades staleness for saved requests, and until this ran in
  # production nothing measured either side of that trade. Two histograms on /metrics do, and an
  # overlay should read them before flipping one of these to "true":
  #
  #   sum by (catalog) (rate(catalog_get_duration_seconds_count[5m]))       # demand
  #     - sum by (catalog) (rate(catalog_fetch_duration_seconds_count[5m])) # walks avoided already
  #
  # `catalog_get_duration_seconds{served=...}` splits demand by what answered it, and
  # `catalog_fetch_duration_seconds` buckets what one walk costs. High demand plus an expensive
  # walk is the case for turning a flag on; then confirm `served="cache"` rises and the walk rate
  # falls. Set here rather than left to the app so an overlay can flip one without knowing the
  # env var name; the app's own default is false either way.
  #
  # How long an enabled cache holds is a separate knob per feature, defaulted in the app and
  # capped at 24h: BACKSTOP_CUSTOM_FIELD_SCHEMA_TTL_MINUTES (1440),
  # BACKSTOP_ACTIVITY_TAG_TTL_MINUTES (1440), BACKSTOP_SYSTEM_USER_TTL_MINUTES (1440).
  #
  # Covers both custom-field catalogs (definitions and groups), which share a TTL.
  BACKSTOP_CUSTOM_FIELD_SCHEMA_CACHE_ENABLED: "false"
  BACKSTOP_ACTIVITY_TAG_CACHE_ENABLED: "false"
  BACKSTOP_SYSTEM_USER_CACHE_ENABLED: "false"

  # RESOLUTION_ELICIT_TIMEOUT_SECONDS (45) bounds how long a tool waits for the user to choose
  # between ambiguous matches before returning the candidate list instead. Left to the app's
  # default here, but it is a property of the *client*, not of this server: it must stay under
  # that client's tool-call deadline, with margin for the upstream search that precedes the
  # prompt. Lower it in an overlay whose client cancels sooner than 60s.

envVars: []
# Required secrets (provide via envVars in overlay):
# - BACKSTOP_MCP_ENCRYPTION_KEY: Fernet key for credential encryption
# - DB_URL (or rely on base-chart DATABASE_URL when postgresql.enabled — app accepts both)

image:
  registry: ghcr.io
  repository: unique-ag/connectors/services/backstop-mcp
  tag: 0.0.3 # x-release-please-version
  pullPolicy: IfNotPresent

ports:
  application: 8000

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 128Mi

probes:
  enabled: true
  # /health is process-up (setup_ops); /ready checks Postgres. Liveness must not restart the pod
  # when the database is briefly unreachable — readiness alone keeps it out of service.
  liveness:
    failureThreshold: 6
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    failureThreshold: 6
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    failureThreshold: 30
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  enabled: true

# Writable /tmp — base chart defaults to readOnlyRootFilesystem: true.
volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi

volumeMounts:
  - name: tmp
    mountPath: /tmp

postgresql:
  enabled: true
  connection:
    sslMode: verify
    # Overlay supplies host/url (CloudNativePG or external). Base chart injects
    # DATABASE_URL / POSTGRESQL_* — backstop-mcp also accepts DB_URL.

rabbitmq:
  enabled: false

service:
  port: 80

# Who may call this service (used by base NetworkPolicy generators).
internalServices:
  dependents:
    ingressGateway:
      name: gateway
      namespace: system

# Gateway API (HTTPRoute) via base chart — off until overlay sets hostname + paths.
routes:
  hostname: ""
  auth:
    jwt: false

hooks:
  migration:
    enabled: true
    command: |
      alembic upgrade head

# NetworkPolicy stub (off). Unique QA overlay sets enabled: true.
networkPolicy:
  enabled: false
  flavor: cilium
  enableDefaultDeny:
    ingress: true
    egress: true
  baseline:
    # Scrapes reach this pod from Prometheus in `system`, not from the base chart's `monitoring`
    # default — so the namespace is named, exactly as office-365-mcp and teams-mcp name it.
    # `enabled: false` emits no Prometheus ingress rule at all
    # (base/templates/_networkPolicy.cilium.tpl, `$hasPrometheus`), so the moment the Unique QA
    # overlay sets `networkPolicy.enabled: true` every scrape is dropped. /metrics stays up, the
    # probes stay green and the pod logs nothing — which is why `backstop_*` OTel metrics were
    # absent from prod Prometheus even though `GET /metrics` served them.
    prometheus:
      namespace: system
    ephemeralPorts:
      enabled: false
