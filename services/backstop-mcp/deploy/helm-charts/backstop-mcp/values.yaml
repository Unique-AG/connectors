# backstop-mcp chart defaults — portable app only.
# Unique hostname / TLS / NP-on live in the monorepo Argo overlay (Gateway API routes).
# Third parties: helm install + expose however they want (LB, Ingress controller, Mesh…).

nameOverride: backstop-mcp
fullnameOverride: backstop-mcp
selectorComponentLabel: server

# Per-client settings, rendered as container env vars that override the same name under `env`.
# Empty or null keeps the app default. Set per deployment in the overlay.
mcpConfig:
  enabled: true
  app:
    # PUBLIC_BASE_URL, the OAuth issuer. Required in production; must match routes.hostname.
    publicBaseUrl: ""
  backstop:
    # BACKSTOP_BASE_URL. App default: https://api.backstopsolutions.com
    baseUrl: ""
    # BACKSTOP_UI_BASE_URL, the CRM UI origin for record links.
    uiBaseUrl: ""
  # Departed-contact detection. Ids are strings. A markers list, even [], replaces the app default.
  employment:
    relationshipTypeIds: null
    relationshipTypeMarkers: null
    formerRelationshipTypeIds: null
    formerRelationshipTypeMarkers: null
  # BACKSTOP_MCP_TENANT_GUIDANCE, rendered as JSON. The chart ships tenant-neutral.
  tenantGuidance: {}
  logging:
    # LOG_LEVEL, the level of backstop-mcp's own loggers.
    level: info
    # LIBRARY_LOG_LEVELS, rendered as JSON. Logger name to level, over the app's defaults (httpx
    # and httpcore WARNING, sse_starlette INFO), e.g. {httpx: INFO}. A library not named logs at
    # INFO.
    libraryLevels: {}
    # LOGS_DIAGNOSTICS_DATA_POLICY. conceal: identifying strings in logs become
    # hmac-sha256:<hex>, so they correlate without leaking. disclose: the original (debugging).
    diagnosticsDataPolicy: conceal
    # ERROR_DETAILS_POLICY. redact: exception messages and stack text stay out of logs and spans;
    # the exception type, the frames at error and the failed field paths stay. disclose: all.
    errorDetailsPolicy: redact

# Loki scrapes use this label to parse stderr as pino-json
# (mcp_observability.configure_logging).
podLabels:
  logging.unique.app/format: pino-json

env:
  APP_ENV: production
  PORT: "8000"
  # PUBLIC_BASE_URL, BACKSTOP_BASE_URL, BACKSTOP_UI_BASE_URL, the employment relationship
  # types, BACKSTOP_MCP_TENANT_GUIDANCE and the logging settings (LOG_LEVEL, LIBRARY_LOG_LEVELS,
  # LOGS_DIAGNOSTICS_DATA_POLICY, ERROR_DETAILS_POLICY) are set through mcpConfig above.

  # In-memory catalog caches, one flag per feature. A catalog is a small instance-wide
  # `{id: dto}` map (custom-field definitions and groups, activity tags, system users,
  # time zones) that many tool calls read and nothing writes; with a flag off, every
  # read re-walks Backstop.
  #
  # Custom-field catalogs are on: the unfiltered walk is more than 1k definitions an average
  # of 2+ MiB which takes 5+ seconds to read, every party and product read joins against it.
  # Activity tags, system users, and time zones stay off until their histograms say otherwise:
  #
  #   sum by (catalog) (rate(catalog_get_duration_seconds_count[5m]))       # demand
  #     - sum by (catalog) (rate(catalog_fetch_duration_seconds_count[5m])) # walks avoided already
  #
  # `catalog_get_duration_seconds{served=...}` splits demand by what answered it, and
  # `catalog_fetch_duration_seconds` buckets what one walk costs. Set here rather than left
  # to the app so an overlay can flip one without knowing the env var name.
  #
  # How long an enabled cache holds is a separate knob per feature, defaulted in the app and
  # capped at 24h:
  # BACKSTOP_CUSTOM_FIELD_SCHEMA_TTL_MINUTES (120),
  # BACKSTOP_CONTACT_SOURCE_TTL_MINUTES (1440),
  # BACKSTOP_CONTACT_CATEGORY_TTL_MINUTES (1440),
  # BACKSTOP_ACTIVITY_TAG_TTL_MINUTES (1440),
  # BACKSTOP_SYSTEM_USER_TTL_MINUTES (1440),
  # BACKSTOP_TIME_ZONE_TTL_MINUTES (1440).
  #
  # Covers both custom-field catalogs (definitions and groups), which share a TTL.
  BACKSTOP_CUSTOM_FIELD_SCHEMA_CACHE_ENABLED: "true"
  BACKSTOP_CONTACT_SOURCE_CACHE_ENABLED: "false"
  BACKSTOP_CONTACT_CATEGORY_CACHE_ENABLED: "false"
  BACKSTOP_ACTIVITY_TAG_CACHE_ENABLED: "false"
  BACKSTOP_SYSTEM_USER_CACHE_ENABLED: "false"
  BACKSTOP_TIME_ZONE_CACHE_ENABLED: "false"

  # Bounds how long a tool waits for the user to choose between ambiguous matches before
  # returning the candidate list instead. The server waits 2 minutes. The Unique chat client
  # can still cancel a tool call at 60s, and then the candidates are discarded.
  RESOLUTION_ELICIT_TIMEOUT_SECONDS: "120"

  # Most accounts get_product_investors values in one call. Each is one Backstop request
  # (about 0.14s warm, so 150 is about 21s); keep it well inside the chat client's 60s
  # tool-call limit.
  PRODUCT_INVESTORS_MAX_VALUED_ACCOUNTS: "150"

  # Rows one search call returns before it stops and hands back a cursor to the next page.
  SEARCH_RESULT_SIZE: "100"

  # CA the database certificate is verified against, mounted from pg-cluster-ca below. When the
  # file is absent (no CloudNativePG cluster), the system trust store is used instead.
  DB_SSL_ROOT_CERT: /etc/postgresql-ca/ca.crt

envVars: []
# Required secrets (provide via envVars in overlay):
# - BACKSTOP_MCP_ENCRYPTION_KEY: Fernet key for credential encryption
# - DB_URL (or rely on base-chart DATABASE_URL when postgresql.enabled — app accepts both)

image:
  registry: ghcr.io
  repository: unique-ag/connectors/services/backstop-mcp
  tag: 3.0.0 # x-release-please-version
  pullPolicy: IfNotPresent

ports:
  application: 8000

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 128Mi

probes:
  enabled: true
  # /health is process-up (setup_ops); /ready checks Postgres. Liveness must not restart the pod
  # when the database is briefly unreachable — readiness alone keeps it out of service.
  liveness:
    failureThreshold: 6
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    failureThreshold: 6
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    # Must stay above the app's 2s readiness check, or the probe is abandoned before the
    # handler can answer 503 itself.
    timeoutSeconds: 3
  startup:
    failureThreshold: 30
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  enabled: true

# Writable /tmp — base chart defaults to readOnlyRootFilesystem: true.
# pg-cluster-ca: CloudNativePG CA for the server and migration Job; optional for managed Postgres.
# An overlay that sets volumes or volumeMounts replaces these lists and must repeat it.
volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi
  - name: pg-cluster-ca
    secret:
      secretName: backstop-mcp-pg-cluster-ca
      optional: true
      items:
        - key: ca.crt
          path: ca.crt

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: pg-cluster-ca
    mountPath: /etc/postgresql-ca
    readOnly: true

postgresql:
  enabled: true
  connection:
    sslMode: verify
    # Overlay supplies host/url (CloudNativePG or external). Base chart injects
    # DATABASE_URL / POSTGRESQL_* — backstop-mcp also accepts DB_URL.

rabbitmq:
  enabled: false

service:
  port: 80

# Who may call this service (used by base NetworkPolicy generators).
internalServices:
  dependents:
    ingressGateway:
      name: gateway
      namespace: system

# Gateway API (HTTPRoute) via base chart — off until overlay sets hostname + paths.
# attach_file is capped at 4 MiB by the MCP SDK (see attach_file_max_bytes.py); no ingress
# annotation needed. Raising it later also means raising the overlay's proxy-body-size.
routes:
  hostname: ""
  auth:
    jwt: false

hooks:
  migration:
    enabled: true
    command: |
      alembic upgrade head

# NetworkPolicy stub (off). Unique QA overlay sets enabled: true.
networkPolicy:
  enabled: false
  flavor: cilium
  enableDefaultDeny:
    ingress: true
    egress: true
  baseline:
    prometheus:
      namespace: system
    ephemeralPorts:
      enabled: false
    egress:
      backstop:
        toFQDNs:
          - matchName: api.backstopsolutions.com
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP

# Alert when Backstop ignores a filter we sent (search_activities row check).
prometheus:
  additionalAlerts:
    BackstopFilterIgnored:
      alert: BackstopFilterIgnored
      annotations:
        summary: "Backstop ignored a filter the connector sent"
        description: "backstop_filter_ignored_total increased. A scoped activity search may be paging the wrong set. Increase over 15m: {{ $value }}."
      expr: increase(backstop_filter_ignored_total[15m]) > 0
      for: 1m
      labels:
        severity: warning
        alertGroup: backstop-mcp
