[project]
name = "q-bridge-mcp"
version = "0.1.0"
description = "Minimal FastMCP 4 hello-world server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.0.0b1",
]

[project.scripts]
q-bridge-mcp = "q_bridge_mcp.main:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/q_bridge_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/q_bridge_mcp" = "q_bridge_mcp"

[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b1"]

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
    "hatchling==1.31.0",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
include = ["src", "tests"]
reportMissingTypeStubs = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
