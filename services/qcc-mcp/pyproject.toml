[project]
name = "qcc-mcp"
version = "0.1.0"
description = "QCC KYC/KYB FastMCP connector (CN company & UBO). Local prototype — not deployed."
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.0.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[project.scripts]
qcc-mcp = "qcc_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcc_mcp"]
