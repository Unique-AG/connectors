# Calendar events. None has attendees (plan v2 S3), so no invitation leaves the mailbox.
# day:       days from the anchor date; a weekly series moves to the first `days` weekday on or after it
# start/end: local wall-clock time "HH:MM" in `time_zone` (a Windows time zone name)
# all_day:   true for an all-day event; start and end are then the day boundaries
events:
  - id: e01
    subject: Weekly project sync
    body: Status of the website relaunch, open points, next steps.
    location: Room Pilatus
    time_zone: W. Europe Standard Time
    day: 1
    start: "09:00"
    end: "09:30"
    recurrence: {type: weekly, days: [monday], count: 10}
  - id: e02
    subject: Company holiday
    body: The office is closed.
    time_zone: W. Europe Standard Time
    day: 3
    all_day: true
