# Every mail the seed creates. People are persona keys from personas.yaml, never addresses.
# owner:    the mailbox that holds the item (the run that creates it signs in as this persona)
# folder:   inbox | sentitems | drafts (Graph well-known names) or a key from folders.yaml
# received: "-<days>d HH:MM" in UTC, relative to the anchor date (default: the day of the run)
# body:     {type: text|html, content: ...}; content "" is an empty body
# subject:  leave it out for a message with no subject
# thread:   a key from `threads`; messages of one thread share one conversation index
threads:
  relaunch:
    topic: "Website relaunch: launch checklist"
  budget:
    topic: Q3 budget review
  offsite_dinner:
    topic: "Offsite: dinner reservation"
  laptop_thanks:
