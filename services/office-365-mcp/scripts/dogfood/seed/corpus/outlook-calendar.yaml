# One week of 40 short meetings, 8 for each day from Monday to Friday, two weeks after the next Monday.
bulk:
  phase: cal-bulk
  subject: Slot
  body: A short slot of the busy week.
  time_zone: W. Europe Standard Time
  week_shift: 14
  days: 5
  start: "08:00"
  step_minutes: 75
  per_day: 8
  length_minutes: 20

# Four events in the calendar of the seed team (phase cal-group, run by Mia after the phase teams).
group_events:
  - id: g01
    subject: Team standup
    body: Short status of every member.
    time_zone: W. Europe Standard Time
    day: nextMonday
    start: "09:00"
    end: "10:00"
  - id: g02
    subject: Release review
    body: Check the release notes.
    time_zone: W. Europe Standard Time
    day: nextMonday+1
    start: "14:00"
    end: "15:00"
  - id: g03
    subject: Retro
