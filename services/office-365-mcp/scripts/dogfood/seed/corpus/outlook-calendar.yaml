# Calendar, contact and calendar items of the outlook-calendar family.
# phase:      the seed phase that creates the event; the owner of the event runs it
# owner:      the persona that creates the event (default mia)
# day:        a number of days from the anchor date, or the first such weekday on or after
#             tomorrow with an optional shift (`nextMonday`, `nextMonday+1`). The recorder cases use the
#             same words as `~nextMonday+1`
# start/end:  local wall-clock time "HH:MM" in `time_zone` (a Windows time zone name)
# reminder:   minutes before the start; the reminder is on only when this is set
# attendees:  persona keys; an event with attendees sends one invitation when it is created
# answers:    what an attendee answers once: accept, decline or tentativelyAccept. Mia tags her own copy
#             of every invitation. Another attendee tags a copy only when it answers
# recurrence: `count` occurrences, daily or (type weekly) on `days`
# edits:      for a series: `move` shifts one occurrence by `days`, `cancel` cancels one occurrence
# attachment: the key of an entry of `attachments`
events:
  - id: c01
    phase: cal-events
    subject: Daily standup
    body: Yesterday, today, blockers.
    location: Room Pilatus
    time_zone: W. Europe Standard Time
    day: -1
    start: "09:15"
    end: "09:30"
    recurrence: {count: 10}
  - id: c02
    phase: cal-events
    subject: Submit the expense report
    body: Upload the receipts before the end of the day.
    time_zone: W. Europe Standard Time
    day: 0
    start: "16:00"
    end: "16:30"
    reminder: 15
  - id: c03
    phase: cal-events
    subject: Offsite agenda review
    body: Read the agenda before the call.
    time_zone: W. Europe Standard Time
    day: 0
    start: "11:00"
    end: "11:30"
    attachment: agenda
  - id: c04
    phase: cal-events
    subject: Budget alignment
    body: Agree the numbers before the review.
    time_zone: W. Europe Standard Time
    day: 0
    start: "13:00"
    end: "13:30"
    attendees: [anna]
  - id: c05
    phase: cal-events
    subject: Hosting review
    body: Check the hosting plan for the relaunch.
    time_zone: W. Europe Standard Time
    day: 0
    start: "14:00"
    end: "14:30"
    attendees: [anna]
  - id: c09
    phase: cal-events
    subject: Overlap A
    body: The first of two meetings that overlap.
    time_zone: W. Europe Standard Time
    day: nextTuesday
    start: "10:00"
    end: "11:00"
  - id: c10
    phase: cal-events
    subject: Overlap B
    body: The second of two meetings that overlap.
    time_zone: W. Europe Standard Time
    day: nextTuesday
    start: "10:30"
    end: "11:30"
  - id: c11
    phase: cal-events
    subject: Morning block
    body: Focus time. Nobody books this morning.
    time_zone: W. Europe Standard Time
    day: nextMonday
    start: "09:00"
    end: "12:00"
  - id: a11
    phase: cal-events
    owner: anna
    subject: Morning block Anna
    body: Month-end close. Nobody books this morning.
    time_zone: W. Europe Standard Time
    day: nextMonday
    start: "09:00"
    end: "12:00"
  - id: a12
    phase: cal-events
    owner: anna
    subject: Prep block
    body: Prepare the figures for the afternoon.
    time_zone: W. Europe Standard Time
    day: nextMonday
    start: "13:00"
    end: "13:30"
  - id: t-c01
    phase: cal-events
    owner: tom
    subject: Offsite day
    body: Whole day at the partner site.
    time_zone: W. Europe Standard Time
    day: nextWednesday
    start: "08:00"
    end: "18:00"
  - id: c06
    phase: cal-answers
    subject: Design workshop
    body: Sketch the pages of the relaunch together.
    location: Room Titlis
    time_zone: W. Europe Standard Time
    day: 1
    start: "10:00"
    end: "11:00"
    attendees: [anna, tom]
    answers:
      - {who: anna, response: accept, comment: I will bring the sketches.}
      - {who: tom, response: decline, comment: I am on call that day.}
  - id: c07
    phase: cal-answers
    subject: Content review
    body: Read the new copy and note the changes.
    location: Room Rigi
    time_zone: W. Europe Standard Time
    day: 1
    start: "11:30"
    end: "12:00"
    attendees: [anna, tom]
    answers:
      - {who: anna, response: tentativelyAccept, comment: I may join late.}
  - id: c08
    phase: cal-series
    subject: Weekly design sync
    body: Walk through the open design tasks.
    location: Room Pilatus
    time_zone: W. Europe Standard Time
    day: nextMonday-7
    start: "09:00"
    end: "09:30"
    attendees: [anna]
    recurrence: {type: weekly, days: [monday], count: 6}
    edits:
      move: {occurrence: 3, days: 1}
      cancel: {occurrence: 5, comment: The room is closed that day.}
  - id: a01
    phase: cal-invites
    owner: anna
    subject: Roadmap check
    body: Walk through the roadmap for the next quarter.
    time_zone: W. Europe Standard Time
    day: 0
    start: "15:00"
    end: "15:30"
    attendees: [mia]
  - id: a02
