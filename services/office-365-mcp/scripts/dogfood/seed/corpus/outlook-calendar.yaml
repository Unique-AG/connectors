# The working hours that two colleagues set, so that a comparison shows a difference.
# `default` is what the cleanup writes back.
settings:
  default: {days: [monday, tuesday, wednesday, thursday, friday], start: "08:00", end: "17:00"}
  time_zone: W. Europe Standard Time
  users:
    - {owner: anna, days: [monday, tuesday, wednesday, thursday], start: "08:00", end: "16:00"}
    - {owner: tom, days: [monday, tuesday, wednesday, thursday, friday], start: "07:00", end: "15:30"}

attachments:
  agenda:
    name: calendar-agenda.txt
    content_type: text/plain
    text: "Offsite agenda.\nMorning: workshop. Afternoon: review.\n"

