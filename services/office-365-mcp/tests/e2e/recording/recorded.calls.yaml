# The recording variant of each scenario that the recorder records. The chain comes from the
# scenario's entry in features/*.calls.yaml; a step number here replaces those keys of that step,
# exactly as a `variants` entry of a sidecar does. To land a recorded fixture, copy the block
# under `variants: recorded:` of the sidecar entry.
# The expectations hold for the seed corpus (scripts/dogfood/seed/corpus). They must not read a
# field that the scrub replaces (foreign text, foreign addresses): the recorder refuses that.
uc-02-01:
  fixture: rec-uc-02-01
  1:
    expect:
      result:
        "messages[0].subject": "Q3 budget: travel costs"
        "messages[0].is_read": false
        capped: false

uc-05-16:
  fixture: rec-uc-05-16
  1:
    args: {category: seed-v1, limit: 3}
  2:
    expect:
      result: {moved_count: 3, failed_count: 0}
      graph_calls: {POST /v1.0/me/messages/*/move: 3}

uc-01-06:
  fixture: rec-uc-01-06
  1:
    bind: {query: seed-v1 Project Plan}
    expect:
      result: {"files[0].name": seed-v1 Project Plan.docx}
      graph_calls: {POST /v1.0/search/query: 1}
  2:
    args: {}
    bind: {file: "$prev.files[0].uri"}
    expect:
      result:
        "content[0].resource.mimeType": application/vnd.openxmlformats-officedocument.wordprocessingml.document
      graph_calls: {GET /v1.0/drives/*/content: 1, GET /v1.0/drives/*: 1, GET /*/download.aspx: 1}
