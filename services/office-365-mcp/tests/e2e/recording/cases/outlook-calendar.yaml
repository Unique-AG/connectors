  chain:
    - tool: outlook_list_events
      args: {starts_on: "~nextMonday+14", ends_on: "~nextMonday+18", subject_contains: Slot, limit: 40}
      expect: {result: {capped: false, "events[0].subject": Slot 01, "events[39].subject": Slot 40}}

