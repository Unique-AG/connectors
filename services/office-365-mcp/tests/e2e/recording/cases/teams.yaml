      args: {message: seed-v1 case-teams_send_chat_message-mention hello}
      expect: {result: {"mentions[0].text": Anna Meier}}
      bind:
        chat_id: "$1.chats[0].chat_id"
        mentions:
          - user_id: "$prev.members[email=persona:anna].user_id"
            name: "$prev.members[email=persona:anna].display_name"

teams_send_chat_message_with_files-existing:
