teams_search_messages-lena:
  needs: [teams-seed-chats]
  chain:
    - tool: teams_search_messages
      args: {query: Lena Fischer, size: 3, include_body: true}
      expect: {result: {"messages[0].body_is_plain_text": true}}

teams_search_messages-person-window:
  needs: [teams-seed-chats]
