# Portable app defaults: hostname, TLS and NetworkPolicy-on live in the monorepo Argo overlay.

nameOverride: office-365-mcp
fullnameOverride: office-365-mcp
selectorComponentLabel: server

# Loki parses this pod's stderr as pino-json off this label.
podLabels:
  logging.unique.app/format: pino-json

env:
  APP_ENV: production
  LOG_LEVEL: info
  # Inert: the base chart appends PORT last, from ports.application, and that wins.
  PORT: "8000"
  OTEL_EXPORTER_OTLP_ENDPOINT:
    if: '{{ .Values.internalServices.dependencies.otelTraces.enabled }}'
    value: '{{ include "base.internalService.url" (dict "root" . "dep" .Values.internalServices.dependencies.otelTraces) }}'
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:
    if: '{{ .Values.internalServices.dependencies.otelTraces.enabled }}'
    value: '{{ include "base.internalService.url" (dict "root" . "dep" .Values.internalServices.dependencies.otelTraces) }}/v1/traces'
  OTEL_RESOURCE_ATTRIBUTES:
    if: '{{ .Values.internalServices.dependencies.otelTraces.enabled }}'
    value: 'deployment.environment={{ .Values.env.APP_ENV }}'
  # values.schema.json requires PUBLIC_BASE_URL, ENTRA_TENANT_ID, ENTRA_CLIENT_ID and exactly one
  # of the two keys below; the overlay supplies them. ENTRA_TENANT_ID must name a single tenant — a
  # multi-tenant authority is rejected at startup. The tool surface decides which delegated Graph
  # permissions every user consents to at sign-in, and which need an Entra administrator: README
  # has the preset table, and GET /manifest prints what a running deployment asks for.
  #   TOOLS_PRESET: teams
  #   TOOLS_ENABLED: get_me,list_chats

# Overlay must supply ENTRA_CLIENT_SECRET here — also the key material for the OAuth state rows,
# so rotating it costs every signed-in user one re-login. DB_URL too, unless postgresql.enabled.
envVars: []

image:
  registry: ghcr.io
  repository: unique-ag/connectors/services/office-365-mcp
  tag: 0.0.0 # x-release-please-version
  pullPolicy: IfNotPresent

ports:
  application: 8000

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 128Mi

probes:
  enabled: true
  # Liveness stays on /health (process-up) so a brief Postgres outage does not restart the pod;
  # readiness alone takes it out of service.
  liveness:
    failureThreshold: 6
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    failureThreshold: 6
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    # Must stay above _PROBE_TIMEOUT_SECONDS in server/readiness.py (2s), or the request is
    # abandoned before the handler can answer 503 itself.
    timeoutSeconds: 3
  startup:
    failureThreshold: 30
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  enabled: true

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi

volumeMounts:
  - name: tmp
    mountPath: /tmp

postgresql:
  enabled: true
  connection:
    sslMode: verify

rabbitmq:
  enabled: false

service:
  port: 80

internalServices:
  dependencies:
    otelTraces:
      enabled: false
      name: otel-traces
      servicePort: 4318
  dependents:
    ingressGateway:
      name: gateway
      namespace: system

routes:
  hostname: ""
  auth:
    jwt: false

# No migration hook: the OAuth state store creates its one table on first use, so the app's
# database user needs CREATE on its schema.

# Not base's `grafana.dashboards`: that hardcodes `grafana_folder: apps`, not mcp-servers.
grafana:
  dashboard:
    enabled: true
    folder: mcp-servers

networkPolicy:
  enabled: false
  flavor: cilium
  enableDefaultDeny:
    ingress: true
    egress: true
  baseline:
    # Prometheus lives in `system`, not the base chart's `monitoring` default, and `enabled: false`
    # emits no Prometheus rule at all — either way every scrape is dropped silently once an overlay
    # turns networkPolicy on. /metrics and the probes stay green; only the dashboard goes blank.
    prometheus:
      namespace: system
    ephemeralPorts:
      enabled: false
    # Entra sign-in and Graph both run server-side over 443. Without this, /ready still passes and
    # only logins fail.
    egress:
      microsoft:
        toFQDNs:
          - matchName: login.microsoftonline.com
          - matchName: graph.microsoft.com
          - matchPattern: "*.microsoft.com"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
