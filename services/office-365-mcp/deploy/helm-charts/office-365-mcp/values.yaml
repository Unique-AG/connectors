# Portable app defaults: hostname, TLS and NetworkPolicy-on live in the monorepo Argo overlay.

nameOverride: office-365-mcp
fullnameOverride: office-365-mcp
selectorComponentLabel: server

# Loki parses this pod's stderr as pino-json off this label.
podLabels:
  logging.unique.app/format: pino-json

env:
  APP_ENV: production
  LOG_LEVEL: info
  # Inert: the base chart appends PORT last, from ports.application, and that wins.
  PORT: "8000"
  OTEL_EXPORTER_OTLP_ENDPOINT:
    if: '{{ .Values.internalServices.dependencies.otelTraces.enabled }}'
    value: '{{ include "base.internalService.url" (dict "root" . "dep" .Values.internalServices.dependencies.otelTraces) }}'
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:
    if: '{{ .Values.internalServices.dependencies.otelTraces.enabled }}'
    value: '{{ include "base.internalService.url" (dict "root" . "dep" .Values.internalServices.dependencies.otelTraces) }}/v1/traces'
  OTEL_RESOURCE_ATTRIBUTES:
    if: '{{ .Values.internalServices.dependencies.otelTraces.enabled }}'
    value: 'deployment.environment={{ .Values.env.APP_ENV }}'

# The office-365-mcp-entra-application Terraform module's `deployment_env` output publishes
# app.publicBaseUrl/entra.tenantId/entra.clientId/tools.enabled in this exact shape per
# confidential_clients key — copy it across rather than assembling it by hand. clientSecret is
# separate (it's a secret, not in deployment_env): set it from the same module's `client_secrets`
# output. fromSecretProvider.secretKey is that output's key_vault_secret_name; fromSecretProvider
# is auto-collected into this chart's SecretProviderClass, so no secretProvider.vaults entry is
# needed beyond secretProvider.tenantId/userAssignedIdentityID. No default given for clientSecret:
# it is genuinely mandatory and, unlike the fail-guards below, an object can't sentinel itself.
mcpConfig:
  app:
    publicBaseUrl: '{{ fail "mcpConfig.app.publicBaseUrl is mandatory. Override in your deployment values." }}'
  entra:
    tenantId: '{{ fail "mcpConfig.entra.tenantId is mandatory. Override in your deployment values." }}'
    clientId: '{{ fail "mcpConfig.entra.clientId is mandatory. Override in your deployment values." }}'
    # clientSecret:
    #   fromSecretProvider:
    #     vault: <key-vault-name>
    #     secretKey: <client_secrets[key].key_vault_secret_name output>
  # Set exactly one. Neither is defaulted on purpose — see values.additional.schema.json.
  #   preset: teams
  #   enabled: get_me,list_chats
  tools: {}

# DB_URL must be supplied here unless postgresql.enabled.
envVars: []

image:
  registry: ghcr.io
  repository: unique-ag/connectors/services/office-365-mcp
  tag: 0.0.0 # x-release-please-version
  pullPolicy: IfNotPresent

ports:
  application: 8000

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 128Mi

probes:
  enabled: true
  # Liveness stays on /health (process-up) so a brief Postgres outage does not restart the pod;
  # readiness alone takes it out of service.
  liveness:
    failureThreshold: 6
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    failureThreshold: 6
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    # Must stay above _PROBE_TIMEOUT_SECONDS in server/readiness.py (2s), or the request is
    # abandoned before the handler can answer 503 itself.
    timeoutSeconds: 3
  startup:
    failureThreshold: 30
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  enabled: true

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi

volumeMounts:
  - name: tmp
    mountPath: /tmp

postgresql:
  enabled: true
  connection:
    sslMode: verify

rabbitmq:
  enabled: false

service:
  port: 80

internalServices:
  dependencies:
    otelTraces:
      enabled: false
      name: otel-traces
      servicePort: 4318
  dependents:
    ingressGateway:
      name: gateway
      namespace: system

routes:
  hostname: ""
  auth:
    jwt: false

# No migration hook: the OAuth state store creates its one table on first use, so the app's
# database user needs CREATE on its schema.

# Not base's `grafana.dashboards`: that hardcodes `grafana_folder: apps`, not mcp-servers.
grafana:
  dashboard:
    enabled: true
    folder: mcp-servers

networkPolicy:
  enabled: false
  flavor: cilium
  enableDefaultDeny:
    ingress: true
    egress: true
  baseline:
    # Prometheus lives in `system`, not the base chart's `monitoring` default, and `enabled: false`
    # emits no Prometheus rule at all — either way every scrape is dropped silently once an overlay
    # turns networkPolicy on. /metrics and the probes stay green; only the dashboard goes blank.
    prometheus:
      namespace: system
    ephemeralPorts:
      enabled: false
    # Entra sign-in and Graph both run server-side over 443. Without this, /ready still passes and
    # only logins fail.
    egress:
      microsoft:
        toFQDNs:
          - matchName: login.microsoftonline.com
          - matchName: graph.microsoft.com
          - matchPattern: "*.microsoft.com"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
