# CI-safe overrides — no external Postgres/secrets required for helm template.
postgresql:
  enabled: false

# Placeholders so `helm template` clears office-365-mcp.validateValues at the chart's real
# APP_ENV: production default, instead of masking it behind a non-production override.
# tools.preset stands in for the overlay's own choice: the chart deliberately defaults no tool
# surface, so a render without one is meant to fail schema validation.
mcpConfig:
  app:
    publicBaseUrl: https://office-365-mcp.ci.example.com
  entra:
    tenantId: 00000000-0000-0000-0000-000000000000
    clientId: 11111111-1111-1111-1111-111111111111
    clientSecret:
      fromSecret:
        name: office-365-mcp-ci-dummy
        key: client-secret
  tools:
    preset: teams
