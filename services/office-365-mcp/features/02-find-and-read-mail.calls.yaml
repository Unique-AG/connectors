uc-02-11:
  status: gap
  ask: "Show me the unread messages in the finance mailbox."
  blocker:
    kind: tool
    tool: outlook_list_mail
    text: The tool has no advice for a refused mailbox, so the answer blames the app registration (Mail.Read.Shared) and not the missing access of Mia.
    user: The assistant says that an administrator must grant the connector a permission, and not that Mia has no access to the mailbox.
  provenance: drafted
  asks_user: false
  chain: []

