uc-02-17:
  status: untested
  ask: "Find the messages that Anna sent me."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_search_mail
      args: {sender: Anna}
  note: >-
    Expected behaviour per Examples row. Sign-in expired, shared/seam.py:520-525, ask the user to
    sign in again, because retrying unchanged fails the same way. Access refused, seam.py:528-537
    (outlook_search_mail has no GRAPH_FORBIDDEN text), an administrator grants Mail.Read, User.Read
    and Mail.Read.Shared to the app registration, and retrying will not help. Search words not
    valid, seam.py:579-584, a bad request that fails the same way, with the reason that Microsoft
    gives. Busy, seam.py:509-513, left alone for 30 seconds, retry after that and not sooner. Cannot
    answer now with a wait of 90 seconds, seam.py:514-518, retry after that and not sooner, and not
    in a loop. No wait time, seam.py:503-508, wait before retrying and not in a loop; the SDK
    waits a random time of about 4 seconds between tries then, so the run checks the 4 tries and not the
    waits. The waiting rows reach the assistant only when every try is busy: the search is
    a GET, so the SDK retry handler waits out up to 3 busy answers (graph_client/client.py:339-342,
    config.py:126), and the variant busy gives 4 busy answers. One busy answer is uc-02-32. OPEN: 4
    busy answers in a row take about 90 s (about 270 s at a wait of 90 seconds), longer than the 60 s
    tool limit of node-chat. A failed search is never an empty result, so no row says that no message matches.
  variants:
    busy:
      fixture: uc-02-17
      1:
        fault: {graph: {status: 429, headers: {Retry-After: "30"}, body: error.TooManyRequests.json}, times: 4}
        expect:
          tool_error:
            shared.seam._remedy:
              failure: {graph_client.GraphThrottled: {message: "", status: 429, code: null, request_id: null, retry_after_seconds: 30}}
              permissions: tools.outlook_search_mail.GRAPH_PERMISSIONS
              not_found: null
              repeatable: true
              shown_by: []
              forbidden: null
          graph_calls: {GET /v1.0/me/messages: 4}
          retry_sleeps: [30.0, 30.0, 30.0]
    busy-without-a-wait-time:
      fixture: uc-02-17
      1:
        fault: {graph: {status: 429, body: error.TooManyRequests.json}, times: 4}
        expect:
          tool_error:
            shared.seam._remedy:
              failure: {graph_client.GraphThrottled: {message: "", status: 429, code: null, request_id: null, retry_after_seconds: null}}
              permissions: tools.outlook_search_mail.GRAPH_PERMISSIONS
              not_found: null
              repeatable: true
              shown_by: []
              forbidden: null
          graph_calls: {GET /v1.0/me/messages: 4}

