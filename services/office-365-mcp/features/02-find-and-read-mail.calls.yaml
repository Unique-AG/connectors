uc-02-06:
  status: untested
  ask: "Read the Contract draft message to me and tell me what is attached."
  provenance: observed
  evidence: outlook_search_mail then outlook_read_mail in 4 sessions; outlook_list_mail then outlook_read_mail in 4 sessions
  asks_user: false
  chain:
    - any_of: [outlook_search_mail, outlook_list_mail]
    - tool: outlook_read_mail
      uses: {uri: uri of the message from the previous step}

uc-02-07:
  status: partly
  ask: "What is the total in the last row of the Excel file that Anna attached?"
  blocker:
    kind: unknown
    tool: outlook_read_attachment
    text: The tool returns the workbook in its own format. Its description says that it does not turn a document into text. No run shows that the assistant can read an Excel file in that form, so the cause is not known.
    user: The assistant may not be able to read the numbers inside an Excel attachment.
  provenance: drafted
  asks_user: false
  chain:
    - any_of: [outlook_list_attachments, outlook_read_mail]
    - tool: outlook_read_attachment
      uses: {uri: uri of the workbook}
  note: the same limit as the file read in the SharePoint feature, where no tool gives a document as text

uc-02-08:
  status: untested
  ask: "Read the PDF that Anna attached to her message."
  provenance: drafted
  asks_user: false
  chain:
    - any_of: [outlook_list_attachments, outlook_read_mail]
    - tool: outlook_read_attachment
      optional: true
      uses: {uri: uri of the attachment}
  note: the listing gives the size, so the assistant can refuse before it reads. The tool refuses above 10 MB

