uc-16-10:
  status: untested
  tests:
    - "tests/tools/test_sharepoint_update_list_item.py::test_a_changed_row_is_a_tool_error_that_sends_the_model_to_read_again"
  ask: "Set the status of Close books in the Tasks list to Closed."
  provenance: drafted
  asks_user: true
  chain:
    - tool: sharepoint_list_lists
    - tool: sharepoint_list_items
      uses: {list: uri of the Tasks list}
    - tool: sharepoint_update_list_item
      args: {fields: {Status: Closed}}
      uses: {item: uri of the item Close books}
    - tool: sharepoint_list_items
      uses: {list: uri of the Tasks list}
  note: "The update sends the eTag of the item it read as If-Match. When somebody changed the item since, Microsoft answers 412, and the tool error sends the assistant back to sharepoint_list_items. It does not retry."

