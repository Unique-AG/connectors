uc-16-01:
  status: untested
  tests:
    - "tests/tools/test_sharepoint_list_lists.py::test_it_returns_visible_lists_and_leaves_out_hidden_lists_and_libraries"
  ask: "Which lists does the Finance site have?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: sharepoint_search_sites
      args: {query: Finance}
    - tool: sharepoint_list_lists
      uses: {site: web address of the Finance site from sharepoint_search_sites}

uc-16-02:
  status: untested
  tests:
    - "tests/tools/test_sharepoint_list_lists.py::test_a_value_that_is_not_a_site_url_makes_no_graph_call"
  ask: "Which lists does Finance have?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: sharepoint_list_lists
      optional: true
      args: {site: Finance}
    - tool: sharepoint_search_sites
      args: {query: Finance}
    - tool: sharepoint_list_lists
      uses: {site: web address of the Finance site from sharepoint_search_sites}
  note: "sharepoint_list_lists refuses a value that is not a web address, such as a site name or a list handle, before it calls Microsoft, and its error sends the assistant to sharepoint_search_sites. The first step is optional because the description already asks for a web address."

