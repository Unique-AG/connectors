  asks_user: true
  chain:
    - tool: outlook_list_events
      args: {subject_contains: Launch review}
    - tool: outlook_read_event
      optional: true
      uses: {uri: uri of the event from the listing}
    - tool: outlook_respond_to_invite
      args: {response: decline, proposed_new_time: {starts_at: Monday 10:00, ends_at: Monday 10:30, time_zone: Europe/Zurich}}
      uses: {uri: uri of the event from the listing}
  note: the tool sends a proposal only with decline or tentative. outlook_read_event shows allow_new_time_proposals, so the assistant can check the choice of the organizer first.

