uc-07-22:
  status: untested
  provenance: drafted
  ask: "Book the Launch review on Monday at 14:00 with Anna and Tom."
  asks_user: true
  chain:
    - tool: outlook_create_event
      args: {subject: Launch review, starts_at: Monday 14:00, ends_at: Monday 14:30, attendees: Anna and Tom}
      bind: {starts_at: "2026-11-02T14:00", ends_at: "2026-11-02T14:30", time_zone: UTC, attendees: [anna@example.invalid, tom@example.invalid]}
      approval: "yes"
      expect:
        tool_error: {shared.seam._outcome_unknown: [tools.outlook_create_event.CHANGE_SHOWN_BY]}
        graph_calls: {GET /v1.0/me/calendar: 1, POST /v1.0/me/events: 1}
    - tool: outlook_list_events
      args: {subject_contains: Launch review}
      bind: {starts_on: "2026-11-02", ends_on: "2026-11-03"}
      expect:
        result: {events: []}
  note: "expected behaviour from shared/seam.py:451-470 _OUTCOME_UNKNOWN: this connector does not know if Microsoft made the change, do not call this tool again first, make sure the change is not already there with outlook_list_events (tools/outlook_create_event.py:94). The same advice is chosen at shared/seam.py:546-548 because the tool is not read-only and not idempotent. The create runs once. A second create follows only when the listing shows no Launch review. The create sends a transaction id that is the same for the same details (tools/outlook_create_event.py:418), but the advice does not rely on it. The write is not repeated by the SDK (graph_client/client.py:220-232)."
  variants:
    fails:
      fixture: uc-07-22
      1: {fault: {graph: {status: 503}, at: POST */events}}
    no-answer-in-time:
      fixture: uc-07-22
      1: {fault: {transport: timeout, at: POST */events}}

