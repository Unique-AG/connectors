uc-07-08:
  status: partly
  provenance: drafted
  ask: "Save an invitation for the Board prep on Monday from 10:00 to 11:00 as a draft, so that I can finish it later."
  blocker:
    kind: graph
    tool: outlook_create_event
    text: A Microsoft 365 calendar event has no draft state, so an event with an attendee goes out in the same call.
    user: The assistant cannot keep a real invitation draft. It can save the meeting without attendees and add them after Mia approves.
  asks_user: false
  chain:
    - tool: outlook_create_event
      args: {subject: Board prep, starts_at: Monday 10:00, ends_at: Monday 11:00, time_zone: Europe/Zurich, attendees: []}
  note: "the workaround creates the event with an empty `attendees` list and the required `time_zone` (tools/outlook_create_event.py:657-690), and it asks nothing, because the tool asks only for an event with an attendee, a room, or a location (:123-125). Adding the attendees is a separate later request, after Mia finishes: outlook_update_event with `attendees` and `optional_attendees` together (tools/outlook_update_event.py:159-166 and :433-437 refuse one list alone), and that call asks Mia (:110-113). The update is not a step of this chain."

uc-07-09:
  status: partly
  provenance: drafted
  ask: "Put the Offsite on my Team calendar."
  blocker:
    kind: description
    tool: outlook_create_event_on_behalf
    text: outlook_create_event takes no calendar argument. The description of outlook_create_event_on_behalf says that it is only for a calendar that somebody else owns, so the assistant does not pick it for a second calendar of Mia.
    user: The assistant may not put a meeting on a second calendar of Mia. Nobody tested it.
  asks_user: true
  chain:
    - tool: outlook_list_calendars
    - tool: outlook_create_event_on_behalf
      args: {subject: Offsite, attendees: none}
      uses: {calendar_ref: handle of the calendar Team}
  note: outlook_create_event_on_behalf checks only that the calendar is editable, so it can write to a second calendar of Mia. Nobody ran it.

