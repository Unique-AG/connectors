uc-07-19:
  status: untested
  provenance: drafted
  ask: "Find 30 minutes on Monday when Anna, Tom, and I are all free."
  asks_user: false
  chain:
    - tool: outlook_check_availability
      args: {addresses: Anna and Tom, starts_at: Monday 08:00, ends_at: Monday 18:00}
  note: "expected behaviour from shared/seam.py, one row each. Sign-in expired, :520-525: ask the user to sign in to this connector again. No access, :528-537: ask a Microsoft 365 administrator to grant the permission, retrying will not help. Busy with a wait of 30 seconds, :509-513: retry after that, not sooner. Rejected question, :579-584: a bad request that fails the same way again, with the reason of Microsoft. The retry handler of the SDK waits out a single busy answer on a read (graph_client/client.py:339-342, config.py:126; uc-07-35), so the busy row means busy through every try."

