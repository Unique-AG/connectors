uc-05-10:
  status: partly
  ask: "Create a red category Follow-up Q4 and put it on my unread messages from Tom Berger."
  provenance: drafted
  asks_user: false
  blocker:
    kind: preset
    tool: outlook_create_category
    text: no single preset holds both outlook_create_category and outlook_mark_mail, so this needs two presets or a custom `enabled` list
    user: The assistant creates the category and puts it on mail only when the administrator has turned on both groups of tools.
  chain:
    - tool: outlook_list_categories
      optional: true
    - tool: outlook_create_category
      args: {name: Follow-up Q4, color: preset0}
    - tool: outlook_find_recipient
      args: {query: Tom Berger}
    - tool: outlook_list_mail
      args: {unread_only: true}
      uses: {from_address: address of Tom Berger from outlook_find_recipient}
    - tool: outlook_mark_mail
      args: {add_categories: Follow-up Q4}
      uses: {message_refs: uri values from the listing}

uc-05-11:
  status: partly
  ask: "Make a rule that moves mail from billing@example.com to my Finance folder."
  provenance: drafted
  asks_user: false
  blocker:
    kind: preset
    tool: outlook_create_mail_rule
    text: no preset holds both outlook_browse_folders and outlook_create_mail_rule, so this needs two presets or a custom `enabled` list
    user: The assistant cannot find the folder for a rule unless the administrator turns on the folder tools next to the rule tools.
  chain:
    - tool: outlook_get_mailbox_settings
    - tool: outlook_browse_folders
    - tool: outlook_create_mail_rule
      args: {display_name: Billing to Finance, conditions: sender billing}
      uses: {sequence: next free sequence from outlook_get_mailbox_settings, actions: move_to_folder is the uri of Finance from outlook_browse_folders}

