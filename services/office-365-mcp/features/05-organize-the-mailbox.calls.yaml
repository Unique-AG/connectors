uc-05-22:
  status: partly
  ask: "Rename my category Follow-up Q4 to Follow-up Q1."
  provenance: drafted
  asks_user: false
  blocker:
    kind: graph
    tool: outlook_create_category
    text: the `name` field of outlook_create_category says the name cannot change after the call, and no tool renames or deletes a category
    user: The assistant cannot rename a category. It makes a new category with the new name and moves the 4 messages to it. The old category stays in the list.
  chain:
    - tool: outlook_create_category
      args: {name: Follow-up Q1}
    - any_of: [outlook_list_mail, outlook_search_mail]
    - tool: outlook_mark_mail
      args: {add_categories: [Follow-up Q1], remove_categories: [Follow-up Q4]}
      uses: {message_refs: uri values of the messages that carry Follow-up Q4}
  note: no preset holds both outlook_create_category and outlook_mark_mail, so this also needs two presets or a custom `enabled` list

uc-05-23:
  status: partly
  ask: "Make a rule that moves the mail I do not need to my Archive folder."
  provenance: drafted
  asks_user: false
  blocker:
    kind: description
    tool: outlook_create_mail_rule
    text: the tool asks only before a rule that forwards or redirects mail, and the `conditions` field says to omit it to make a rule for every incoming message. Nothing in the description tells the model to ask the user first when the user gave no condition.
    user: The assistant may create a rule for every new message without asking which mail Mia means.
  chain:
    - tool: outlook_get_mailbox_settings
    - tool: outlook_create_mail_rule
      args: {display_name: Mail I do not need, actions: {move_to_folder: archive}}
      uses: {sequence: next free sequence from outlook_get_mailbox_settings, conditions: the mail that Mia names after the assistant asks}
  note: the assistant calls the create tool only after Mia names the mail or agrees. The tool creates a rule with no condition when `conditions` is omitted.

