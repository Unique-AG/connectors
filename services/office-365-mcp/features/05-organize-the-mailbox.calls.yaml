  note: "expected behaviour from shared/seam.py:236-241 and 227-233, one text for each Examples row. Declines (_not_agreed): nothing was changed, say that the request was not confirmed, and it is not a failure. No answer (_no_answer): the connector received no answer and Mia can make the same request again. The one cause of that row is that the chat program answers the question with an error that is not METHOD_NOT_FOUND or INVALID_REQUEST (seam.py:255-263). A question that never gets an answer is not a cause: the server sets no time limit (fastmcp/server/context.py:1091-1095, mcp/server/session.py:97 and :113-114), so the call waits until the client cancels it, and a cancelled call returns no text. This text exists only on a connection that uses the older protocol (seam.py:208-211 and :293). uc-05-05 states the question."

