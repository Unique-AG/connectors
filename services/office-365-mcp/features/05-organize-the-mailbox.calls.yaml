uc-05-26:
  status: untested
  ask: "File these 3 messages in my Archive folder."
  provenance: drafted
  evidence: outlook_move_mail failed 17 times in 15 sessions; the 4 newest passed a value that is not a message handle, and nothing moved (features/README.md, What the usage shows)
  asks_user: false
  chain:
    - any_of: [outlook_search_mail, outlook_list_mail]
      pick: outlook_list_mail
    - tool: outlook_move_mail
      args: {destination: archive}
      uses: {message_refs: 2 uri values from the listing and 1 value that is not a message handle}
    - any_of: [outlook_search_mail, outlook_list_mail]
      pick: outlook_list_mail
      optional: true
    - tool: outlook_move_mail
      args: {destination: archive}
      uses: {message_refs: all 3 uri values from the new listing}
      bind: {message_refs: "$prev.messages[*].uri"}
      expect:
        result: {moved_count: 3, failed_count: 0}
        graph_calls: {POST /v1.0/me/messages/*/move: 3}
  note: "expected behaviour from tools/outlook_move_mail.py:112 (_NOT_A_MESSAGE_HANDLE): a subject line, an email address, an Outlook web link, a bare message id and a folder or rule handle are not handles. The tool checks every handle before any message moves, so nothing moved, and the assistant fixes the value and calls again with the whole batch. The first call makes no Microsoft call. The second listing is optional, because the first listing already holds the right uri values. The logs show the failing move and no arguments (features/README.md, What the usage shows), so the batch of 2 plus 1 and the 5 wrong values are drafted. uc-05-03 states the success side."
  variants:
    subject-line:
      cassette: uc-05-26
      2:
        fault: {input: {message_refs: ["$prev.messages[0].uri", "$prev.messages[1].uri", "$prev.messages[2].subject"]}}
        expect: {tool_error: tools.outlook_move_mail._NOT_A_MESSAGE_HANDLE, graph_calls: {}}

