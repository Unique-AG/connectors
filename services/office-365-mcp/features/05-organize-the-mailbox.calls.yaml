uc-05-01:
  status: working
  ask: "File the 8 newsletters from last month in my Newsletters folder."
  provenance: drafted
  evidence: outlook_list_mail then outlook_move_mail in 3 sessions; one session made 20 consecutive outlook_move_mail calls
  asks_user: false
  chain:
    - any_of: [outlook_search_mail, outlook_list_mail]
    - tool: outlook_browse_folders
      repeat: many
    - tool: outlook_move_mail
      uses: {message_refs: all uri values from the previous listing, folder_ref: uri of Newsletters from outlook_browse_folders}
  note: the tool takes many handles in one call, so 20 consecutive calls may mean one call for each message. The server logs hold no arguments, so this is not checked.

uc-05-02:
  status: working
  ask: "Mark all 8 newsletters from last month as read."
  provenance: observed
  evidence: outlook_mark_mail in 12 sessions; outlook_mark_mail then outlook_move_mail 11 times
  asks_user: false
  chain:
    - any_of: [outlook_search_mail, outlook_list_mail]
    - tool: outlook_mark_mail
      args: {is_read: true}
      uses: {message_refs: all uri values from the previous listing}

uc-05-03:
  status: partly
  ask: "File these 5 messages in my Archive folder."
  provenance: observed
  evidence: 17 failures in 15 sessions; the 4 newest passed a value that is not a message handle, and nothing moved
  asks_user: false
  blocker:
    kind: unknown
    tool: outlook_move_mail
    text: the logs hold no arguments, so the cause is not known. A probable cause is that the assistant takes another field for the handle. The message_refs field says "`uri` values from a search, list, or thread result". But MailSummary.uri says only to pass it to outlook_read_mail, and listings also show folder_id and web_link.
    user: The assistant sometimes cannot move mail at first, because it names a message in the wrong way. It then searches again and moves the messages.
  chain:
    - any_of: [outlook_search_mail, outlook_list_mail]
    - tool: outlook_move_mail
      uses: {message_refs: uri values from the previous listing and never a subject}
  note: the tool checks every handle before it moves a message, so one wrong value stops the whole batch

