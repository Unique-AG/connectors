uc-06-18:
  status: untested
  ask: "Which of my Teams chats have unread messages?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: teams_list_chats
      args: {limit: 50}
  note: "The failing step is teams_list_chats. A read waits out one busy answer before the assistant sees anything (src/office_365_mcp/graph_client/client.py:339-342 and src/office_365_mcp/config.py:126: up to 3 retries, each after the time that Microsoft states), so the advice reaches the assistant only when every try gets the busy answer; the code does not ask again before the stated time. Row 1, expected behaviour from src/office_365_mcp/shared/seam.py:509-513: retry after the stated seconds, not sooner. Row 2, from src/office_365_mcp/shared/seam.py:514-518: Microsoft is rate-limiting or too busy to answer; retry after the stated seconds, not sooner, and not in a loop."
  variants:
    limited:
      fixture: uc-06-01
      1:
        fault: {graph: {status: 429, headers: {Retry-After: "30"}, body: error.TooManyRequests.json}, times: 4}
        expect:
          tool_error:
            shared.seam._remedy:
              failure: {graph_client.GraphThrottled: {message: "", status: 429, code: null, request_id: null, retry_after_seconds: 30}}
              permissions: tools.teams_list_chats.GRAPH_PERMISSIONS
              not_found: null
              repeatable: true
              shown_by: []
              forbidden: null
          graph_calls: {GET /v1.0/me/chats: 4}
          retry_sleeps: [30.0, 30.0, 30.0]
    too-busy:
      fixture: uc-06-01
      1:
        fault: {graph: {status: 503, headers: {Retry-After: "120"}}, times: 4}
        expect:
          tool_error:
            shared.seam._remedy:
              failure: {graph_client.GraphThrottled: {message: "", status: 503, code: null, request_id: null, retry_after_seconds: 120}}
              permissions: tools.teams_list_chats.GRAPH_PERMISSIONS
              not_found: null
              repeatable: true
              shown_by: []
              forbidden: null
          graph_calls: {GET /v1.0/me/chats: 4}
          retry_sleeps: [120.0, 120.0, 120.0]

uc-06-19:
  status: untested
  ask: "What is unread in my Teams chats?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: teams_list_chats
      args: {limit: 50}
    - tool: teams_list_chats
      args: {limit: 50}
  note: "The first step fails, and the second step is the single retry. The tool is read-only, so the advice is to retry once. Expected behaviour from src/office_365_mcp/shared/seam.py:546-553: retry once; if it fails again the same way, stop and report it. Row 1 is a Microsoft error above 499 (src/office_365_mcp/graph_client/errors.py:332-337), row 2 is a timeout or lost connection (errors.py:218-227), row 3 is an answer that cannot be read (errors.py:238-247). Row 4 is a list that never ends (src/office_365_mcp/shared/seam.py:562-570: retry once if the list matters; if it happens again, stop and report it)."

