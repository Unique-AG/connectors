    - tool: teams_search_messages
      args: {query: pricing change}
    - tool: teams_read_message
      optional: true
      uses: {uri: uri of a hit}

uc-06-04:
  status: partly
  ask: "What happened in the Releases channel this week?"
  blocker:
    kind: parameter
    tool: teams_browse_channel
    text: The tool has no date bound, orders posts by reply activity, and reads at most 50 posts with no paging, so a busy channel can hide posts of the week.
    user: The assistant may miss posts of a busy channel when it reads a whole week.
  provenance: drafted
  asks_user: false
  chain:
    - tool: teams_list_my_teams
    - tool: teams_list_channels
      uses: {team_id: id of the team}
    - tool: teams_browse_channel
      args: {include_window_completeness: true}
      uses: {team_id: id of the team, channel_id: id of the channel}
    - tool: teams_list_message_replies
      optional: true
      uses: {uri: uri of a post}

