uc-06-18:
  status: working
  ask: "Which of my Teams chats have unread messages?"
  provenance: drafted
  asks_user: false
  tests:
    - "tests/e2e/test_scenarios.py::test_the_scenario_runs_as_its_sidecar_says[uc-06-18/limited]"
    - "tests/e2e/test_scenarios.py::test_the_scenario_runs_as_its_sidecar_says[uc-06-18/too-busy]"
  chain:
    - tool: teams_list_chats
      args: {limit: 50}
  note: "The failing step is teams_list_chats. A read waits out one busy answer before the assistant sees anything (src/office_365_mcp/graph_client/client.py:339-342 and src/office_365_mcp/config.py:127: up to 3 retries, each after the time that Microsoft states), so the advice reaches the assistant only when every try gets the busy answer; the code does not ask again before the stated time. Row 1, expected behaviour from src/office_365_mcp/shared/seam.py:509-513: retry after the stated seconds, not sooner. Row 2, from src/office_365_mcp/shared/seam.py:514-518: Microsoft is rate-limiting or too busy to answer; retry after the stated seconds, not sooner, and not in a loop."
  variants:
    limited:
      fixture: uc-06-01
      1:
        fault: {graph: {status: 429, headers: {Retry-After: "30"}, body: error.TooManyRequests.json}, times: 4}
        expect:
          tool_error:
            shared.seam._remedy:
              failure: {graph_client.GraphThrottled: {message: "", status: 429, code: null, request_id: null, retry_after_seconds: 30}}
              permissions: tools.teams_list_chats.GRAPH_PERMISSIONS
              not_found: null
              repeatable: true
              shown_by: []
              forbidden: null
          graph_calls: {GET /v1.0/me/chats: 4}
          retry_sleeps: [30.0, 30.0, 30.0]
    too-busy:
      fixture: uc-06-01
      1:
        fault: {graph: {status: 503, headers: {Retry-After: "120"}}, times: 4}
        expect:
          tool_error:
            shared.seam._remedy:
              failure: {graph_client.GraphThrottled: {message: "", status: 503, code: null, request_id: null, retry_after_seconds: 120}}
              permissions: tools.teams_list_chats.GRAPH_PERMISSIONS
              not_found: null
              repeatable: true
              shown_by: []
              forbidden: null
          graph_calls: {GET /v1.0/me/chats: 4}
          retry_sleeps: [120.0, 120.0, 120.0]

