uc-06-15:
  status: partly
  ask: "Summarize the Budget review that is on my calendar."
  blocker:
    kind: description
    tool: teams_list_meeting_transcripts
    text: The description of meeting_uri says to copy the handle verbatim from teams_list_chats, and only a meeting chat gives it. The join_url of a calendar event should be the address that the handle wraps, as teams:///meetings/ plus the percent-encoded join address, but no description says so and nobody ran it.
    user: The assistant may not be able to read the transcript of a meeting that has no meeting chat. Nobody tested it.
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_list_events
      args: {starts_on: yesterday, ends_on: yesterday, subject_contains: Budget review}
    - tool: teams_list_chats
      optional: true
      args: {chat_type: meeting, topic_contains: Budget review}
    - tool: teams_list_meeting_transcripts
      uses: {meeting_uri: "uri of the meeting chat, or teams:///meetings/ plus the percent-encoded join_url of the event"}
    - tool: teams_read_transcript
      uses: {uri: uri of the transcript}


