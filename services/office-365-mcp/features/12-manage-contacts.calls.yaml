uc-12-05:
  status: untested
  ask: "What is the email address of Anna Meier?"
  provenance: drafted
  asks_user: false
  chain:
    - any_of: [outlook_find_recipient, outlook_list_contacts]
    - tool: outlook_read_contact
      optional: true
      uses: {uri: uri of the contact}
  note: outlook_find_recipient ranks Anna Meier exact and Anna Weber fuzzy, and its description sends the assistant there for an address. The contact listing has no name filter, so the assistant reads the names and checks that capped is false

uc-12-06:
  status: untested
  ask: "What is the telephone number of Anna Meier?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_list_contacts
      args: {limit: 200}
  note: >-
    Expected behaviour per Examples row. Sign-in expired, shared/seam.py:520-525, ask the user to
    sign in again. Access refused, seam.py:528-537 (the tool has no GRAPH_FORBIDDEN text), an
    administrator grants Contacts.Read to the app registration, and retrying will not help. Busy,
    seam.py:509-513, left alone for 30 seconds, retry after that and not sooner. This text reaches
    the assistant only when every try is busy: the listing is a GET, so the SDK retry handler waits
    out up to 3 busy answers (graph_client/client.py:339-342, config.py:126). One busy answer is
    uc-12-19. A failed lookup is never a person who is not in the contacts.

uc-12-07:
  status: untested
  ask: "What is the telephone number of Anna Meier?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_list_contacts
      args: {limit: 200}
    - tool: outlook_list_contacts
      args: {limit: 200}
  note: >-
    Expected behaviour from shared/seam.py:549-553, for a read-only tool that Microsoft could not
    reach or that failed internally, retry once. All three Examples rows give that one advice. A
    status of 500 or more, graph_client/errors.py:332-335. A timeout or lost connection,
    errors.py:218-227. An answer that cannot be read, errors.py:238-247.

uc-12-08:
  status: untested
  ask: "What is the telephone number of Anna Meier?"
