uc-12-09:
  status: untested
  ask: "What is the mobile number of Anna Meier?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_list_contacts
    - any_of: [outlook_read_contact, outlook_update_contact]
    - tool: outlook_list_contacts
  note: >-
    Expected behaviour per Examples row. Read, tools/outlook_read_contact.py:34-41, one 404 means a
    deleted contact, a contact that never existed, or a contact that this user cannot see, the tool
    cannot tell which, find the contact again with outlook_list_contacts and read it with the new
    uri. Change, tools/outlook_update_contact.py:50-56, the same text, and nothing was changed. The
    second row asks for a change, so its chain has outlook_update_contact. Neither text lets the
    assistant claim a deletion.

uc-12-10:
  status: untested
  ask: "Save Tom Berger of Acme as a contact with the address tom@acme.example."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_create_contact
      args: {given_name: Tom, surname: Berger, company_name: Acme, email_addresses: tom@acme.example}
  note: >-
    Expected behaviour per Examples row. Sign-in expired, shared/seam.py:520-525, ask the user to
    sign in again. Access refused, seam.py:528-537, an administrator grants Contacts.ReadWrite to the
    app registration. Busy, seam.py:509-513, left alone for 30 seconds, retry after that and not
    sooner. Microsoft stores nothing in these three cases.

uc-12-11:
  status: untested
  ask: "Save Tom Berger of Acme as a contact with the address tom@acme.example."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_create_contact
      args: {given_name: Tom, surname: Berger, company_name: Acme, email_addresses: tom@acme.example}
    - tool: outlook_list_contacts
      args: {address: tom@acme.example}
  note: >-
    Expected behaviour from shared/seam.py:451-470 (_OUTCOME_UNKNOWN and _outcome_unknown), the
    connector does not know if Microsoft made the change, do not call the tool again first, make sure
    that the change is not already there, and use outlook_list_contacts to see it. The seam gives this
    text because outlook_create_contact is not idempotent (WRITE_ADDITIVE, tools/outlook_create_contact.py:130)
    and names outlook_list_contacts in CHANGE_SHOWN_BY (:37). The write is sent with no SDK retry
    (:89), so Microsoft sees one call. The assistant calls outlook_create_contact again only if the
    list shows no new contact.

uc-12-12:
  status: untested
  ask: "Save a new contact."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_create_contact
      optional: true
  note: >-
    Expected behaviour from tools/outlook_create_contact.py:56-60 (_NOTHING_TO_CREATE), the tool needs
    at least one value, no contact was created, find out what the user asked for, and then call
    again. The step is the refused call, so it is optional. The assistant may ask Mia before it calls
    the tool.

uc-12-13:
  status: untested
  ask: "Save Tom Berger with the address tom at acme."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_create_contact
      args: {given_name: Tom, surname: Berger, email_addresses: tom at acme}
  note: >-
    Expected behaviour from shared/contacts.py:37-42 (not_one_address), a name is not an address, the
    entry is not one address, and no contact was created. The text names no next step. Asking Mia is
    the way to get a valid address, because every address must come from the user
    (tools/outlook_create_contact.py:50). The step is the refused call.

uc-12-14:
  status: untested
  ask: "Remove the company from Tom Berger."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_list_contacts
      optional: true
  must_not: [outlook_update_contact]
  note: >-
    Expected behaviour from tools/outlook_update_contact.py:73-74, the tool cannot clear a name, the
    company, the job title, or the mobile number, and the user clears the value in Outlook. The
    argument for the company takes at least one character that is not a space (:343-344), so no call
    can clear it.

