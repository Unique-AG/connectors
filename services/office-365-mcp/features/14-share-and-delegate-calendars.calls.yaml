uc-14-01:
  status: untested
  provenance: drafted
  ask: "Give Anna read access to my calendar."
  asks_user: true
  chain:
    - tool: outlook_find_recipient
      optional: true
    - tool: outlook_list_calendars
    - tool: outlook_share_calendar
      args: {address: anna@example.com, role: read}
      uses: {calendar_ref: handle of Mia's calendar}
    - tool: outlook_list_calendar_shares
      optional: true
      uses: {calendar_ref: handle of Mia's calendar}

uc-14-02:
  status: untested
  provenance: drafted
  ask: "Stop sharing my calendar with Anna."
  asks_user: true
  chain:
    - tool: outlook_list_calendars
    - tool: outlook_list_calendar_shares
      uses: {calendar_ref: handle of Mia's calendar}
    - tool: outlook_unshare_calendar
      uses: {share_ref: handle of the share with Anna}
  note: the row My Organization cannot be removed, so Anna may still see when Mia is free or busy if she works in Mia's company

uc-14-03:
  status: untested
  provenance: observed
  evidence: outlook_create_event_on_behalf in 1 call
  ask: "Book the Budget review with Anna on Lena's calendar."
  asks_user: true
  chain:
    - tool: outlook_list_calendars
    - tool: outlook_create_event_on_behalf
      args: {subject: Budget review, attendees: Anna}
      uses: {calendar_ref: handle of Lena's calendar}

uc-14-04:
  status: untested
  provenance: drafted
  ask: "Book the Budget review on Lena's calendar."
  asks_user: false
  chain:
    - tool: outlook_list_calendars
  must_not: [outlook_create_event_on_behalf]

uc-14-05:
  status: partly
  provenance: observed
  evidence: outlook_list_group_events in 1 call, which failed
  ask: "What is on the calendar of the Platform team this week?"
  blocker:
    kind: unknown
    tool: outlook_list_group_events
    text: The only call in prod failed and the logs give no cause, and the tool declares the permission Calendars.Read only.
    user: The assistant may not be able to read a team calendar. One attempt failed, and the cause is not known.
  asks_user: false
  chain:
    - tool: teams_list_my_teams
    - tool: outlook_list_group_events
      args: {starts_on: Monday, ends_on: Sunday}
      uses: {group_id: id of the team Platform}
