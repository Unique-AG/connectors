uc-09-22:
  status: untested
  ask: "Tell the chat with Anna and Tom that the build is green."
  provenance: drafted
  asks_user: true
  chain:
    - any_of: [teams_send_chat_message, teams_send_channel_message, teams_send_chat_message_with_files, teams_send_channel_message_with_files, teams_edit_message, teams_delete_message, teams_react_to_message]
  note: "Each row names its own tool by its action: rows 1 to 7 are teams_send_chat_message, teams_send_channel_message, teams_send_chat_message_with_files, teams_send_channel_message_with_files, teams_edit_message, teams_delete_message, teams_react_to_message. The one cause is that the chat program answers the question with an error that is not METHOD_NOT_FOUND or INVALID_REQUEST, so every row ends in the same text. Expected behaviour from src/office_365_mcp/shared/seam.py:227-233 and :255-263: nothing happened; this connector tried to ask; it received no answer that it can use; tell the user that it received no answer, and that they can make the same request again. A question that never gets an answer is not a cause of this text: the server sets no time limit on the question (fastmcp/server/context.py:1091-1095, mcp/server/session.py:97 and :113-114), so the call waits until the client cancels it, and a cancelled call returns no text. The same holds for uc-10-31, uc-05-42 row 2 and uc-05-46 row 2. Two other causes end differently: a client that cannot ask ends in the text of uc-09-29 (seam.py:216-225 and :261-262), and an answer of no ends in the text of uc-09-19 to uc-09-21 (seam.py:236-241 and :264-265). This text exists only on a connection that uses the older protocol (seam.py:208-211 and :293); on the 2026-07-28 protocol the question travels in the result of the call and no path ends in it."

