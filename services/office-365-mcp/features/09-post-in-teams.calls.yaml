uc-09-01:
  status: untested
  provenance: drafted
  asks_user: true
  chain:
    - tool: teams_list_chats
    - tool: teams_list_chat_members
      uses: {chat_id: id of the chat}
    - tool: teams_send_chat_message
      args: {message: the build is green, mentions: Anna}
      uses: {chat_id: id of the chat}

uc-09-02:
  status: untested
  provenance: drafted
  asks_user: true
  chain:
    - tool: teams_send_chat_message
      uses: {chat_id: id of the chat}
  note: Mia declines, so the tool posts nothing

uc-09-03:
  status: untested
  provenance: drafted
  asks_user: false
  chain:
    - tool: teams_list_chat_members
      uses: {chat_id: id of the chat}
    - tool: teams_send_chat_message
      optional: true
      args: {mentions: Priya}
      uses: {chat_id: id of the chat}
  note: the member list shows that Priya is absent, so the assistant needs no send call. If it sends, the tool refuses a mention of a person who is not a member, before it asks. The id of Priya comes from another chat, because no tool turns a name into an id.

uc-09-04:
  status: untested
  provenance: drafted
  asks_user: true
  chain:
    - tool: teams_list_my_teams
    - tool: teams_list_channels
      uses: {team_id: id of the team}
    - tool: teams_browse_channel
      uses: {team_id: id of the team, channel_id: id of the channel}
    - tool: teams_send_channel_message
      args: {message: "Yes, since noon"}
      uses: {team_id: id of the team, channel_id: id of the channel, reply_to_id: id of the post}

uc-09-05:
  status: untested
  provenance: drafted
  asks_user: true
  chain:
    - tool: teams_list_my_teams
    - tool: teams_list_channels
      uses: {team_id: id of the team}
    - tool: sharepoint_search_files
      args: {query: Q3 Plan}
    - tool: teams_send_channel_message_with_files
      uses: {team_id: id of the team, channel_id: id of the channel, attachments: uri of the file from the search}

