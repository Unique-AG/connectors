uc-09-01:
  status: untested
  ask: "Tell the chat with Anna and Tom that the build is green, and mention Anna."
  provenance: drafted
  asks_user: true
  chain:
    - tool: teams_list_chats
    - tool: teams_list_chat_members
      uses: {chat_id: id of the chat}
    - tool: teams_send_chat_message
      args: {message: the build is green, mentions: Anna}
      uses: {chat_id: id of the chat}

uc-09-02:
  status: untested
  ask: "Tell the chat with Anna and Tom that the build is green."
  provenance: drafted
  asks_user: true
  chain:
    - tool: teams_send_chat_message
      uses: {chat_id: id of the chat}
  note: Mia declines, so the tool posts nothing

uc-09-03:
  status: untested
  ask: "Tell the chat with Anna and Tom to review the plan, and mention Priya."
  provenance: drafted
  asks_user: false
  chain:
    - tool: teams_list_chat_members
      uses: {chat_id: id of the chat}
    - tool: teams_send_chat_message
      optional: true
      args: {mentions: Priya}
      uses: {chat_id: id of the chat}
  note: the member list shows that Priya is absent, so the assistant needs no send call. If it sends, the tool refuses the mention before it asks, and the id of Priya comes from another chat.

uc-09-04:
  status: untested
  ask: "Reply to the post 'v2 is out?' in Releases with 'Yes, since noon'."
  provenance: drafted
  asks_user: true
  chain:
    - tool: teams_list_my_teams
    - tool: teams_list_channels
      uses: {team_id: id of the team}
    - tool: teams_browse_channel
      uses: {team_id: id of the team, channel_id: id of the channel}
    - tool: teams_send_channel_message
      args: {message: "Yes, since noon"}
      uses: {team_id: id of the team, channel_id: id of the channel, reply_to_id: id of the post}

