uc-15-12:
  status: partly
  ask: "What is in the file that Anna posted in our chat yesterday?"
  blocker:
    kind: unknown
    tool: sharepoint_resolve_url
    text: The description says that Microsoft documents the lookup for sharing links and that another form of web address can fail. Nobody ran it on the web address of a Teams file attachment, so whether it fails is not known.
    user: The assistant may not be able to open a file that someone posted in Teams.
  provenance: drafted
  asks_user: false
  chain:
    - tool: teams_search_messages
      args: {sender: Anna, has_attachment: true, sent_after: yesterday}
    - tool: teams_read_message
      uses: {uri: uri of the hit}
    - any_of: [sharepoint_resolve_url, sharepoint_search_files]
    - tool: sharepoint_read_file
      args: {convert_to: pdf}
      uses: {file: handle of the file from the lookup or the search}
  note: sharepoint_resolve_url takes the web address of the attachment. If it fails, sharepoint_search_files finds the file by its name, because the file is shared with Mia.


uc-15-13:
  status: untested
  ask: "Give me a brief of my day, and put Anna's mail first."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_list_events
      args: {starts_on: today, ends_on: today}
    - tool: outlook_read_event
      optional: true
      repeat: many
      uses: {uri: uri of each event}
    - tool: outlook_list_mail
      args: {unread_only: true}
    - tool: outlook_list_mail
      optional: true
      args: {unread_only: true}
  note: "One source fails and the other works. Row 1: the assistant cannot read the mail on either try; the failing step is the first outlook_list_mail, and the second outlook_list_mail is the single retry (expected behaviour from src/office_365_mcp/shared/seam.py:546-553: retry once; if it fails again the same way, stop and report it). Row 2: the failing step is outlook_list_events, so no event is read and outlook_read_event does not run; the second outlook_list_mail does not run either (expected behaviour from src/office_365_mcp/shared/seam.py:528-537: ask a Microsoft 365 administrator to grant the delegated permission; retrying will not help). In both rows the assistant reports the part that failed and invents nothing about it."

