    - tool: sharepoint_create_share_link
      uses: {item: handle of the price list}
  note: "Mia declines the question. Expected behaviour from src/office_365_mcp/shared/seam.py:236-241: nothing was changed, and the assistant says that the request was not confirmed. The tool words are No link was created, and nothing was shared (src/office_365_mcp/tools/sharepoint_create_share_link.py:51). The declined file is the case of uc-10-30."

uc-15-28:
  status: untested
  ask: "Send the latest price list to Anna by mail."
  provenance: drafted
  asks_user: true
  chain:
    - tool: sharepoint_search_files
      args: {sort_by: last_modified}
    - tool: sharepoint_create_share_link
      uses: {item: handle of the price list}
  note: "The cause is that the chat program answers the question with an error that is not METHOD_NOT_FOUND or INVALID_REQUEST. Expected behaviour from src/office_365_mcp/shared/seam.py:227-233 and :255-263: nothing happened; this connector tried to ask; it received no answer that it can use; tell the user that it received no answer, and that they can make the same request again. A question that never gets an answer is not a cause of this text: the server sets no time limit on the question (fastmcp/server/context.py:1091-1095, mcp/server/session.py:97 and :113-114), so the call waits until the client cancels it, and a cancelled call returns no text. The same holds for uc-10-31, uc-05-42 row 2 and uc-05-46 row 2. A client that cannot ask ends in another text (seam.py:216-225), and an answer of no ends in the text of uc-15-27 (seam.py:236-241). This text exists only on a connection that uses the older protocol (seam.py:208-211 and :293). The same case for a text file is in uc-10-31."

uc-15-29:
  status: untested
  ask: "Send the latest price list to Anna by mail."
  provenance: drafted
  asks_user: true
  chain:
    - any_of: [sharepoint_create_share_link, sharepoint_create_text_file]
  note: "Rows 1 and 2 are sharepoint_create_share_link, and rows 3 and 4 are sharepoint_create_text_file. The link binds the answer to the item, the access, and the audience (src/office_365_mcp/tools/sharepoint_create_share_link.py:154). The file binds it to the folder, the name, and a hash of the text (src/office_365_mcp/tools/sharepoint_create_text_file.py:158). Expected behaviour from src/office_365_mcp/shared/seam.py:244-249 and :283: the agreement was given for a different request, so it covers nothing; nothing changed; ask the user again and call the tool with exactly what they confirm. The check applies only to a client of the newer protocol (seam.py:208-211)."

uc-15-31:
  status: untested
  ask: "Send the latest price list to Anna by mail."
  provenance: drafted
  asks_user: true
  chain:
    - tool: sharepoint_search_files
      args: {sort_by: last_modified}
    - tool: sharepoint_create_share_link
      args: {access: view, audience: organization}
      uses: {item: handle of the price list}
    - tool: sharepoint_create_share_link
      args: {access: view, audience: organization}
      uses: {item: handle of the price list}
  must_not: [outlook_send_draft]
  note: "The first sharepoint_create_share_link step fails, and the second is the single retry. The tool asks Mia at every call, so Mia is asked a second time before the retry. The tool is idempotent: its description says that the call is safe to repeat after a timeout (src/office_365_mcp/tools/sharepoint_create_share_link.py:72-73), so the advice is the one for a repeatable call. Expected behaviour from src/office_365_mcp/shared/seam.py:392-395 and :546-553: retry once; if it fails again the same way, stop and report it. Row 1 is a Microsoft error above 499 (src/office_365_mcp/graph_client/errors.py:332-337), row 2 is a timeout or lost connection (errors.py:218-227), row 3 is an answer that cannot be read (errors.py:238-247)."

