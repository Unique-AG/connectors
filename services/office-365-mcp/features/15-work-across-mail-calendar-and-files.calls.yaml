uc-15-01:
  status: untested
  ask: "Give me a brief of my day, and put Anna's mail first."
  provenance: observed
  evidence: outlook_list_events then outlook_list_mail 17 times; the 2 longest sessions repeat the loop list_mail, search_mail, read_event, list_events
  asks_user: false
  chain:
    - tool: outlook_list_events
      args: {starts_on: today, ends_on: today}
    - tool: outlook_read_event
      repeat: many
      uses: {uri: uri of each event}
    - tool: outlook_list_mail
      args: {unread_only: true}
  note: a listing row has only the number of attendees, so outlook_read_event gives their names. No tool gives the manager of the user, so Mia names the person.

uc-15-02:
  status: untested
  ask: "Go through my inbox."
  provenance: observed
  evidence: a session of 20 calls on 2026-09-30 ran outlook_list_mail, outlook_move_mail, outlook_read_event, outlook_respond_to_invite, outlook_mark_mail
  asks_user: false
  chain:
    - tool: outlook_list_mail
      args: {unread_only: true}
  must_not: [outlook_respond_to_invite]
  note: the observed session did answer 2 invitations, and the logs do not show whether Mia was asked first, but outlook_respond_to_invite asks Mia unless send_response is false. Filing the newsletters is the case of uc-05-01, and answering an invitation is the case of uc-07-01.

uc-15-03:
  status: untested
  ask: "Answer Anna's mail with the latest price list."
  provenance: observed
  evidence: a session of 22 calls on 2026-10-09 ran outlook_search_mail, sharepoint_read_file, outlook_read_thread, outlook_draft_reply, outlook_move_mail
  asks_user: false
  chain:
    - tool: outlook_search_mail
    - tool: outlook_read_mail
      optional: true
    - tool: sharepoint_search_files
      args: {sort_by: last_modified}
    - tool: sharepoint_read_file
      repeat: many
      args: {convert_to: pdf}
    - tool: outlook_draft_reply
      uses: {message_ref: uri of the message from Anna}
  must_not: [outlook_send_draft]

uc-15-04:
  status: untested
  ask: "Find a time next week for the 90-minute workshop that Anna and Tom discussed."
  provenance: drafted
  evidence: a session of 19 calls on 2026-10-13 ran outlook_search_mail 10 times, outlook_read_mail 8 times, and outlook_check_availability
  asks_user: false
  chain:
    - tool: outlook_search_mail
      repeat: many
    - tool: outlook_read_thread
      optional: true
      uses: {uri: uri of a message of the thread}
    - tool: outlook_read_mail
      repeat: many
      uses: {uri: uri of each message of the thread}
    - tool: get_me
      optional: true
    - tool: outlook_find_recipient
      repeat: many
    - tool: outlook_suggest_meeting_times
      args: {duration_minutes: 90}
      uses: {attendees: addresses of Anna and Tom from outlook_find_recipient}
    - tool: outlook_check_availability
      optional: true
      uses: {addresses: "addresses of Mia, Anna, and Tom from outlook_find_recipient"}
  note: an address never comes from the text of a message, and outlook_suggest_meeting_times includes Mia. outlook_check_availability gives free and busy status, and the assistant compares it with the working hours.

uc-15-05:
  status: untested
  ask: "Get me ready for tomorrow's Launch review."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_list_events
      args: {starts_on: tomorrow, ends_on: tomorrow, subject_contains: Launch review}
    - tool: outlook_read_event
      uses: {uri: uri of the event}
    - tool: outlook_search_mail
      args: {subject: Launch review}
    - tool: outlook_read_thread
      optional: true
      uses: {uri: uri of a message of the thread}
    - tool: sharepoint_search_files
      uses: {query: name of the deck that the mail names}
    - tool: sharepoint_read_file
      optional: true
      args: {convert_to: pdf}
      uses: {file: handle of the deck}

uc-15-06:
  status: untested
  ask: "Draft a mail to Anna and Tom that states what we decided in the Launch chat."
  provenance: drafted
  asks_user: false
  chain:
    - tool: teams_list_chats
      args: {topic_contains: Launch}
    - tool: teams_list_chat_messages
