  evidence: outlook_list_mail then outlook_list_events in 7 sessions, outlook_read_mail then outlook_list_events in 5, and outlook_list_mail, outlook_list_events, outlook_read_event in 4, in prod between 2026-10-14 and 2026-10-23; the logs hold the tool names and no arguments, and the intent is read from the chain, not logged
