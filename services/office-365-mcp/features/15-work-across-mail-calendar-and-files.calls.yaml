uc-15-09:
  status: untested
  ask: "Draft a mail to the attendees of yesterday's Design review with the action items."
  provenance: drafted
  asks_user: false
  chain:
    - tool: teams_list_chats
      args: {chat_type: meeting, topic_contains: Design review}
    - tool: teams_list_meeting_transcripts
      uses: {meeting_uri: uri of the meeting}
    - tool: teams_read_transcript
      uses: {uri: uri of the transcript}
    - tool: teams_list_chat_members
      optional: true
      uses: {chat_id: id of the meeting chat}
    - tool: outlook_find_recipient
      repeat: many
    - tool: outlook_draft_mail
      uses: {to: addresses of the attendees from outlook_find_recipient}
  must_not: [outlook_send_draft]
  note: an address never comes from the text of a transcript.

uc-15-10:
  status: partly
  ask: "Send the latest price list to Anna by mail."
  blocker:
    kind: tool
    tool: outlook_draft_mail
    text: The draft tools write text only and cannot add a file, so the assistant puts a sharing link in the draft and not the file.
    user: The assistant cannot attach the file to the mail. It puts a link to the file in the draft.
  provenance: drafted
  asks_user: true
  chain:
    - tool: sharepoint_search_files
      args: {sort_by: last_modified}
    - tool: sharepoint_create_share_link
      args: {access: view, audience: organization}
      uses: {item: handle of the price list}
    - tool: outlook_find_recipient
    - tool: outlook_draft_mail
      uses: {to: address of Anna from outlook_find_recipient}
  must_not: [outlook_send_draft]

uc-15-11:
  status: untested
  ask: "Save the text of Anna's mail Offer terms in my Offers folder."
  provenance: drafted
  asks_user: true
  chain:
    - tool: outlook_search_mail
      args: {subject: Offer terms}
    - tool: outlook_read_mail
      uses: {uri: uri of the mail}
    - any_of: [sharepoint_search_files, sharepoint_browse_folder]
    - tool: sharepoint_create_text_file
      args: {name: Offer terms.txt}
      uses: {folder: handle of the folder Offers, content: text of the mail}
  note: a file attached to the mail is not copied, which is the gap of uc-10-10.

uc-15-12:
  status: partly
  ask: "What is in the file that Anna posted in our chat yesterday?"
  blocker:
    kind: unknown
    tool: sharepoint_resolve_url
    text: The description says that Microsoft documents the lookup for sharing links and that another form of web address can fail. Nobody ran it on the web address of a Teams file attachment, so whether it fails is not known.
    user: The assistant may not be able to open a file that someone posted in Teams.
  provenance: drafted
  asks_user: false
  chain:
    - tool: teams_search_messages
      args: {sender: Anna, has_attachment: true, sent_after: yesterday}
    - tool: teams_read_message
      uses: {uri: uri of the hit}
    - any_of: [sharepoint_resolve_url, sharepoint_search_files]
    - tool: sharepoint_read_file
      args: {convert_to: pdf}
      uses: {file: handle of the file from the lookup or the search}
  note: sharepoint_resolve_url takes the web address of the attachment. If it fails, sharepoint_search_files finds the file by its name, because the file is shared with Mia.
