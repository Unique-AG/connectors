uc-15-07:
  status: untested
  ask: "Tell me everything we have about Acme in mail, Teams, and files."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_search_mail
      args: {query: Acme}
    - tool: teams_search_messages
      args: {query: Acme}
