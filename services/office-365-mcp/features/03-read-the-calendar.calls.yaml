  note: "expected behaviour from shared/seam.py:546-553 for a failure and for no answer in time (read tool, advice: retry once, and if it fails again the same way, stop and report it; the second step in the chain is that retry), and from shared/seam.py:562-570 for a list that never ends (advice: retry once if the list matters, if it happens again, stop and report)."

uc-03-12:
