uc-03-04:
  status: untested
  provenance: observed
  evidence: outlook_list_events then outlook_read_event 20 times, 15 of them in 2 automated sessions; 233 of 244 read_event calls sit in those 2 sessions
  ask: "Who is coming to the Launch review, and who has answered?"
  asks_user: false
  chain:
    - tool: outlook_list_events
    - tool: outlook_read_event
      uses: {uri: uri of the event from the listing}
  note: a person's answer is in the attendee list of outlook_read_event, and is accepted, declined, tentativelyAccepted, notResponded, none, or organizer

uc-03-05:
  status: untested
  provenance: drafted
  ask: "When is my next meeting with Tom?"
  asks_user: false
  chain:
    - tool: outlook_find_recipient
      optional: true
    - tool: outlook_list_events
      args: {starts_on: today, ends_on: in 4 weeks}
    - tool: outlook_read_event
      repeat: many
      uses: {uri: uri of an event with more than one attendee}
  note: outlook_list_events has no attendee filter, so the assistant opens the events one by one until it finds Tom

uc-03-06:
  status: untested
  provenance: drafted
  evidence: outlook_search_mail then outlook_read_event 22 times, 21 of them in 2 automated sessions
  ask: "What are the details of the meeting in Anna's invitation mail?"
  asks_user: false
  chain:
    - tool: outlook_search_mail
    - tool: outlook_list_events
      args: {subject_contains: Launch review, starts_on: day of the meeting in the mail, ends_on: day of the meeting in the mail}
    - tool: outlook_read_event
      uses: {uri: uri of the event}
  note: no tool links a mail to an event, so if the event is not on Mia's calendar, the assistant answers from the text of the mail

