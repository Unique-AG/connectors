uc-03-09:
  status: untested
  provenance: drafted
  ask: "What is in the agenda that is attached to the Launch review?"
  asks_user: false
  chain:
    - tool: outlook_list_events
      args: {subject_contains: Launch review}
    - tool: outlook_list_event_attachments
      uses: {uri: uri of the event from the listing}
    - tool: outlook_read_event_attachment
      uses: {uri: uri of the attachment}
  note: the tool returns the file and converts nothing, so a Word or Excel file gives the assistant no text
