uc-03-22:
  status: untested
  provenance: drafted
  ask: "On which dates does the Team sync take place in the next six weeks?"
  asks_user: false
  chain:
    - tool: outlook_list_events
      args: {subject_contains: Team sync, starts_on: today, ends_on: in 6 weeks, time_zone: Europe/Zurich}
    - tool: outlook_list_event_instances
      args: {starts_on: today, ends_on: in 6 weeks, time_zone: Europe/Zurich}
      uses: {uri: series_master_uri of the listing row}
  note: "expected behaviour from tools/outlook_list_event_instances.py:56-69 and :145-150: the tool takes the series master and lists the dates of the series inside the window, and Microsoft states that an occurrence canceled from the series is not in the list. outlook_list_events differs: it keeps a canceled event, with cancelled true (tools/outlook_list_events.py:168)."

