uc-03-13:
  status: untested
  provenance: drafted
  ask: "What is on my calendar from Friday back to Wednesday next week?"
  asks_user: false
  chain:
    - tool: outlook_list_events
      optional: true
      args: {starts_on: next Friday, ends_on: next Wednesday, time_zone: Europe/Zurich}
    - tool: outlook_list_events
      args: {starts_on: next Wednesday, ends_on: next Friday, time_zone: Europe/Zurich}
  note: "expected behaviour from tools/outlook_list_events.py:84-91 _ENDS_BEFORE_STARTS: put the earlier bound in starts_on and the later one in ends_on, then call again. The first call reads nothing. It is optional, because an assistant that orders the dates itself never makes it."

uc-03-14:
  status: untested
  provenance: drafted
  ask: "What is on my calendar next week?"
  asks_user: false
  chain:
    - tool: outlook_list_events
      args: {starts_on: next Monday, ends_on: next Sunday, time_zone: Europe/Zurich}
    - tool: outlook_list_events
      optional: true
      args: {starts_on: next Monday, ends_on: next Sunday, time_zone: Europe/Zurich, limit: 40}
  note: "expected behaviour from tools/outlook_list_events.py:183-188: capped true means the call stopped with more of the window available, and the text says to raise `limit` or narrow the window. `limit` has no upper bound (ge=1 only, :416-425) and its text says to raise it to get more events, so for 40 meetings the assistant raises it and lists all 40. The limit is 25 rows by default. The second call is optional, because an assistant that sets a large limit at first needs one call. A list that stops at the paging cap is a different case (uc-02-05)."

uc-03-15:
