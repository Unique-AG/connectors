uc-11-08:
  status: untested
  ask: "Is my out-of-office reply on?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_get_mailbox_settings
      args: {include: replies}
  note: >-
    Expected behaviour per Examples row. Sign-in expired, shared/seam.py:520-525, ask the user to
    sign in again. Access refused, seam.py:528-537 (the tool has no GRAPH_FORBIDDEN text), an
    administrator grants MailboxSettings.Read to the app registration, and retrying will not help.
    Busy, seam.py:509-513, left alone for 30 seconds, retry after that and not sooner. This text
    reaches the assistant only when every try is busy: the reading is a GET, so the SDK retry
    handler waits out up to 3 busy answers (graph_client/client.py:339-342, config.py:126). One busy
    answer is uc-11-22. A mailbox that is not found is uc-11-21. A failed reading is never a reply
    that is off.

