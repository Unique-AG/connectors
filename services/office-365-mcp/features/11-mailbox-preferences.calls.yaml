uc-11-01:
  status: partly
  ask: "Turn on my out-of-office reply from Monday to Friday and tell everyone I am away."
  blocker:
    kind: description
    tool: outlook_set_automatic_reply
    text: The description does not say that an unset `external_audience` keeps the stored value, or none when nothing is stored. It does not say what an `end` date without a time of day means.
    user: The assistant can leave outside senders without a reply. It can also stop the reply a day early or use the wrong time zone.
  provenance: drafted
  asks_user: true
  chain:
    - tool: outlook_get_mailbox_settings
      optional: true
      args: {include: preferences}
    - tool: outlook_set_automatic_reply
      args: {status: scheduled, start: Monday 00:00, end: Saturday 00:00, internal_message: short message, external_message: short message, external_audience: all}
      uses: {time_zone: time zone of the preferences}

