    - tool: outlook_set_automatic_reply
      args: {status: scheduled, start: Monday 00:00, end: Saturday 00:00}
  note: >-
    Expected behaviour from shared/seam.py:549-553, retry once. The tool is annotated idempotent
    (outlook_set_automatic_reply.py:304), so the seam does not treat a failed write as outcome
    unknown. The write itself is sent with no SDK retry (:230). The second call asks Mia again
    (:154), because the tool asks on every call that schedules a reply.

