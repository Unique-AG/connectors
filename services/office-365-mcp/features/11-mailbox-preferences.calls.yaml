uc-11-22:
  status: untested
  ask: "Is my out-of-office reply on?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_get_mailbox_settings
      args: {include: replies}
  note: >-
    Expected behaviour from the SDK retry handler (graph_client/client.py:339-342, config.py:126;
    tests/conftest.py retry_sleeps): the reading is a GET, so one 429 with Retry-After is waited out
    and asked again by the connector, and the assistant gets the answer as if nothing had happened.
    OPEN: 4 busy answers in a row take about 90 s, longer than the 60 s tool limit of node-chat.

uc-11-23:
  status: untested
  ask: "Is my out-of-office reply on?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_get_mailbox_settings
      args: {include: replies}
      optional: true
  note: >-
    Expected behaviour from shared/seam.py:128-158 and 410-428 (TokenExchangeFailed,
    _token_advice): Microsoft 365 issues no token for MailboxSettings.Read
    (tools/outlook_get_mailbox_settings.py:45), so the call never reaches Microsoft Graph. The text
    tells the assistant to ask a Microsoft 365 administrator to grant the permission and to consent
    for the organization, then to have the user sign in again, and that retrying will not help. The
    failed call is the only step, so it is optional. A failed reading is never a reply that is off.

