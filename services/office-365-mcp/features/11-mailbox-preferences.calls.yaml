uc-11-11:
  status: untested
  ask: "Turn on my out-of-office reply from Monday to Friday."
  provenance: drafted
  asks_user: true
  chain:
    - tool: outlook_set_automatic_reply
      args: {status: scheduled, start: Monday 00:00, end: Saturday 00:00}
  note: >-
    Expected behaviour per Examples row. Both rows fail at the write, after Mia approved: the tool
    reads the stored reply, asks Mia, and then writes (tools/outlook_set_automatic_reply.py:151-166).
    Dates not valid, seam.py:579-584, a bad request that fails the same way, with the reason that
    Microsoft gives. Busy, seam.py:509-513, left alone for 30 seconds, retry after that and not
    sooner; the write is sent with no SDK retry (:230), so one busy answer reaches the assistant. No
    stored reply changes in these two cases. A fault at the read, before the question, is uc-11-20.

uc-11-12:
  status: untested
