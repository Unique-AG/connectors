  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_find_recipient
      args: {query: Ada Keller}
  must_not: [outlook_set_focused_override]
  note: >-
    Expected behaviour from tools/outlook_set_focused_override.py:39-40 and :46-52 (_NOT_ONE_ADDRESS),
    the address must come from the user, the tool takes one address and not a name, use
    outlook_find_recipient to turn a name into an address, and otherwise ask the user for the
    address. The outcome no_match of outlook_find_recipient is no proof that the person does not
    exist (tools/outlook_find_recipient.py:116-119), so the assistant asks Mia.

