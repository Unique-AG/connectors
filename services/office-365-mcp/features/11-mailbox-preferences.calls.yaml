  note: >-
    Expected behaviour from shared/seam.py:244-249 (_another_request), the agreement was given for a
    different request, so it does not cover this one, nothing was changed, and ask the user again.
    The test is ctx.request_state != about at seam.py:283. The value about is a hash of the window,
    the outside audience and both messages (tools/outlook_set_automatic_reply.py:199-206), and the
    messages are the stored ones when the call gives none, so a change of the stored message after
    the question gives another value. This check runs only on a connection that uses the newer
    protocol (seam.py:268-290).

uc-11-17:
  status: untested
