uc-11-26:
  status: untested
  ask: "Always put mail from ada@acme.example in my Focused tab."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_set_focused_override
      args: {sender: ada@acme.example, classify_as: focused}
  note: >-
    Expected behaviour per Examples row. Sign-in expired, shared/seam.py:520-525, ask the user to
    sign in again. Access refused, seam.py:528-537 (the tool has no GRAPH_FORBIDDEN text), an
    administrator grants Mail.ReadWrite to the app registration
    (tools/outlook_set_focused_override.py:25), and retrying will not help. Busy, seam.py:509-513,
    left alone for 30 seconds, retry after that and not sooner. The tool never asks Mia
    (tools/outlook_set_focused_override.py:34-35). Its POST and PATCH carry no no_retry option, so
    the SDK retry handler waits out up to 3 busy answers
    (tests/tools/test_outlook_set_focused_override.py:383-413) and the text reaches the assistant
    only when every try is busy. OPEN: the same 60 s limit as uc-11-25. A refusal or a busy answer
    changes no tab.

uc-11-27:
  status: untested
  ask: "Always put mail from ada@acme.example in my Focused tab."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_set_focused_override
      args: {sender: ada@acme.example, classify_as: focused}
    - tool: outlook_set_focused_override
      args: {sender: ada@acme.example, classify_as: focused}
  note: >-
    Expected behaviour from shared/seam.py:549-553, for a tool that Microsoft could not reach or that
    failed internally, retry once. The tool carries the idempotent hint
    (tools/outlook_set_focused_override.py:103) and says that the call is safe to repeat after a
    timeout (:43), so the seam does not treat the failed write as outcome unknown (seam.py:392-396).
    A status of 500 or more, graph_client/errors.py:332-335, and a timeout or lost connection,
    errors.py:218-227, both reach the assistant. A 503 or 504 is sent again by the SDK before the
    assistant sees it (tests/tools/test_outlook_set_focused_override.py:383-413). A sender holds
    one row, so a repeat leaves the sender once in the list.

