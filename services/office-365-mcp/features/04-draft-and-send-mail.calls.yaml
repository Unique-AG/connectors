  note: "expected behaviour from shared/seam.py:451-470: outcome unknown, do not call the tool again first, check with outlook_list_mail. The draft is created with no_retry (tools/outlook_draft_mail.py:207), so a failure makes exactly one create call. The assistant creates a second draft only when the drafts do not show the first."
