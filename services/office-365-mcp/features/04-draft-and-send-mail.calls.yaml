uc-04-25:
  status: working
  ask: "Send the draft to Anna."
  provenance: drafted
  asks_user: true
  tests:
    - "tests/e2e/test_scenarios.py::test_the_scenario_runs_as_its_sidecar_says[uc-04-25/fails]"
    - "tests/e2e/test_scenarios.py::test_the_scenario_runs_as_its_sidecar_says[uc-04-25/no-answer-in-time]"
  chain:
    - tool: outlook_send_draft
      uses: {message_ref: uri of the draft}
      bind: {message_ref: outlook:///messages/AAMkAGI2RUN-draft-0001%3D}
      approval: "yes"
      expect:
        tool_error: {shared.seam.advice._outcome_unknown: [tools.outlook_send_draft.CHANGE_SHOWN_BY]}
        graph_calls: {GET /v1.0/me/messages/*: 2, POST /v1.0/me/messages/*/send: 1}
    - tool: outlook_list_mail
      args: {folder: sentitems}
      expect:
        result: {messages: []}
        graph_calls: {GET /v1.0/me/mailFolders/sentitems: 1, GET /v1.0/me/mailFolders/sentitems/messages: 1}
  note: "expected behaviour from shared/seam/advice.py:182-201 (_OUTCOME_UNKNOWN): the connector does not know if Microsoft made the change, do not call the tool again first, and check with outlook_list_mail. The send runs with no_retry (graph_client/client.py:220-232), so one failure makes exactly one send call (tests/test_error_mapping.py:658-702 states the same for other writes). The rows are an internal error with no wait time and a timeout. A 503 or a 504 with a wait time gets the retry-after text and not this text (uc-04-36). An unreadable answer is not a row: a send has no answer body, and a 2xx is a success without parsing (kiota send_no_response_content_async). The assistant calls outlook_send_draft again only when the sent items do not show the message, and the read before each send gives not found or not-a-draft for a draft that went out (tools/outlook_send_draft.py:175-185)."
  variants:
    fails:
      fixture: uc-04-25
      1: {fault: {graph: {status: 503}, at: POST */send}}
    no-answer-in-time:
      fixture: uc-04-25
      1: {fault: {transport: timeout, at: POST */send}}

