uc-04-10:
  status: untested
  ask: "Forward the mail Contract draft to Tom with a short note."
  provenance: drafted
  evidence: outlook_draft_reply 36 calls, used for replies
  asks_user: false
  chain:
    - any_of: [outlook_read_mail, outlook_search_mail]
    - tool: outlook_find_recipient
      args: {query: Tom}
    - tool: outlook_draft_reply
      args: {mode: forward, body_html: short note}
      uses: {message_ref: uri of the message, to: address of Tom from outlook_find_recipient}
    - tool: outlook_list_attachments
      uses: {uri: uri of the forward draft}

