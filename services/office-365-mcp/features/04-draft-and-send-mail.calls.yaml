uc-04-20:
  status: untested
  ask: "Find the address of Anna Meier."
  provenance: drafted
  asks_user: false
  chain:
    - tool: outlook_find_recipient
      args: {query: Anna Meier}
  must_not: [outlook_draft_mail, outlook_send_draft]
  note: "expected behaviour from shared/seam.py, one text for each Examples row. Sign-in expired, seam.py:520-525: ask the user to sign in to this connector again. No access, seam.py:528-537: ask a Microsoft 365 administrator to grant the permissions. Busy with a wait of 30 seconds, seam.py:501-513: retry after 30 seconds, not sooner. The retry handler of the SDK waits out a single busy answer on a read (graph_client/client.py:339-342, config.py:126; uc-04-37), so the third row means busy through every try."

