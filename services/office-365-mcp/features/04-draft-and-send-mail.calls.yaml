uc-04-01:
  status: untested
  ask: "Draft a note to Anna Meier that asks for the contract by Friday."
  provenance: drafted
  evidence: outlook_find_recipient in 13 sessions, alone in 7; outlook_draft_mail in 18 sessions
  asks_user: false
  chain:
    - tool: outlook_find_recipient
      args: {query: Anna Meier}
    - tool: outlook_draft_mail
      args: {subject: Contract, body_html: request for the contract by Friday}
      uses: {to: address from outlook_find_recipient}
  must_not: [outlook_send_draft]

