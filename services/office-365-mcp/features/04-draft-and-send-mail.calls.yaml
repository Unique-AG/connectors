uc-04-36:
  status: untested
  ask: "Save a draft note to Anna."
  provenance: drafted
  evidence: outlook_draft_reply_all failed once in 4 calls with a 503 in prod between 2026-10-14 and 2026-10-23; the logs do not show whether Microsoft sent a wait time
  asks_user: false
  chain:
    - any_of: [outlook_draft_mail, outlook_draft_reply_all]
  note: "expected behaviour from graph_client/errors.py:293-303 and shared/seam.py:514-518: a 503 or a 504 with a wait time is classified as throttling and gets the text to retry after that time, also on a write. The write runs with no_retry (graph_client/client.py:220-232), and the docstring there says that such a 503 can arrive after Microsoft did the change. So the text does not say whether the message was sent or the draft was saved. The rows are outlook_draft_mail and outlook_draft_reply_all (tools/outlook_draft_reply_all.py:413 is no_retry). Neither asks Mia a question. A second call can make a second draft, and nothing in the advice says to look in the drafts first. A send with a wait time is the third row of uc-04-23. An internal error or a timeout is uc-04-26 and uc-04-42."

