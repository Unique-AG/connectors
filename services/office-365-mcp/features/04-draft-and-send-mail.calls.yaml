    - tool: outlook_update_draft
      args: {body_html: shorter text}
      uses: {message_ref: uri of the draft from the listing or the earlier drafting answer}
  must_not: [outlook_draft_mail]
  note: the tool replaces the whole body, so the assistant sends the full shorter text

