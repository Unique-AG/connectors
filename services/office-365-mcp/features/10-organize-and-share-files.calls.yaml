uc-10-01:
  status: untested
  ask: "Move the 4 signed contracts from Contracts into a new folder called 2026 Signed."
  provenance: drafted
  asks_user: true
  chain:
    - any_of: [sharepoint_search_files, sharepoint_browse_folder]
    - tool: sharepoint_create_folder
      args: {name: 2026 Signed}
      uses: {parent: handle of the folder Contracts}
    - tool: sharepoint_move_item
      repeat: many
      uses: {item: handle of each contract, to_folder: handle of 2026 Signed}
  note: the folder and each of the 4 moves ask for approval, so 5 approvals are expected

uc-10-02:
  status: partly
  ask: "Copy my Template folder into the Sales site."
  blocker:
    kind: tool
    tool: sharepoint_list_drives
    text: No tool gives the top folder of a site library, so the destination must be a folder that a search on the site returns.
    user: The assistant can copy into the Sales site only when it can find a folder there.
  provenance: drafted
  asks_user: true
  chain:
    - tool: sharepoint_search_files
      args: {query: Template}
    - tool: sharepoint_search_sites
      args: {query: Sales}
    - tool: sharepoint_search_files
      args: {query: Documents}
      uses: {path: web address of the Sales site from sharepoint_search_sites}
    - tool: sharepoint_copy_item
      uses: {item: handle of the folder Template, to_folder: handle of a folder on the Sales site from the second search}
    - tool: sharepoint_browse_folder
      optional: true
      uses: {folder: handle of the destination folder}
  note: the second query is a guess at a folder name of the site, and Microsoft runs the copy after the call returns, so a listing shows the copy only after some time

