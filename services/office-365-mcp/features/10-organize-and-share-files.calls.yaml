    - any_of: [sharepoint_move_item, sharepoint_delete_item, sharepoint_rename_item, sharepoint_invite, sharepoint_create_text_file]
  note: "The one cause is that the chat program answers the question with an error that is not METHOD_NOT_FOUND or INVALID_REQUEST (shared/seam.py:227-233 and :255-263). A question that never gets an answer is not a cause of this text: the server sets no time limit on the question (fastmcp/server/context.py:1091-1095, mcp/server/session.py:97 and :113-114), so the call waits until the client cancels it, and a cancelled call returns no text. This text exists only on a connection that uses the older protocol (seam.py:208-211 and :293). Expected behaviour for every row from shared/seam.py:227-233 (_no_answer; the answer path is shared/seam.py:263): nothing was changed, this connector received no answer, tell the user that they can make the same request again, do not call this tool again for the same request unless the user asks for it in a new message. The row for the move uses the ask Move Contract A.pdf into 2026 Signed, the row for the rename uses Rename Plan v1.docx to Plan v2.docx, the row for the invite uses Give Anna edit access to Q3 Plan.pptx, and the row for the save uses Save these meeting notes as Sync 14 June.txt in Notes."

