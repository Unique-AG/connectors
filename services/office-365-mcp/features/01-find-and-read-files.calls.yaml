uc-01-14:
  status: untested
  ask: "Summarize the Q3 plan at this web address from my browser."
  provenance: drafted
  asks_user: false
  chain:
    - tool: sharepoint_resolve_url
    - tool: sharepoint_search_files
      optional: true
    - tool: sharepoint_read_file
      args: {convert_to: pdf}
      uses: {file: handle from sharepoint_resolve_url or from the search}
