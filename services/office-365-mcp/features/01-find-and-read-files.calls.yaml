uc-01-11:
  status: partly
  ask: "Summarize the Brightway Master Agreement."
  blocker:
    kind: unknown
    tool: sharepoint_read_file
    text: When Microsoft answers 406 to `convert_to` pdf, the tool returns the file in its own format. Its description says that it does not turn a document into text. No run shows that the assistant can read a Word file in that form, so the cause is not known.
    user: The assistant may not be able to read some files that Microsoft cannot convert.
  provenance: observed
  evidence: 16 failures in 9 sessions; the 4 newest were Microsoft 406 on the content
  asks_user: false
  chain:
    - tool: sharepoint_read_file
      args: {convert_to: pdf}
    - tool: sharepoint_read_file
      optional: true
  note: when Microsoft refuses the conversion, the tool says to call again without convert_to, and the second call returns the file in its own format; no run shows that the assistant reads it

uc-01-16:
  status: untested
  ask: "Which Brightway files on the Sales site changed this week?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: sharepoint_search_sites
      args: {query: Sales}
    - tool: sharepoint_search_files
      args: {query: Brightway, modified_after: start of this week, sort_by: last_modified}
      uses: {path: web address of the Sales site from sharepoint_search_sites}
  note: the tool needs a word in query, so the topic Brightway stays in the ask

