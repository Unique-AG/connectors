uc-01-17:
  status: untested
  ask: "What is the launch date in the Brightway launch plan?"
  provenance: drafted
  asks_user: false
  chain:
    - tool: sharepoint_search_files
      optional: true
      bind: {query: Brightway Launch Plan}
    - tool: sharepoint_read_file
      args: {convert_to: pdf}
      uses: {file: handle of the file from the search}
      bind: {file: "$prev.files[0].uri"}
  note: "expected behaviour per row. Sign-in expired, from shared/seam.py:520-525: ask the user to sign in to this connector again, because retrying unchanged fails the same way. No access, from shared/seam.py:528-537 (sharepoint_read_file has no GRAPH_FORBIDDEN text): ask a Microsoft 365 administrator to grant the delegated permission Files.Read.All, and retrying will not help. File gone, from tools/sharepoint_read_file.py:110-117 (GRAPH_NOT_FOUND): most probably deleted or moved, search again with sharepoint_search_files and take the uri from the new result, and do not retry the same handle."
  variants:
    sign-in-expired:
      cassette: uc-01-17
      2:
        fault: {graph: {status: 401, body: error.InvalidAuthenticationToken.json}}
        expect:
          tool_error:
            shared.seam._remedy:
              failure: {graph_client.GraphForbidden: {message: "", status: 401, code: null, request_id: null}}
              permissions: tools.sharepoint_read_file.GRAPH_PERMISSIONS
              not_found: null
              repeatable: true
              shown_by: []
              forbidden: null
          graph_calls: {GET /v1.0/drives/b!RUNDRIVE/items/01RUNPLAN: 1}
    no-access:
      cassette: uc-01-17
      2:
        fault: {graph: {status: 403, body: error.accessDenied.json}}
        expect:
          tool_error:
            shared.seam._remedy:
              failure: {graph_client.GraphForbidden: {message: "", status: 403, code: null, request_id: null}}
              permissions: tools.sharepoint_read_file.GRAPH_PERMISSIONS
              not_found: null
              repeatable: true
              shown_by: []
              forbidden: null
          graph_calls: {GET /v1.0/drives/b!RUNDRIVE/items/01RUNPLAN: 1}
    gone:
      cassette: uc-01-17
      2:
        fault: {graph: {status: 404, body: error.itemNotFound.json}}
        expect:
          tool_error: tools.sharepoint_read_file.GRAPH_NOT_FOUND
          graph_calls: {GET /v1.0/drives/b!RUNDRIVE/items/01RUNPLAN: 1}

