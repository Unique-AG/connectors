uc-01-06:
  status: untested
  ask: "What is the launch date in the Brightway launch plan?"
  provenance: observed
  evidence: sharepoint_search_files then sharepoint_read_file in 9 sessions; sharepoint_read_file alone in 27 sessions
  asks_user: false
  chain:
    - tool: sharepoint_search_files
      optional: true
    - tool: sharepoint_read_file
      args: {convert_to: pdf}
      uses: {file: handle of the file from the search or the folder}
  note: the tool converts nothing itself, so the call sets convert_to for the Word, Excel, and PowerPoint rows

