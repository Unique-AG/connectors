uc-08-04:
  status: untested
  provenance: drafted
  asks_user: false
  chain:
    - any_of: [onenote_list_notebooks, onenote_list_sections]
    - tool: onenote_create_page
      args: {title: Weekly sync, body_html: three notes}
      uses: {section: handle of the section Work}
  note: the tool asks for approval only when the notebook is shared or belongs to somebody else

uc-08-05:
  status: untested
