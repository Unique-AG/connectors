uc-08-33:
  status: partly
  ask: "Create a section 2025 in my Archive section group of Project Falcon."
  blocker:
    kind: description
    tool: onenote_create_section
    text: "The tool has no GRAPH_FORBIDDEN text and the notebook is Mia's own, so a 403 gives the generic text of shared/seam.py:530-537, which says to ask an administrator and that no other arguments will succeed. The description at tools/onenote_create_section.py:73-75 says the opposite: create under the notebook, or copy a section into the group."
    user: "The assistant may tell Mia that an administrator must act, although it could create the section in the notebook instead."
  provenance: drafted
  asks_user: false
  chain:
    - tool: onenote_list_sections
    - tool: onenote_create_section
      optional: true
      args: {name: "2025"}
      uses: {parent: handle of the section group Archive}
    - tool: onenote_create_section
      optional: true
      args: {name: "2025"}
      uses: {parent: handle of the notebook Project Falcon}
  note: "expected behaviour from tools/onenote_create_section.py:73-75 (description): Microsoft can refuse a create under a section group with error 403, then create under the notebook, or copy a section into the group with onenote_copy_section. The source gives two options, so the assistant asks Mia which one she wants and does not choose. The first create is the failing call, so it is optional. The second create is optional because it follows Mia's answer."

