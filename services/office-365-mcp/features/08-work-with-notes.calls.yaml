    - tool: onenote_append_to_page
      args: {body_html: task list}
      uses: {page: handle of the page}

uc-08-06:
  status: untested
  provenance: drafted
  asks_user: true
  chain:
    - tool: onenote_list_pages
    - tool: onenote_read_page
      args: {include_ids: true}
      uses: {page: handle of the page}
    - tool: onenote_edit_page
      args: {commands: replace the second paragraph}
      uses: {page: handle of the page}
  note: a replace needs the generated id of the paragraph, and the tool always asks for approval before a replace

