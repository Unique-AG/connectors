uc-13-32:
  status: working
  tests:
    - "tests/tools/scenarios/test_13_run_teams_chats_and_online_meetings.py::TestNothingChangesUnlessMiaClearlyAgrees::test_it_changes_nothing_when_the_chat_program_answers_the_question_with_an_error"
  ask: "Add Priya to the Launch chat."
  provenance: drafted
  asks_user: true
  chain:
    - any_of: [teams_create_chat, teams_add_chat_member, teams_remove_chat_member, teams_rename_chat, teams_create_meeting, teams_update_meeting, teams_delete_meeting]
  note: "Rows 1 to 7 name the tools in the order of uc-13-31. The one cause is that the chat program answers the question with an error that is not METHOD_NOT_FOUND or INVALID_REQUEST, so every row ends in the same text. Expected behaviour from src/office_365_mcp/shared/seam.py:227-233 and :255-263: nothing happened; this connector tried to ask; it received no answer that it can use; tell the user that it received no answer, and that they can make the same request again. A question that never gets an answer is not a cause of this text: the server sets no time limit on the question (fastmcp/server/context.py:1091-1095, mcp/server/session.py:97 and :113-114), so the call waits until the client cancels it, and a cancelled call returns no text. The same holds for uc-10-31, uc-05-42 row 2 and uc-05-46 row 2. Two other causes end differently: a client that cannot ask ends in the text of uc-13-38 (seam.py:216-225 and :261-262), and an answer of no ends in the text of uc-13-31 (seam.py:236-241 and :264-265). This text exists only on a connection that uses the older protocol (seam.py:208-211 and :293); on the 2026-07-28 protocol the question travels in the result of the call and no path ends in it."

