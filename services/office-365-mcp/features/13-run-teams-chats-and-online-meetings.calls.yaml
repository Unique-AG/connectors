    - tool: teams_update_meeting
      uses: {meeting_uri: uri of the meeting, attendees: "user id and name of Anna, Tom, and Priya"}
  must_not: [outlook_update_event]
  note: the new list replaces the current list, so the assistant sends the current attendees from teams_read_meeting and Priya. This holds when every invitee has a company account; uc-13-30 shows that a guest is removed. The tool never changes a calendar event, so a meeting that sits on the calendar gets its new attendee with outlook_update_event, which is the case of uc-07-15.

