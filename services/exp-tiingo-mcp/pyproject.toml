[project]
name = "tiingo-mcp"
version = "0.1.0"
description = "Experimental Tiingo market data MCP generated from an OpenAPI spec with FastMCP"
classifiers = ["Development Status :: 3 - Alpha"]
authors = [
    { name = "Sanzio Monti", email = "sanzio.monti@unique.ai" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp==4.1.3",
    "httpx2==2.14.0",
    "mcp-openapi==0.1.0",
    "py-key-value-aio[memory]==0.4.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "starlette==1.9.0",
    "unique-mcp==2026.44.1",
]

[project.scripts]
tiingo-mcp = "tiingo_mcp.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "mcp-openapi[codegen]==0.1.0",
    "poethepoet==0.49.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.poe.tasks]
# Run from the service's folder: uv run poe <task>
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
fix = ["format", "lint-fix", "format"]
typecheck = "basedpyright"
test = "pytest"
codegen = "mcp-openapi-codegen"
ci = { cmd = "bash ../../scripts/check-python-service.sh .", help = "every check CI runs, in its order" }

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastmcp.dependencies.Depends", "fastmcp.dependencies.CurrentContext"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "recommended"
include = ["src"]
reportMissingTypeStubs = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportCallInDefaultInitializer = "none"
reportUnusedCallResult = "none"
reportUnusedFunction = "none"
reportImplicitStringConcatenation = "none"
reportDeprecated = "none"
reportUnannotatedClassAttribute = "none"

[tool.uv.sources]
mcp-openapi = { path = "../../packages/mcp-openapi" }

[tool.mcp-openapi]
spec = "src/tiingo_mcp/openapi/tiingo-openapi.yml"
# Operations whose responses get a model.
response-operation-ids = "tiingo_mcp.openapi.routes:RESPONSE_MODELS"
# Operations the tools call through `OperationClient`, one `Operation` constant each.
operation-ids = "tiingo_mcp.openapi.routes:CLIENT_BACKED"
fields = "tiingo_mcp.openapi.fields:RESPONSE_FIELDS"
# The tools return vendor models to clients, which see the spec's field names.
snake-case-fields = false
operation-module = "mcp_openapi.upstream"
models-module = "tiingo_mcp.models.vendor_responses"
models-output = "src/tiingo_mcp/models/vendor_responses.py"
operations-output = "src/tiingo_mcp/models/operations.py"
