[project]
name = "tiingo-mcp"
version = "0.1.0"
description = "Experimental Tiingo market data MCP generated from an OpenAPI spec with FastMCP"
classifiers = ["Development Status :: 3 - Alpha"]
authors = [
    { name = "Sanzio Monti", email = "sanzio.monti@unique.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.0",
    "httpx2>=2.12,<3",
    "mcp-types>=2.3.0",
    "openapi-pydantic>=0.6,<0.7",
    "py-key-value-aio[memory]==0.4.6",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
    "starlette>=1.6,<2",
    "unique-mcp>=2026.44.0.dev1",
]

[project.scripts]
tiingo-mcp = "tiingo_mcp.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright==1.40.1",
    "datamodel-code-generator==0.83.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastmcp.dependencies.Depends", "fastmcp.dependencies.CurrentContext"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
include = ["src"]
reportMissingTypeStubs = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportCallInDefaultInitializer = "none"
reportUnusedCallResult = "none"
reportUnusedFunction = "none"
reportImplicitStringConcatenation = "none"
reportDeprecated = "none"
reportUnannotatedClassAttribute = "none"
