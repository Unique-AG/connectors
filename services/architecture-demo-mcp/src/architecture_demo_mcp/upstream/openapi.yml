# mcp-scaffold-commit: 9a91a8864afe, timestamp: 2026-10-21T12:09:32+00:00
# Vendored from api-evangelist/tiingo (unofficial) and patched by hand to match real
# responses; the patches are listed in the README.
components:
  responses:
    TooManyRequests:
      description: Usage limit exceeded. Tiingo limits by hourly requests (reset every
        hour), daily requests (reset at midnight EST), and monthly bandwidth (reset
        the first of every month at midnight EST); there is no per-minute or per-second
        rate limit.
    Unauthorized:
      description: Missing or invalid API token.
  schemas:
    BoatsPriceBar:
      properties:
        close:
          description: The closing price for the asset on the given date.
          type: number
        date:
          description: The date this data pertains to.
          format: date-time
          type: string
        high:
          description: The high price for the asset on the given date.
          type: number
        low:
          description: The low price for the asset on the given date.
          type: number
        open:
          description: The opening price for the asset on the given date.
          type: number
        volume:
          description: The number of shares traded on BOATS only. This value will
            only be exposed if explicitly passed to the "columns" request parameter.
            E.g. ?columns=open,high,low,close, volume
          type: integer
      type: object
    BoatsTopOfBook:
      properties:
        askPrice:
          description: The current ask price on BOATS.
          type: number
        askSize:
          description: The amount of shares at the ask price on BOATS.
          type: number
        bidPrice:
          description: The current bid price on BOATS.
          type: number
        bidSize:
          description: The amount of shares at the bid price on BOATS.
          type: number
        high:
          description: The high price of the asset on the current day. This value
            is calculated by Tiingo and not provided by BOATS.
          type: number
        last:
          description: Last is the last trade that was executed on BOATS.
          type: number
        lastSaleTimestamp:
          description: The timestamp of the last trade (last/lastSize) update from
            BOATS.
          format: date-time
          type: string
        lastSize:
          description: The amount of shares traded (volume) at the last price on BOATS.
          type: integer
        low:
          description: The low price of the asset on the current day. This value is
            calculated by Tiingo and not provided by BOATS.
          type: number
        mid:
          description: 'The mid price of the current timestamp when both "bidPrice"
            and "askPrice" are not-null. In mathematical terms: mid = (bidPrice +
            askPrice)/2.0 This value is calculated by Tiingo and not provided by BOATS.'
          type: number
        open:
          description: The opening price of the asset on the current day. This value
            is calculated by Tiingo and not provided by BOATS.
          type: number
        prevClose:
          description: Previous day's closing price of the security. This can be from
            any of the exchanges, NYSE, NASDAQ, IEX, etc.
          type: number
        quoteTimestamp:
          description: The timestamp of the last quote (bid/ask) update from BOATS.
          format: date-time
          type: string
        ticker:
          description: Ticker related to the asset.
          type: string
        timestamp:
          description: The timestamp the data was last refreshed on.
          format: date-time
          type: string
        tngoLast:
          description: Tiingo Last is either the last price or mid price. The mid
            price is only used if our algo determines it is a good proxy for the last
            price. So if the spread is considered wide by our algo, we do not use
            it. Also, after the official exchange print comes in, this value changes
            to that value. This value is calculated by Tiingo and not provided by
            BOATS .
          type: number
        volume:
          description: Live BOATS session volume for the ticker. Volume is never delayed
            on the BOATS REST endpoint.
          type: integer
      type: object
    CryptoMeta:
      properties:
        baseCurrency:
          description: The base pair of the cryptocurrency, e.g. "btc" for "btcusd".
          type: string
        description:
          description: Long-form descripton of the asset.
          type: string
        name:
          description: Full-length name of the asset.
          type: string
        quoteCurrency:
          description: The quote pair of the cryptocurrency, e.g. "usd" for "btcusd".
          type: string
        ticker:
          description: Ticker related to the asset.
          type: string
      type: object
    CryptoPriceBar:
      properties:
        close:
          description: The closing price for the asset on the given date.
          type: number
        date:
          description: The datetime this data pertains to. It will be a timestamp
            dependent upon the resampleFreq parameter. For example, if resampleFreq=5min,
            it will be in 5 min increments.
          format: date-time
          type: string
        high:
          description: The high price for the asset on the given date.
          type: number
        low:
          description: The low price for the asset on the given date.
          type: number
        open:
          description: The opening price for the asset on the given date.
          type: number
        tradesDone:
          description: The number of trades done on the given date.
          type: integer
        volume:
          description: The volume done for the asset on the specific date in the base
            currency.
          type: number
        volumeNotional:
          description: 'The last size done for the asset on the specific date in the
            quote currency. The volume done for the asset on the specific date in
            the quote currency. In mathematical terms: volumeNotional = close * volume'
          type: number
      type: object
    CryptoPrices:
      properties:
        baseCurrency:
          description: The base pair of the cryptocurrency, e.g. "btc" for "btcusd".
          type: string
        exchangeData:
          description: The underlying data for each exchange. This will only be returned
            if the includeRawExchangeData flag is set to "true".
          type: object
        priceData:
          description: Stores the top-of-book data being returned. See the table below
            for the fields in this object.
          items:
            $ref: '#/components/schemas/CryptoPriceBar'
          type: array
        quoteCurrency:
          description: The quote pair of the cryptocurrency, e.g. "usd" for "btcusd".
          type: string
        ticker:
          description: Ticker related to the asset.
          type: string
      type: object
    CryptoTopOfBook:
      properties:
        baseCurrency:
          description: The base pair of the cryptocurrency, e.g. "btc" for "btcusd".
          type: string
        exchangeData:
          description: The underlying data for each exchange. This will only be returned
            if the includeRawExchangeData flag is set to "true".
          type: object
        quoteCurrency:
          description: The quote pair of the cryptocurrency, e.g. "usd" for "btcusd".
          type: string
        ticker:
          description: Ticker related to the asset.
          type: string
        topOfBookData:
          description: Stores the top-of-book data being returned. See the table below
            for the fields in this object.
          items:
            $ref: '#/components/schemas/CryptoTopOfBookData'
          type: array
      type: object
    CryptoTopOfBookData:
      properties:
        askExchange:
          description: The full name of the exchange the "askPrice" and "askSize"
            are located on.
          type: string
        askPrice:
          description: The current ask price.
          type: number
        askSize:
          description: The amount of shares at the ask price.
          type: number
        bidExchange:
          description: The full name of the exchange the "bidPrice" and "bidSize"
            are located on.
          type: string
        bidPrice:
          description: The current bid price.
          type: number
        bidSize:
          description: The amount of shares at the bid price.
          type: number
        lastExchange:
          description: The full name of the exchange the "lastPrice" and "lastSize"
            were executed on.
          type: string
        lastPrice:
          description: Last price is the last price that was executed on any crypto
            exchange.
          type: number
        lastSaleTimestamp:
          description: The timestamp the last time the trade (last/lastSize) data
            was received from any crypto exchange.
          format: date-time
          type: string
        lastSize:
          description: The amount of crypto volume done at the last price in the base
            currency.
          type: number
        lastSizeNotional:
          description: 'The last size done for the asset on the specific date in the
            quote currency. The notional of the volume traded. In mathematical terms:
            lastSizeNotional = lastPrice * lastSize'
          type: number
        quoteTimestamp:
          description: The timestamp the last time the quote (bid/ask) data was received
            from any crypto exchange.
          format: date-time
          type: string
      type: object
    DailyMeta:
      properties:
        description:
          description: Long-form descripton of the asset.
          type: string
        endDate:
          description: The latest date we have price data available for the asset.
            When null it means no price data available for the given asset.
          format: date
          type: string
          nullable: true
        exchangeCode:
          description: An identifier that maps which Exchange this asset is listed
            on.
          type: string
        name:
          description: Full-length name of the asset.
          type: string
        startDate:
          description: The earliest date we have price data available for the asset.
            When null it means no price data available for the given asset.
          format: date
          type: string
          nullable: true
        ticker:
          description: Ticker related to the asset.
          type: string
      type: object
    DailyPriceBar:
      properties:
        adjClose:
          description: The adjusted closing price for the asset on the given date.
          type: number
        adjHigh:
          description: The adjusted high price for the asset on the given date.
          type: number
        adjLow:
          description: The adjusted low price for the asset on the given date.
          type: number
        adjOpen:
          description: The adjusted opening price for the asset on the given date.
          type: number
        adjVolume:
          description: The number of shares traded for the asset.
          type: integer
        close:
          description: The closing price for the asset on the given date.
          type: number
        date:
          description: The date this data pertains to.
          format: date
          type: string
        divCash:
          description: The dividend paid out on "date" (note that "date" will be the
            "exDate" for the dividend).
          type: number
        high:
          description: The high price for the asset on the given date.
          type: number
        low:
          description: The low price for the asset on the given date.
          type: number
        open:
          description: The opening price for the asset on the given date.
          type: number
        splitFactor:
          description: The factor used to adjust prices when a company splits, reverse
            splits, or pays a distribution.
          type: number
        volume:
          description: The number of shares traded for the asset.
          type: integer
      type: object
    Distribution:
      properties:
        declarationDate:
          description: The declaration date of the distribution.
          format: date-time
          type: string
        distribution:
          description: The total distribution for the given date.
          type: number
        distributionFreqency:
          description: 'The frequency that''s associated with this distribution. For
            example "q" means quarterly, meaning this is a declared quarterly distribution.
            The full list of codes is available here: w : Weekly bm : Bimonthly m
            : Monthly tm : Trimesterly q : Quarterly sa : Semiannually a : Annually
            ir : Irregular f : Final u : Unspecified c : Cancelled'
          type: string
        exDate:
          description: The ex-Date of the distribution. In the Tiingo EOD Endpoints,
            this is the date where "divCash" will be non-zero. This is also the date
            used for dividend price adjustments.
          format: date-time
          type: string
        paymentDate:
          description: The payment date of the distribution.
          format: date-time
          type: string
        permaTicker:
          description: The Tiingo permaticker.
          type: string
        recordDate:
          description: The record date of the distribution.
          format: date-time
          type: string
        ticker:
          description: Ticker related to the asset.
          type: string
      type: object
    DistributionYield:
      properties:
        date:
          description: Date associated with the yield.
          format: date-time
          type: string
        trailingDiv1Y:
          description: The trailing distribution yield for the asset based on the
            previous 1 year of distributions.
          type: string
      type: object
    EquityRealtimePriceBar:
      properties:
        close:
          description: The closing price for the asset on the given date.
          type: number
        date:
          description: The date this data pertains to.
          format: date-time
          type: string
        high:
          description: The high price for the asset on the given date.
          type: number
        low:
          description: The low price for the asset on the given date.
          type: number
        open:
          description: The opening price for the asset on the given date.
          type: number
        volume:
          description: The consolidated number of shares traded for the interval.
            This value will only be exposed if explicitly passed to the "columns"
            request parameter. E.g. ?columns=open,high,low,close, volume
          type: integer
      type: object
    EquityRealtimeTopOfBook:
      properties:
        high:
          description: The high price of the asset on the current day This value is
            calculated by Tiingo from the consolidated equity feed.
          type: number
        low:
          description: The low price of the asset on the current day This value is
            calculated by Tiingo from the consolidated equity feed.
          type: number
        lqAskPrice:
          description: The ask price component of the liquidity risk metric. Corresponds
            to lqAskPrice in the thresholdLevel 4 websocket liquidity risk metric.
          type: number
        lqAskSize:
          description: The ask size component of the liquidity risk metric in shares.
            Corresponds to lqAskSize in the thresholdLevel 4 websocket liquidity risk
            metric.
          type: integer
        lqBidPrice:
          description: The bid price component of the liquidity risk metric. Corresponds
            to lqBidPrice in the thresholdLevel 4 websocket liquidity risk metric.
          type: number
        lqBidSize:
          description: The bid size component of the liquidity risk metric in shares.
            Corresponds to lqBidSize in the thresholdLevel 4 websocket liquidity risk
            metric.
          type: integer
        lqRefPrice:
          description: The same as tngoLast - mirrored for convenience/consistency
            as it's better-named for its role in the lq spread metrics.
          type: number
        lqSpread:
          description: The relative lqBid/Ask spread component of the liquidity risk
            metric, expressed as a decimal (e.g. 0.04 means 4%). Corresponds to lqSpread
            in the thresholdLevel 4 websocket liquidity risk metric.
          type: number
        open:
          description: The opening price of the asset on the current day This value
            is calculated by Tiingo from the consolidated equity feed.
          type: number
        prevClose:
          description: Previous day's closing price of the security. This can come
            from the supported consolidated equity market data sources.
          type: number
        ticker:
          description: Ticker related to the asset.
          type: string
        timestamp:
          description: The timestamp the data was last refresh on.
          format: date-time
          type: string
        tngoLast:
          description: Tiingo Last is either the last price or mid price. The mid
            price is only used if our algo determines it is a good proxy for the last
            price. So if the spread is considered wide by our algo, we do not use
            it. Also, after the official exchange print comes in, this value changes
            to that value. This value is calculated by Tiingo from the consolidated
            equity feed .
          type: number
        volume:
          description: Volume will be consolidated intraday volume throughout the
            day. Once the official closing price comes in, volume may reflect the
            full official trading day. This field is available for convenience.
          type: integer
      type: object
    ForexPriceBar:
      properties:
        close:
          description: The closing price for the asset on the given date.
          type: number
        date:
          description: The date this data pertains to.
          format: date-time
          type: string
        high:
          description: The high price for the asset on the given date.
