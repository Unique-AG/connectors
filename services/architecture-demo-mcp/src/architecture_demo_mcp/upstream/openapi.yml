          type: string
        ticker:
          description: Ticker related to the asset.
          type: string
      type: object
    FundFeeMetrics:
      properties:
        12b1:
          description: Fund's fee related to marketing expenses.
          type: number
        accountFeePercent:
          description: Fund's account fees if charged as a percentage, or the fee
            required to maintain your account in percentage terms.
          type: number
        accountFeeUSD:
          description: Fund's account fees if charged in USD, or the fee required
            to maintain your account in USD.
          type: number
        acquiredFundFees:
          description: Fund's acquired fund fees, or expenses related to underlying
            businesses or funds.
          type: number
        backLoad:
          description: Fund's back load fee, or the back-end fee charged when redeeming
            from the fund.
          type: number
        customFees:
          description: Fund's custom fees. For a full breakdown, see the table below.
          items: &id001
            type: object
          type: array
        dividendLoad:
          description: Dividend load fee, or charges on reinvested dividends.
          type: number
        exchangeFeePercent:
          description: Fund's exchange fee if charged as a percentage, or expenses
            related to exchanging or transferring funds to another fund in the fund's
            family.
          type: number
        exchangeFeeUSD:
          description: Fund's exchange fee if charged in USD, or expenses related
            to exchanging or transferring funds to another fund in the fund's family.
          type: number
        feeWaiver:
          description: Fund's fee waiver, or discount on fees.
          type: number
        frontLoad:
          description: Fund's front load fee, or the upfront fee charged when investing
            in the fund.
          type: number
        grossExpense:
          description: Fund's gross expense ratio, or the expenses related to running
            the fund.
          type: number
        managementFee:
          description: Fund's management fee, or the fees paid to the manager and/or
            advisors.
          type: number
        miscFees:
          description: Fund's miscellaneous fees.
          type: number
        netExpense:
          description: Fund's net expense ratio, or the net expenses related to the
            fund.
          type: number
        non12b1:
          description: Fund's fee related to distribution and smilar non 12b-1 fees.
          type: number
        otherExpenses:
          description: Fund's other expenses, or expenses related to legal, adminstrative,
            custodial, etc.
          type: number
        portfolioTurnover:
          description: Portfolio turnover.
          type: number
        prospectusDate:
          description: The prospectus date when the corresponding fund expense data
            was published.
          format: date
          type: string
        redemptionFeePercent:
          description: Fund's redemption fees as a percentage, or the fee charged
            if funds are redeemed early (as defined by the fund company).
          type: number
        redemptionFeeUSD:
          description: Fund's redemption fees if charged in USD, or the fee charged
            if funds are redeemed early (as defined by the fund company).
          type: number
        shareholderFee:
          description: Fund's shareholder fees, or the potential fees when buying/selling
            a fund.
          type: number
      type: object
    FundFees:
