externalDocs:
  description: Tiingo API documentation
  url: https://www.tiingo.com/documentation/general/overview
info:
  contact:
    email: support@tiingo.com
    name: Tiingo Support
    url: https://www.tiingo.com/support
  description: 'Tiingo''s REST API for financial market data: end-of-day equity prices,
    IEX intraday, BOATS overnight equity data, consolidated equity realtime snapshots,
    crypto, crypto yield, forex, fundamentals, mutual fund and ETF fees, corporate
    actions, curated news, and asset search. Most endpoints return JSON by default
    and support CSV via the format parameter. Generated by API Evangelist from Tiingo''s
    published documentation (https://www.tiingo.com/documentation/) - Tiingo does
    not publish an OpenAPI itself.'
  termsOfService: https://www.tiingo.com/about/terms
  title: Tiingo API
  version: 1.0.0
  x-apievangelist:
    generated: '2026-07-22'
    method: generated
    source: https://apimedia.tiingo.com/dist/src_app_api_documentation_documentation_module_ts-es2015.f5eea3d64917e26bb724.js
openapi: 3.0.3
paths:
  /api/test:
    get:
      externalDocs:
        url: https://www.tiingo.com/documentation/general/connecting
      operationId: testConnection
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  message:
                    description: Confirmation message, e.g. 'You successfully sent
                      a request'.
                    type: string
                type: object
          description: Successful response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Test API connectivity and authentication
      tags:
      - Utilities
  /boats:
    get:
      externalDocs:
        url: https://www.tiingo.com/documentation/boats
      operationId: getBoatsTopOfBook
      parameters:
      - description: Ticker related to the asset. Pass a comma-separated list for
          multiple tickers (for example aapl,spy).
        in: query
        name: tickers
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BoatsTopOfBook'
                type: array
          description: Successful response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Get BOATS overnight top-of-book and last-sale quotes (beta)
      tags:
      - BOATS
  /boats/{ticker}/prices:
    get:
      externalDocs:
        url: https://www.tiingo.com/documentation/boats
      operationId: getBoatsHistoricalPrices
      parameters:
      - description: Ticker related to the asset.
        in: path
        name: ticker
        required: true
        schema:
          type: string
      - description: If startDate or endDate is not null, historical data will be
          queried. This filter limits metrics to on or after the startDate (>=). Parameter
          must be in YYYY-MM-DD format. When both dates are omitted, Tiingo returns
          the latest overnight BOATS session window (8:00 PM-3:59 AM ET).
        in: query
        name: startDate
        required: false
        schema:
          format: date
          type: string
      - description: If startDate or endDate is not null, historical data will be
          queried. This filter limits metrics to on or before the endDate (<=). Parameter
          must be in YYYY-MM-DD format. Date-only endDate values are normalized to
          the BOATS overnight session end (3:59 AM ET).
        in: query
        name: endDate
        required: false
        schema:
          format: date
          type: string
      - description: 'This allows you to set the frequency in which you want data
          resampled. For example "1hour" would return the data where OHLC is calculated
          on an hourly schedule. The minimum value is "1min". Both units in minutes
          (min) and hours (hour) are accepted. Format is # + (min/hour); e.g. "15min"
          or "4hour". If no value is provided, defaults to 5min.'
        in: query
        name: resampleFreq
        required: false
        schema:
          type: string
      - description: Accepted for request compatibility with other equity intraday
          endpoints, but it does not widen the BOATS historical window. BOATS history
          is limited to the overnight session (8:00 PM-3:59 AM ET) regardless of this
          flag.
        in: query
        name: afterHours
        required: false
        schema:
          type: boolean
      - description: Some tickers do not have a trade/quote update for a given time
          period. if forceFill is set to true, then the previous OHLC will be used
          to fill the current OHLC.
        in: query
        name: forceFill
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BoatsPriceBar'
                type: array
          description: Successful response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Get BOATS overnight historical intraday prices for a ticker (beta)
      tags:
      - BOATS
  /iex:
    get:
      externalDocs:
        url: https://www.tiingo.com/documentation/iex
      operationId: getIexTopOfBook
      parameters:
      - description: Ticker related to the asset.
        in: query
        name: tickers
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IexTopOfBook'
                type: array
          description: Successful response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Get IEX top-of-book and last-sale quotes
      tags:
      - IEX
  /iex/{ticker}/prices:
    get:
      externalDocs:
        url: https://www.tiingo.com/documentation/iex
      operationId: getIexHistoricalPrices
      parameters:
      - description: Ticker related to the asset.
        in: path
        name: ticker
        required: true
        schema:
          type: string
      - description: If startDate or endDate is not null, historical data will be
          queried. This filter limits metrics to on or after the startDate (>=). Parameter
          must be in YYYY-MM-DD format.
        in: query
        name: startDate
        required: false
        schema:
          format: date
          type: string
      - description: If startDate or endDate is not null, historical data will be
          queried. This filter limits metrics to on or before the endDate (<=). Parameter
          must be in YYYY-MM-DD format.
        in: query
        name: endDate
        required: false
        schema:
          format: date
          type: string
      - description: 'his allows you to set the frequency in which you want data resampled.
          For example "1hour" would return the data where OHLC is calculated on an
          hourly schedule. The minimum value is "1min". Both units in minutes (min)
          and hours (hour) are accepted. Format is # + (min/hour); e.g. "15min" or
          "4hour". If no value is provided, defaults to 5min.'
        in: query
        name: resampleFreq
        required: false
        schema:
          type: string
      - description: If set to true, includes pre and post market data if available.
        in: query
        name: afterHours
        required: false
        schema:
          type: boolean
      - description: Some tickers do not have a trade/quote update for a given time
          period. if forceFill is set to true, then the previous OHLC will be used
          to fill the current OHLC.
