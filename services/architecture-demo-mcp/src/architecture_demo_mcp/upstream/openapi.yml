  /tiingo/news:
    get:
      externalDocs:
        url: https://www.tiingo.com/documentation/news
      operationId: listNews
      parameters:
      - description: 'A comma-separated list of the tickers requested. When passing
          via GET parameter (not in URL), use a JSON array, otherwise use a comma-separated
          list. #Use the below format if querying directly in the URL https://api.tiingo.com/tiingo/news?tickers=aapl,googl
          #Otherwise, if passing GET parameters via a request library, use a JSON
          array like this: tickers : [''aapl'',''googl'']'
        in: query
        name: tickers
        required: false
        schema:
          items: *id002
          type: array
      - description: 'A comma-separated list of the tags requested. When passing via
          GET parameter (not in URL), use a JSON array, otherwise use a comma-separated
          list. #Use the below format if querying directly in the URL https://api.tiingo.com/tiingo/news?source=bloomberg.com,reuters.com
          #Otherwise, if passing GET parameters via a request library, use a JSON
          array like this: source : [''bloomberg.com'',''reuters.com'']'
        in: query
        name: source
        required: false
        schema:
          items: *id002
          type: array
      - description: If startDate or endDate is not null, historical data will be
          queried. This filter limits news stories to on or later than the publishedDate
          (>=). Parameter must be in YYYY-MM-DD format.
        in: query
        name: startDate
        required: false
        schema:
          format: date
          type: string
      - description: If startDate or endDate is not null, historical data will be
          queried. This filter limits news stories to on or less than the publishedDate
          (<=). Parameter must be in YYYY-MM-DD format.
        in: query
        name: endDate
        required: false
        schema:
          format: date
          type: string
      - description: The maximum number of news objects to return in the array. The
          default is 100 and the max is 1000. This is maxed to 1,000 as any more than
          that tends to lead to longer wait times. If you would like this adjusted,
          please contact us at support@tiingo.com .
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: 'This is a "pagination" variable that is often used alongside
          limit. It returns an array with the results shifted by "offset". For example,
          when limit is 0 you may get the following: 0. News Story A 1. News Story
          B 2. News Story C 3. News Story D When offset is "2" you will receive: 0.
          News Story C 1. News Story D 2. News Story E 3. News Story F This, when
          used alongside "limit" allows for pagination and more efficient queries.'
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: The field can take either "publishedDate" or "crawlDate". The
          date field specified will be used to sort the results in descending order.
          The results can either be sorted by when the news outlet reported the publish
          time ("datePublished") or when our feeds came across is ("crawlDate"). Defaults
          to "publishedDate" if no value provided
        in: query
        name: sortBy
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/NewsArticle'
                type: array
          description: Successful response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Get curated financial news articles
      tags:
      - News
