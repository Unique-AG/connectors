# `alembic upgrade head` runs this in the chart's migration hook, from /app in the image.
[alembic]
script_location = %(here)s/src/architecture_demo_mcp/persistence/migrations
prepend_sys_path = src
path_separator = os

# A new revision keeps the code style mcp-architecture checks. ruff is a dev dependency, which
# only `alembic revision` needs: the image runs `alembic upgrade head`, which writes nothing.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
