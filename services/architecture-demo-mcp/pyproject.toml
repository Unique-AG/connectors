# mcp-scaffold-version: 0.0.1, timestamp: 2026-10-21T12:09:32+00:00
[project]
name = "architecture-demo-mcp"
version = "0.0.0"
description = "Reference MCP showing every scaffold layer against Tiingo market data: OpenAPI operations served as tools, a Redis-cached price performance summary and a Postgres portfolio, behind Zitadel sign-in."
classifiers = ["Development Status :: 3 - Alpha"]
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastmcp==4.1.0",
    "httpx2==2.13.1",
    "mcp-configs==0.1.0",
    "mcp-openapi==0.1.0",
    "mcp-types==2.3.0",
    "py-key-value-aio[redis,wrappers-encryption]==0.4.6",
    "pydantic-settings==2.15.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.1.3",
    "starlette==1.8.0",
    "tenacity==9.1.4",
    "unique-mcp==2026.44.0.dev1",
    "unique-sdk==2026.44.0.dev10",
    "unique-toolkit[monitoring,otel]==2026.44.0.dev2",
    "uvicorn[standard]==0.53.0",
]

[project.scripts]
architecture-demo-mcp = "architecture_demo_mcp.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "basedpyright==1.40.2",
    "mcp-architecture==0.1.0",
    "mcp-openapi[codegen]==0.1.0",
    "pytest-asyncio==1.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning:unique_toolkit.*"]

[tool.ruff]
# For the editor and a bare `ruff check`. `uv run mcp-architecture-lint` checks the code style
# every MCP keeps with the shared file itself, whatever this table says, then with this table for
# a rule added here with `extend-select`.
extend = "../../packages/mcp-architecture/src/mcp_architecture/code_style.toml"

[tool.ruff.lint.per-file-ignores]
# The shared file's, which ruff reads from that file's folder through `extend`.
"!**/src/*/contexts/**" = ["PLR0917"]
"**/src/*/upstream/generated/**" = ["N815"]

[tool.basedpyright]
# The type check every MCP keeps. Make a report stricter here, but never turn one down.
extends = "../../packages/mcp-architecture/src/mcp_architecture/type_check.json"
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
include = ["src", "tests"]
# A test may reach a private name of the code it tests. Here and not in the shared type check,
# since basedpyright reads a root there from the folder of that file. `.` resolves `tests.*`.
executionEnvironments = [{ root = "tests", extraPaths = ["."], reportPrivateUsage = false }]

[tool.uv.sources]
mcp-architecture = { path = "../../packages/mcp-architecture" }
mcp-configs = { path = "../../packages/mcp-configs" }
mcp-openapi = { path = "../../packages/mcp-openapi" }

[tool.mcp-openapi]
spec = "src/architecture_demo_mcp/upstream/openapi.yml"
operation-ids = ["getDailyMeta", "getDailyPrices"]
operation-module = "mcp_openapi.upstream"
models-module = "architecture_demo_mcp.upstream.generated.vendor_responses"
models-output = "src/architecture_demo_mcp/upstream/generated/vendor_responses.py"
operations-output = "src/architecture_demo_mcp/upstream/generated/operations.py"

# The MCP's own import contracts. `uv run mcp-architecture-imports` checks the ones every MCP keeps,
# which packages/mcp-architecture/ARCHITECTURE.md explains, then these.
[tool.importlinter]
root_package = "architecture_demo_mcp"
