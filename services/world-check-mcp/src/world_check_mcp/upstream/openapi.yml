          - columnName: providerType
            order: ASCENDING
        pagination:
          itemsPerPage: 25
          pageReference: Reference ID of the requested page

    ResultsSearchModel:
      type: object
      description: |
        Request model used to filter, sort and paginate the screening results of a single case.

        A model contains 'query', 'filter' expression, which is written in a superset of the Atom Feed Item Query Language (FIQL).

        The FIQL is documented in <https://tools.ietf.org/html/draft-nottingham-atompub-fiql-00>,
        and the superset supported by the WC1 API documented in <https://github.com/jirutka/rsql-parser>.

        RSQL/FIQL parser contains some reserved characters:

        `'"' | "'" | "(" | ")" | ";" | "," | "=" | "!" | "~" | "<" | ">"`

        If there are reserved characters or white spaces in the query expression, they must be escaped by enclosing 
        them in single or double quotes. If you need to use both single and double quotes inside an argument, then
        you must escape one of them using `\` (backslash). If you want to use `\` literally, then double it as `\\`.
        Backslash has a special meaning only inside a quoted argument, not in unquoted argument. Using reserved 
        characters or white spaces without escaping can lead to parsing and execution errors.

        The query examples:

        * "query": "example=='TE!ST'"
        * "query": "example==\\"TE'ST\\""
        * "query": "example=='TE\\\\'ST'"

        Argument can be a single value, or multiple values in parenthesis separated by comma. Value that does not
        contain any reserved character or a white space can be unquoted, other arguments must be enclosed in single 
        or double quotes.

        Example:

        * "query": "example1=='TE\\\\'ST', example2==TEST"
      properties:
        filter:
          type: string
          description: |
            A string containing filter criteria.
            **Note:** To find the available search fields, check for fields with 'FILTER' type in the `GET /reference/searchFilters` endpoint.
        sort:
          type: array
          description: |
            An array of sorting criteria.

            The list of available sort parameter names:
            - 'primaryName' - sort by the primary name for the Case;

          items:
            $ref: '#/components/schemas/SortCriterion'

    ResultsSearchModelForResults:
      type: object
      description: |
        Request model used to filter, sort and paginate the screening results of a single case.

        A model contains 'query', 'filter' expression, which is written in a superset of the Atom Feed Item Query Language (FIQL).

        The FIQL is documented in <https://tools.ietf.org/html/draft-nottingham-atompub-fiql-00>,
        and the superset supported by the WC1 API documented in <https://github.com/jirutka/rsql-parser>.

        RSQL/FIQL parser contains some reserved characters:

        `'"' | "'" | "(" | ")" | ";" | "," | "=" | "!" | "~" | "<" | ">"`

        If there are reserved characters or white spaces in the query expression, they must be escaped by enclosing 
        them in single or double quotes. If you need to use both single and double quotes inside an argument, then
        you must escape one of them using `\` (backslash). If you want to use `\` literally, then double it as `\\`.
        Backslash has a special meaning only inside a quoted argument, not in unquoted argument. Using reserved 
        characters or white spaces without escaping can lead to parsing and execution errors.

        The query examples:

        * "query": "example=='TE!ST'"
        * "query": "example==\\"TE'ST\\""
        * "query": "example=='TE\\\\'ST'"

        Argument can be a single value, or multiple values in parenthesis separated by comma. Value that does not
        contain any reserved character or a white space can be unquoted, other arguments must be enclosed in single 
        or double quotes.

        Example:

        * "query": "example1=='TE\\\\'ST', example2==TEST"
      properties:
        filter:
          type: string
          description: |
            A string containing filter criteria.The Available Filters are given below.
            - 'resolutionType'
            - 'matchedTermType'
            - 'matchStrength'
            - 'compositeMatchScore'
            - 'compositeMatchStrength'
            - 'sourceCategories'
            - 'gender'
            - 'dateOfBirth'
            - 'identificationType'
            - 'placeOfBirth'
            - 'citizenship'
            - 'country'
            - 'recordSubType'
            - 'pepStatus'
            - 'pepInactivityPeriod'
            - 'specialInterestCategory'
            - 'pepCategory'
            - 'keyword'
            - 'creationDate'
            - 'modificationDate'
            - 'lastAlertDate'
            - 'reviewRequired'
            - 'reviewRequiredDate'
        sort:
          type: array
          description: |
            An array of sorting criteria.

            The list of available sort parameter names:
            - 'matchStrength' 
            - 'compositeMatchScore'
            - 'compositeMatchStrength'
            - 'gender' 
            - 'recordSubType' 
            - 'pepStatus' 
            - 'creationDate'
            - 'modificationDate'
            - 'lastAlertDate'
            - 'reviewRequiredDate'
          items:
            $ref: '#/components/schemas/SortCriterion'

