  /bulk/cases/update:
    post:
      operationId: partialUpdateAndScreenCases
      tags:
        - bulk
      summary: Update and screen multiple cases.
      description: |
        Update and screen multiple cases. Caller may include multiple cases with up to 1000 entities in a single request (see *Example HTTP request* below).
        Also it is possible to include an audit note.
        
        There is a query parameter with the bulk update endpoint ?screen=NONE/ASYNC/DELTA_ASYNC, which allows different results to be shown:

        * NONE: Pure update; no screening by default.
        * ASYNC: Update; and a screening request is added automatically to a queue for asynchronous screening.You may use POST /cases/screening-status endpoint to check for the screening status for the cases and POST /cases/{caseSystemId}/results to retrieve the updated results for a given case. You may also use this option to fully re-screen the case asynchronously without updating the case by providing just 'caseSystemId' in the request.
        * DELTA_ASYNC: Update; and delta screen the case asynchronously against new and updated data from the last screened date of the case. Example: If case was last screened on 01-Jul-2026, using DELTA_ASYNC option will allow you to screen the case against new and updated data since 01-Jul-2026 until the current day. You may also use this option to perform delta screening on the case asynchronously without updating the case by providing just 'caseSystemId' in the request.
        
        **Note:**
          1. The processing time of a bulk update request is proportional to the number of cases included in the request. Larger bulk update requests may take longer to complete. Please note that the API gateway timeout is 120 seconds.
          2. We recommend submitting bulk update requests sequentially, i.e. waiting for a bulk update request to complete before submitting the next request. Concurrent or excessive bulk update requests may result in HTTP 429 (Too Many Requests) responses.
          3. The maximum number of screenings (including full screens and re-screens) that a client can perform in an hour may be limited.
          4. When updating an existing Case with Passport-Check details via the API, to check the details in the UI, you must refresh the page to view all updated details.
          5. Give "null" in the applicable fields if you want to remove the respective data from the case details.
          6. 'caseId' must not start or end with a slash or contain two consecutive slashes (//) as this may result in errors.
          7. For list type fields e.g. secondaryFields, passing an empty list will delete the entire contents of the list from the case. Passing a 'null' value will leave the list as it currently is


        *Example HTTP response* below, shows the following summary:

          1. The first case has been updated successfully.
          2. The second case has not been updated successfully because it does not meet the validation criteria;
           "errors" array contains detailed information.

        **Example HTTP response**

        ```
          [
            {
              "caseId": "newcaseidrob122",
              "name": "James Bond",
              "caseSystemId": "2xgz865go5kdp1id7g0hn0lcsg",
              "caseScreeningState": {
                "WATCHLIST": "ONGOING",
                "MEDIA_CHECK": "INITIAL"
              },
              "nameTransposition": false,
              "caseRating": "HIGH",
              "errors": []
            },
            {
              "caseId": "newcaseidrob123",
              "name": "James Bond",
              "caseSystemId": "invalid_id",
              "caseScreeningState": {
                "WATCHLIST": "ONGOING",
                "MEDIA_CHECK": "INITIAL"
              },
              "nameTransposition": false,
              "caseRating": "HIGH",
              "errors": [
                {
                  "code": "CASE_NOT_FOUND",
                  "message": "API key does not have permission to access the case or case not found."
                }
              ]
            }
          ]
        ```
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/ContentLength'
        - name: screen
          description: Screen mode.
          in: query
          schema:
            $ref: '#/components/schemas/BulkUpdateScreenMode'
          required: false
      requestBody:
        description: Container of cases that is used in scope of creation operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialUpdateCaseCollection'
        required: true
      responses:
        "200":
          description: |
            If the request passed general validation, the caller receives response with ScreeningResultCollection list,
            with summaries for each case located in payload.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkUpdateScreeningResultCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CannotReturnResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /bulk/cases/ongoing-screening:
    post:
      operationId: toggleOngoingScreeningByProviderTypes
      tags:
        - bulk
      summary: Enable/Disable OGS for multiple cases.
      description: |
        Bulk Update Ongoing Screening (OGS) States of cases with provided `caseSystemIds` and `ProviderType`s specified in
        `caseScreeningState`. Ongoing screening can be performed for MEDIA_CHECK and WATCHLIST provider types. Case screening state
