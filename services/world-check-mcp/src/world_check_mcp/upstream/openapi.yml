  /bulk/cases/assignment:
    post:
      operationId: assignCases
      tags:
        - bulk
      summary: Assign multiple cases to a user.
      description: |
        For each given 'caseSystemId', the assignee can be updated by changing the value in the "userid" field. If the "userId" field 
        value is null, then the cases will be unassigned. If an active user id is selected then the case will be assigned to that "userid". 
        To complete this operation the user must be active and have the assign permission. Assign and unassign cannot be in the same request 
        and the number of cases to action must be <1000.
        
        In the response, the user receives a summary of the action showing total count of cases processed and this count split between success and failed.
        A list of failed cases only will be displayed under the summary - showing the "caseSystemId" , "caseId " has not been deleted because 
        it does not meet the validation criteria "error" and "cause" fields contain detailed information on the error.

        *Example HTTP response below, shows the following summary:

          1. "caseSystemId1", "caseId" has not been assigned because it does not meet the validation criteria; "error" and "cause" fields 
        contain detailed information of the error.

      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/ContentLength'
      requestBody:
        description: A request on Bulk Update Case Assignments.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseBulkAssignRequest'
