  /cases/{caseSystemId}/ubo/{uniqueBusinessId}:
    post:
      operationId: getUboDetails
      tags:
        - ubo-check
      summary: Retrieve details of a selected UBO entity.
      description: |
        This endpoint will provide the user with the whole UBO summary associated with given 'uniqueBusinessId' for given 'caseSystemId'.
        'uniqueBusinessId' represents DUNS number for DnB and entityId for Sayari.
        UBO summary will carry the details-like list of Beneficial Owners along with the beneficiary percentages, type of Beneficial Owners and their relationships.
        The following filters can be applied - depth, beneficialOwnershipOnly, countryCode, beneficialOwnershipPercentage and ownersType.
        Examples -
            ...
            {
              "baseFilters": {
                "depth": 2,
                "beneficialOwnershipOnly": true,
                "beneficialOwnershipPercentage": 5,
                "countryCode": "USA",
                "ownersType":"Individual"     
              },
              "getLatestData": true
            }        
            ...
            ...
            {
              "baseFilters": {
                "depth": 1,
                "beneficialOwnershipOnly": false,
                "beneficialOwnershipPercentage": 20,
                "countryCode": "USA",
                "ownersType":"Business"
              },
              "getLatestData": false
            }
            ...
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/ContentLength'
        - $ref: '#/components/parameters/CaseSystemId'
        - $ref: '#/components/parameters/UniqueBusinessId'
      requestBody:
        description: Request body to identify the UBO case.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UboSummaryRequest'
        required: false
      responses:
        "200":
          description: Details for a selected UBO case identified by the given `caseSystemId` and 'uniqueBusinessId'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UboSummaryResponse'
        "400":
