              $ref: '#/components/schemas/LifecycleState'
            creator:
              $ref: '#/components/schemas/UserSummaryDetails'
            modifier:
              $ref: '#/components/schemas/UserSummaryDetails'
            assignee:
              $ref: '#/components/schemas/UserSummaryDetails'
