          maxLength: 512
        name:
          type: string
          description: Name to screen for this Сase.
          maxLength: 1000
        alternateNames:
          type: array
          x-wc1-field-extra-annotations:
            - "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_EMPTY)"
          maxItems: 2
          x-wc1-skip-bean-validation: true
          description: List of additional names to be screened
          items:
            type: string
            description: Name to screen for this Case.
            maxLength: 1000
            x-wc1-skip-bean-validation: true
        providerTypes:
          type: array
          description: |
            Provider types required to Screen this Case.
            For 'Zero Footprint Screening (ZFS)', both 'WATCHLIST' and 'CLIENT_WATCHLIST' are supported.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProviderType'
        customFields:
          type: array
          description: |
            Case Custom Fields. Available Custom Fields and their definitions can be obtained via
            `GET /groups/{groupId}/case-template` endpoint. Custom fields cannot be used with 'Zero Footprint Screening (ZFS)'.
          items:
            $ref: '#/components/schemas/Field'
          x-wc1-field-extra-annotations: "@com.thomsonreuters.grc.platform.util.content.annotation.PersonallyIdentifiable"
          x-wc1-field-default-value: new ArrayList<>()
        secondaryFields:
          type: array
          description: |
            Case Secondary Fields. Available Secondary Fields and their definitions can be obtained via
            `GET /groups/{groupId}/case-template` endpoint.
          items:
            $ref: '#/components/schemas/Field'
          x-wc1-field-extra-annotations: "@com.thomsonreuters.grc.platform.util.content.annotation.PersonallyIdentifiable"
          x-wc1-field-default-value: new ArrayList<>()
        groupId:
          type: string
          description: |
            The identifier of the Group that owns this Case. 
            The Group determines whether the Case is screened as 'Zero Footprint Screening (ZFS)' or not.
          maxLength: 255
        entityType:
          $ref: '#/components/schemas/CaseEntityType'
        caseSystemId:
          type: string
          description: The system-generated ID for the Case.
          maxLength: 192
        caseScreeningState:
          type: object
          description: |
            A mapping from ProviderType to indicate whether ongoing screening is enabled for this Case on the specific [ProviderType](#tag/ProviderType_Model). 
            By default, the value is set from account settings.
            
            The Available ProviderTypes are "WATCHLIST", "PASSPORT_CHECK", "MEDIA_CHECK", "CLIENT_WATCHLIST", "UBO_CHECK".
          additionalProperties:
            $ref: '#/components/schemas/CaseScreeningState'
          x-wc1-map-key-value: ProviderType
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'
