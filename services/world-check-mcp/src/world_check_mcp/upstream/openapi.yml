  /admin/audit-events:
    post:
      operationId: getAdminAuditEvents
      tags:
        - admin
      summary: Search for Admin Audit Events
      description: |
        Retrieves a filtered and paged list of Admin Audit Events for the client. To get the full list of audit events 
        the request should have an empty payload or no query parameters entered.                                   
        However, please note that if an audit list is requested without any date range for eventDate in the query, it will
        only returns audit data for the last 168 hours/ 7 days (168 hours) by default. 

        * The maximum items per page allowed is 1000 within the `pagination` object.
        * `sort` object with the default sort as DESCENDING order. The list of available sort parameter names:
           - eventDate
           
        The list returned can be filtered/sorted in the body of the query by:
        
        **eventDate**: The time when the Audit Event was created (ISO 8601 format excluding Week and Ordinal dates).
        
               e.g. eventDate>=2010-07-28T22:25:51Z;eventDate<2015-07-28T22:25:51Z 
               e.g. eventDate=RANGE=(2010-07-28T22:25:51Z,2015-07-28T22:25:51Z) 
        
        **actionType**: Signifies the admin audit event action type.
           
               e.g. actionType=='NEW_GROUP'
               actionType=in=('NEW_GROUP', 'UPDATE_GROUP')
         
        **actionedByUserId**: Identifier of the User who created this audit event.
           
               e.g. actionedByUserId==663b4481-5b45-40a4-8b76-54ef805beea5
         
        **objectType**: The type of object that is being acted upon in the audit event.
           
               e.g. objectType=='GROUP'
        
        **groupId**: The identifier of the group that is being acted upon in the audit event.
           
               e.g. groupId==123456
        
        **The above criteria can also be combined.**
        
               e.g. eventDate>=20120915T155300;eventDate<=2015-07-28T22:25:51Z;actionType=='NEW_GROUP'
               actionedByUserId==663b4481-5b45-40a4-8b76-54ef805beea5;objectType=='GROUP';groupId==123456
        
        **Please note that the above examples are only for the ``query`` part of the Filter.**

      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/ContentLength'
      requestBody:
        description: Filter the AuditEvents in the response.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filter'
        required: false
      responses:
        "200":
          description: Collection of audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditSearchResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/CannotReturnResponse'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/UnexpectedError'
        "502":
          $ref: '#/components/responses/BadGateway'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
        "504":
          $ref: '#/components/responses/GatewayTimeout'

