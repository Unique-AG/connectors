    SubscriptionResponse:
      type: object
      description: |
        Represents the subscription details which are delivered to client webhook, which includes unique 
        subscriptionId and respective OGS_UPDATES or CASE_RESOLUTION eventPayload along with delivery status.
        
        **Note:** Subscription Auth Credentials will be encrypted and masked in response.

      required:
        - subscriptionType
        - subscriptionAuth
        - subscriptionEventType
        - recipients
        - subscriptionId
        - creationDate
        - modifiedDate
      properties:
        subscriptionType:
          type: string
          description: Represents the mode of subscription. Currently supports only WEBHOOK.
          maxLength: 1000
        subscriptionAuth:
          $ref: '#/components/schemas/SubscriptionAuth'
        subscriptionEventType:
          type: string
          description: The event type that is subscribed by the subscription. i.e, OGS-UPDATES or CASE_RESOLUTION.
          maxLength: 1000
        recipients:
          type: array
          description: Represents list of groupId's, which are the intended recipients for the subscription created.
          items:
            type: string
        subscriptionId:
          type: string
          description: The unique Id of the subscription.
          maxLength: 1000
        creationDate:
          type: string
          description: Date on which the subscription is created.
          format: date-time
        modifiedDate:
          type: string
          description: Date on which the subscription is modified.
          format: date-time
        subscriptionStatus:
          $ref: '#/components/schemas/SubscriptionStatus'

    SubscriptionAuth:
      type: object
      description: |
        Generic authentication model of the subscription. Authentication model currently supports HMAC and OAUTH.
        The SubscriptionAuth contains the url, authType, credentials for respective authentication models.
        
        For hmac authentication, Credentials contains following parameters: 
        - apiKey
        - apiSecret
        
        For oauth authentication, Credentials contains following parameters:
        - clientId
        - clientSecret
        - tokenUrl
      required:
        - url
        - authType
        - credentials
      properties:
        url:
          type: string
          description: |
            Represents the Webhook endpoint url, where notifications needs to be delivered.
            
            **Note:** IP based urls are not supported. It should be a FQDN (url Schema should be "https" only). Port is not allowed in url. Your Webhook service should have a certificate provided by a well known CA. URLs with Self signed and privately signed certificates will not be allowed.
          maxLength: 1000
        authType:
          $ref: '#/components/schemas/AuthType'
        credentials:
          $ref: '#/components/schemas/Credentials'

    Credentials:
      type: object
      description: Credentials for the subscriptionAuth details.
      properties:
        apiKey:
          type: string
          description: Represents unique api key for Subscription hmac authentication.
          maxLength: 255
          x-wc1-field-extra-annotations: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
        apiSecret:
          type: string
          description: Represents unique client secret for Subscription hmac authentication.
          maxLength: 1000
          x-wc1-field-extra-annotations: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
        clientId:
          type: string
          description: |
            Represents a unique public identifier for client token url. It’s used to identify the application making the request for oauth authentication.
          maxLength: 255
          x-wc1-field-extra-annotations: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
        clientSecret:
          type: string
          description: |
            Represents unique confidential string known only to the application and the authorization server for oauth authentication.
          maxLength: 1000
          x-wc1-field-extra-annotations: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
        tokenUrl:
          type: string
          description: |
            Token URL is used by the client application to exchange an authorization code or client credentials for an access token in oauth authentication.
            
            **Note:** IP based urls are not supported. It should be a FQDN (url Schema should be "https" only). Port is not allowed in url. Your Webhook service should have a certificate provided by a well known CA. URLs with Self signed and privately signed certificates will not be allowed.
          maxLength: 1000
          x-wc1-field-extra-annotations: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"

