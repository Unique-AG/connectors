          description: |
            Records information about the top most business in the family tree, tracing each parent up to its own parent.
            For example, Company A is a business based in the US and has company B as its parent also in the US.
            In turn company B is owned by company C, also in the US, which is owned by company D which is in the UK.
            Thus the Global Ultimate of this family tree (and therefore of each member of the family tree) is Company D.
          $ref: '#/components/schemas/CorporateLinkageGlobalUltimate'
        domesticUltimate:
          description: |
            Records information about the top most business in the family tree, tracing each parent up to its own parent.
            For example, Company A is a business based in the US and has company B as its parent also in the US.
            In turn company B is owned by company C, also in the US, which is owned by company D which is in the UK.
            Thus the Global Ultimate of this family tree (and therefore of each member of the family tree) is Company D.
          $ref: '#/components/schemas/CorporateLinkageDomesticUltimate'
