          properties:
            names:
              type: array
              description: The names associated with the Result.
              items:
                $ref: '#/components/schemas/RecordName'
            dates:
              type: array
              description: List of dates of births and deaths for the result.
              items:
                $ref: '#/components/schemas/RecordEvent'
            locations:
              type: array
              description: Locations (countries) for the Screening Result.
              items:
                $ref: '#/components/schemas/RecordLocation'
            identifications:
              type: array
              description: List of Identity documents from the Result.
              items:
                $ref: '#/components/schemas/RecordIdentityDocument'
            recordType:
              $ref: '#/components/schemas/RecordType'
            genders:
              type: array
              description: list of possible genders of the matching record
              items:
                $ref: '#/components/schemas/GenderObject'
            recordDates:
              type: array
              description: list of changed dates for the matching record
              items:
                $ref: '#/components/schemas/RecordDate'
            pepStatus:
              type: string
              description: The PEP Status of the Result.
              enum:
                - ACTIVE
                - INACTIVE
                - UNKNOWN
                - NOT_AVAILABLE
            pepInactivityPeriod:
              $ref: '#/components/schemas/PepInactivityPeriod'
            actionTypes:
              type: array
              description: |
                Action types for the result indicating why the action was taken (reasons for an action).
                The available actionTypes are:
                  - DATA_ISSUE : Represents resolve issues found with the data provided for batch processing.
                  - RESULT_NOT_FOUND : Represents result Not Found after re-screening.
                  - SCORE_INCREASED : Represents result Strength Increased after re-screening.
                  - SCORE_DECREASED : Represents result Strength Decreased after re-screening.
                  - PROFILE_UPDATED : Represents profile has been Updated.
                  - PROFILE_UPDATED_C1 : Represents profile has been updated with update category C1.
                  - PROFILE_UPDATED_C2 : Represents profile has been updated with update category C2.
                  - PROFILE_UPDATED_C3 : Represents profile has been updated with update category C3.
                  - PROFILE_UPDATED_C4 : Represents profile has been updated with update category C4.
                  - GENDER_UPDATED : Represents gender secondary field updated.
                  - DATE_OF_BIRTH_UPDATED : Represents date of birth secondary field updated.
                  - COUNTRY_LOCATION_UPDATED : Represents country location secondary field updated.
                  - PLACE_OF_BIRTH_UPDATED : Represents place of birth secondary field updated.
                  - NATIONALITY_UPDATED : Represents nationality secondary field updated.
                  - REGISTERED_COUNTRY_UPDATED : Represents registered country secondary field updated.
                  - IMO_NUMBER_UPDATED : Represents imo number secondary field updated.
                  - DOCUMENT_ID_UPDATED : Represents document Id secondary field updated.
                  - COMPOSITE_MATCH_SCORE_INCREASED : Represents that the Composite Matching Score has exceeded the configured AI Review threshold.
                  - COMPOSITE_MATCH_SCORE_DECREASED : Represents that the Composite Matching Score has fallen below the configured AI Review threshold.
              uniqueItems: true
              items:
                $ref: '#/components/schemas/MatchActionType'

