  schemas:

    #---------------------------------------------------------------------------#
    #                            Common definitions                             #
    #---------------------------------------------------------------------------#

    ClientWatchlistAbstractAssociate:
      type: object
      description: |
        Description of an associate of an targetEntity (family member, friends, business associate, etc).
        
        The 'ClientWatchlistAbstractAssociate' subclasses corresponding to each type of Entity are:
        
        * 'COUNTRY': 'ClientWatchlistCountryAssociate'
        * 'INDIVIDUAL': 'ClientWatchlistIndividualAssociate'
        * 'ORGANISATION': 'ClientWatchlistOrganisationAssociate'
        * 'VESSEL': 'ClientWatchlistVesselAssociate'

      discriminator:
        propertyName: entityType
      x-wc1-model-abstract-type: true
      x-wc1-model-discriminator-map:
        - key: ClientWatchlistIndividualAssociate
          value: INDIVIDUAL
        - key: ClientWatchlistOrganisationAssociate
          value: ORGANISATION
        - key: ClientWatchlistVesselAssociate
          value: VESSEL
        - key: ClientWatchlistCountryAssociate
          value: COUNTRY
      required:
        - entityType
        - associateEntityType
      properties:
        reversed:
          type: boolean
          description: Flag indicating whether the association type is reversed or inverted.
          default: false
        targetEntityId:
          type: string
          description: Target Entity identifier.
        targetExternalImportId:
          type: string
          description: Target external import identifier.
        type:
          $ref: '#/components/schemas/AssociateType'
        targetPrimaryName:
          type: string
          description: The target primary name of the Association.
          x-wc1-field-extra-annotations: "@com.thomsonreuters.grc.platform.util.content.annotation.PersonallyIdentifiable"
        creationDate:
          type: string
          description: Creation date of the Association.
          format: date-time
          x-wc1-field-extra-annotations: "@com.fasterxml.jackson.databind.annotation.JsonSerialize(using = com.thomsonreuters.grc.fsp.api.controller.client.core.jackson.serializer.VariablePrecisionDateTimeToISO8601NoMillisSerializer.class)"
        modificationDate:
          type: string
          description: Modification Date of the Association.
          format: date-time
          x-wc1-field-extra-annotations: "@com.fasterxml.jackson.databind.annotation.JsonSerialize(using = com.thomsonreuters.grc.fsp.api.controller.client.core.jackson.serializer.VariablePrecisionDateTimeToISO8601NoMillisSerializer.class)"
        updateCategory:
          description: Entity Update Category Enumeration.
          allOf:
            - $ref: '#/components/schemas/UpdateCategory'
        category:
          type: string
          description: The type of the Association.
        targetCategories:
          type: array
          description: List of names of [ProviderSourceTypeCategoryDetail](#tag/ProviderSourceTypeCategoryDetail_Model) in sources of target Entity.
          items:
            type: string
        entityType:
          description: The Entity type.
          allOf:
            - $ref: '#/components/schemas/EntityType'
        associateEntityType:
          type: string
          description: The Association Entity type.

    IdentityDocumentLocationTypeDataSet:
      type: object
      properties:
        identityDocumentLocationTypes:
          type: array
          items:
            $ref: '#/components/schemas/IdentityDocumentLocationType'

    AbstractCase:
      type: object
      description: |
        Defines Case data that can be sent when creating or updating a Case.
        
        Note that availability and definitions of 'customFields' and 'secondaryFields' should be obtained via
        `GET /groups/{groupId}/case-template` endpoint before creating or updating a Case.
        Following are some example JSON segments for secondary fields using unreal 'typeId's for illustrative purposes.
        
        - Example INDIVIDUAL secondary fields
        
              1. GENDER
                  {
                    "typeId":"SFCT_1",
                    "value":"MALE"
                  }
              2. DATE_OF_BIRTH
                  {
                    "typeId":"SFCT_2",
                    "dateTimeValue":"1990-12-20"
                  }
        
                 or
        
                  {
                    "typeId":"SFCT_2",
                    "dateTimeValue": {
                      "timelinePrecision": "ON",
                      "pointInTimePrecision": "DAY",
                      "utcDateTime": 316310400000,
                      "timeZone": null
                    }
                  }
        
              3. COUNTRY_OF_RESIDENCE
                  {
                    "typeId":"SFCT_3",
                    "value":"GBR"
                  }
        
              4. PLACE_OF_BIRTH
                  {
                    "typeId":"SFCT_4",
                    "value":"GBR"
                  }
        
              5. NATIONALITY
                  {
                    "typeId":"SFCT_5",
                    "value":"GBR"
                  }
        
        - Example ORGANISATION secondary fields
        
              1. REGISTERED_COUNTRY
                  {
                    "typeId":"SFCT_6",
                    "value":"GBR"
                  }
        
        - Example VESSEL secondary fields
        
              1. IMO_NUMBER
                  {
                    "typeId":"SFCT_7",
                    "value":"1234567"
                  }
      x-wc1-model-abstract-type: true
      properties:
        caseId:
          type: string
          description: |
            Case ID provided by the Client or else generated by the system for the Client.
            This field is not applicable for 'Zero Footprint Screening (ZFS)'.
          maxLength: 512
          x-wc1-field-extra-annotations: "@com.thomsonreuters.grc.platform.util.content.annotation.PersonallyIdentifiable"
        name:
          type: string
          description: Name to screen for this Case.
          maxLength: 1000
          x-wc1-field-extra-annotations: "@com.thomsonreuters.grc.platform.util.content.annotation.PersonallyIdentifiable"
        alternateNames:
          type: array
          maxItems: 2
          description: List of additional names to be screened
          items:
            type: string
            description: Name to screen for this Case.
            maxLength: 1000
            x-wc1-skip-bean-validation: true
          x-wc1-field-extra-annotations:
            - "@com.thomsonreuters.grc.platform.util.content.annotation.PersonallyIdentifiable"
            - "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_EMPTY)"
        providerTypes:
          type: array
          description: |
            Provider types required to Screen this Case.
            For 'Zero Footprint Screening (ZFS)', both 'WATCHLIST' and 'CLIENT_WATCHLIST' are supported.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProviderType'
        caseScreeningState:
          type: object
          description: |
            Mapping from 'ProviderType' to indicate whether Ongoing Screening is enabled for this Case on the specific 'ProviderType'.
            Supported 'ProviderType's: 'WATCHLIST', 'MEDIA_CHECK'. By default, value will be set from account settings.
            This field is not applicable for 'Zero Footprint Screening (ZFS)'.
          additionalProperties:
            $ref: '#/components/schemas/CaseScreeningState'
          x-wc1-map-key-value: ProviderType
        customFields:
          type: array
          description: |
            Case Custom Fields. Available Custom Fields and their definitions can be obtained via
            `GET /groups/{groupId}/case-template` endpoint. Custom Fields cannot be used with 'Zero Footprint Screening (ZFS)'.
          items:
            $ref: '#/components/schemas/Field'
          x-wc1-field-extra-annotations: "@com.thomsonreuters.grc.platform.util.content.annotation.PersonallyIdentifiable"
        secondaryFields:
          type: array
          description: |
            Case Secondary Fields. Available Secondary Fields and their definitions can be obtained via
            `GET /groups/{groupId}/case-template` endpoint.
          items:
            $ref: '#/components/schemas/Field'
          x-wc1-field-extra-annotations: "@com.thomsonreuters.grc.platform.util.content.annotation.PersonallyIdentifiable"
        nameTransposition:
          type: boolean
          description: Flag indicating whether name transposition is enabled for the Case.
      example:
        caseId: Client Case ID
        name: John Smith
        providerTypes:
          - WATCHLIST
          - MEDIA_CHECK
        caseScreeningState:
          WATCHLIST: INITIAL
          MEDIA_CHECK: ONGOING
        customFields:
          - typeId: Custom Field ID 1
            value: Reference ID 1234567
          - typeId: Custom Field ID 2
            value: Deal ID 1234567
        secondaryFields:
          - typeId: SFCT_1
            value: MALE
          - typeId: SFCT_2
            dateTimeValue: '1990-11-20'
        nameTransposition: true

    AbstractField:
      type: object
      description: Generic Field representing a Custom Field or a Secondary Field.
      x-wc1-model-abstract-type: true
      required:
        - typeId
      properties:
        typeId:
          type: string
          description: Type Identifier of this Field.
          maxLength: 255

    AbstractGroupSummary:
      type: object
      description: Structure of Groups accessible by User.
      x-wc1-model-abstract-type: true
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Group ID.
          maxLength: 255
        name:
          type: string
          description: Name for the Group.
          maxLength: 255
          x-wc1-field-extra-annotations: "@com.thomsonreuters.grc.platform.util.content.annotation.PersonallyIdentifiable"

    AbstractResolution:
      type: object
      description: Abstract resolution object.
      properties:
        statusId:
          type: string
          description: |
            Unique status ID defined in Group's resolution toolkit and used when resolving this Result. Get the available
            status IDs and their details via `GET /groups/{groupId}/resolution-toolkits`.
          maxLength: 255
        riskId:
          type: string
          description: |
            Unique risk ID defined in Group's resolution toolkit and used when resolving this Result. Get the available
            risk IDs and their details via `GET /groups/{groupId}/resolution-toolkits`.
          maxLength: 255
        reasonId:
          type: string
          description: |
            Unique reason ID defined in Group's resolution toolkit and used when resolving this Result. Get the available
            reason IDs and their details via `GET /groups/{groupId}/resolution-toolkits`.
          maxLength: 255
        resolutionRemark:
          type: string
          description: Resolution remark added when resolving this Result.
          maxLength: 1000

    AbstractCaseSearchModel:
      type: object
      description: |
        Request model used to search within, sort across, paginate through, and filter down the set of Cases.
        
        A model contains 'query', 'filter' expression, which is written in a superset of the Atom Feed Item Query Language (FIQL).
        
        The FIQL is documented in <https://tools.ietf.org/html/draft-nottingham-atompub-fiql-00>,
        and the superset supported by the WC1 API documented in <https://github.com/jirutka/rsql-parser>.
        
        RSQL/FIQL parser contains some reserved characters:
        
        `'"' | "'" | "(" | ")" | ";" | "," | "=" | "!" | "~" | "<" | ">"`
        
        If there are reserved characters or white spaces in the query expression, they must be escaped by enclosing 
        them in single or double quotes. If you need to use both single and double quotes inside an argument, then
        you must escape one of them using `\` (backslash). If you want to use `\` literally, then double it as `\\`.
        Backslash has a special meaning only inside a quoted argument, not in unquoted argument. Using reserved 
        characters or white spaces without escaping can lead to parsing and execution errors.
        
        The query examples:
        
        * "query": "example=='TE!ST'"
        * "query": "example==\\"TE'ST\\""
        * "query": "example=='TE\\\\'ST'"
        
        Argument can be a single value, or multiple values in parenthesis separated by comma. Value that does not
        contain any reserved character or a white space can be unquoted, other arguments must be enclosed in single 
        or double quotes.
        
        Example:
        
        * "query": "example1=='TE\\\\'ST', example2==TEST"
      properties:
        query:
          type: string
          description: |
            A string containing the search query.
            
            This is associated with the 'searchMode' field. 
            The entered search mode applies to all the fields in the query, but with the following rules being applied:
            
             - primaryName - supports all search modes
             - names - supports all search modes (The fields primaryName and names are mutually exclusive; only one can be included in a query.)
             - caseId - supports all search modes
             - idNumbersValue - uses EXACT matches for DEFAULT, CONTAINS and EXACT search modes, otherwise allows BEGINS_WITH search mode
             - customFieldsValue - uses BEGINS_WITH searches for DEFAULT and BEGINS_WITH search modes, also supports CONTAINS and EXACT search modes
            
            **Note:** To find the available search fields, check for fields with 'QUERY' type in the `GET /references/search-filters` endpoint.
        searchMode:
          $ref: '#/components/schemas/TextSearchMode'
        filter:
          type: string
          description: |
            A string containing filter criteria.
            
            **Note:** To find the available search fields, check for fields with 'FILTER' type in the `GET /references/search-filters` endpoint.
            
            Case Search With Time Stamp Is Also possible for Date filters but only supported for RANGE operator and the supported formats are given below.
            
            - creationDate=RANGE=("2025-02-01T22:21:21.222Z","2025-03-01T22:21:21.222Z")
            - creationDate=RANGE=("2025-02-01","2025-03-01")
            
            Above example can be used for any Date filters like modificationDate,lastScreenedDate,creationDate etc.

        detailLevel:
          $ref: '#/components/schemas/CaseDetailLevel'
        sort:
          type: array
          description: |
            An array of sorting criteria.
            
            The list of available sort parameter names:
            - 'primaryName' - sort by the primary name for the Case;
            - 'caseId' - sort by the unique identifier for the Case;
            - 'caseSystemId' - sort by the system-generated ID for the Case;
            - 'creationDate' - sort by the time when the Case has been created;
            - 'modificationDateByUser' - sort by the time when the Case has been modified by the User;
            - 'modificationDateBySystem' - sort by the time when the Case has been modified by the system;
            - 'lastScreenedDate' - sort by the time when the Case was last screened;
            - 'primaryCase' - sort by the total child Cases count contained within the Case;  
            - 'nameTransposition' - sort by the name transposition state for the Case;
            - 'lifecycleState' - sort by the lifecycle state for the Case;
            - 'watchlistCaseScreeningState' - sort by the World-Check ongoing screening state for the Case;
            - 'mediaCheckCaseScreeningState' - sort by the Media-Check ongoing screening state for the Case;
            - 'entityType' - sort by the entity type for the Case;
            - 'caseRating' - sort by the rating for the Case;
            - 'mandatoryActions' - sort by the number of mandatory actions on this Case;
            - 'watchlistUnresolved' - sort by the count of unresolved matches with the provider type 'WATCHLIST';
            - 'watchlistReviewRequired' - sort by the count of matches with the provider type 'WATCHLIST' that require review;
            - 'clientWatchlistUnresolved' - sort by the count of unresolved matches with the provider type 'CLIENT_WATCHLIST';
            - 'clientWatchlistReviewRequired' - sort by the count of matches with the provider type 'CLIENT_WATCHLIST' that require review;
            - 'mediaCheckReviewRequired' - sort by the count of matches with the provider type 'MEDIA_CHECK' that require review;
            - 'secondaryFieldCountryLocation' - sort by the country location or registered country secondary field value;
            - 'secondaryFieldNationality'  - sort by the citizenship secondary field value;
            - 'secondaryFieldPlaceOfBirth' - sort by the place of birth secondary field value;
            - 'groupId' - sort by the name of the Group owning the Case;
            - 'creatorUserId' - sort by the full name of the User who created the Case;
            - 'modifierUserId' - sort by the full name of the User who modified the Case;
            - 'assigneeUserId' - sort by the full name of the User the Case is currently assigned to.
          items:
            $ref: '#/components/schemas/SortCriterion'

    CaseSearchRequest:
      type: object
      description: Request model used to search within, sort across, paginate through, and filter down the set of Cases.
      allOf:
        - $ref: '#/components/schemas/AbstractCaseSearchModel'
        - type: object
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationReferenceRequest'
      example:
        query: primaryName==Trump and caseId=in=(Donald, Melania)
        searchMode: DEFAULT
        filter: providerType==WATCHLIST and entityType=in=(UNSPECIFIED, INDIVIDUAL) and creationDate=RANGE=(2023-01-01, 2023-05-31)
        detailLevel: CASE_AND_RESULTS_AND_AGGREGATED_RESULTS
        sort:
          - columnName: primaryName
            order: DESCENDING
          - columnName: providerType
            order: ASCENDING
        pagination:
          itemsPerPage: 25
          pageReference: Reference ID of the requested page.

    CaseDetailLevel:
      type: string
      description: |
        Enumeration that defines the detail level of the search response:
          - 'CASE': The search response will provide full Case details.
          - 'CASE_AND_RESULTS': The search response will include Сase details and Result summary related to this Case.
          - 'CASE_AND_AGGREGATED_RESULTS': The search response will provide full Case details with an aggregated Result summary, summarizing data from primary and sub-cases.
          - 'CASE_AND_RESULTS_AND_AGGREGATED_RESULTS': The search response will provide full Case details with a Result and aggregated(summarizing data from primary and sub-cases) summaries.
      enum:
        - CASE
        - CASE_AND_RESULTS
        - CASE_AND_AGGREGATED_RESULTS
        - CASE_AND_RESULTS_AND_AGGREGATED_RESULTS

