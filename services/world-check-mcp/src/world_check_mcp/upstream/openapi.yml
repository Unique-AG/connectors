                      "MEDIA_CHECK": {
                          "status": "SCREENED",
                          "isReviewRequired":
                      }
                  }
              }
          ]
        ```
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/ContentLength'
        - $ref: '#/components/parameters/Date'
      requestBody:
        description: Allows to specify cases and their screening dates that are using to define the screening status.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningStatusRequestCollection'
      responses:
        "200":
          description: Response with screening status and aggregated results for each Case in the payload.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScreeningStatusResponse'
        "400":
