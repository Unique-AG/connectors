    SubscriptionRequest:
      type: object
      description: |
        A request body to create subscription.
      required:
        - subscriptionType
        - subscriptionAuth
        - subscriptionEventType
        - recipients
      properties:
        subscriptionType:
          $ref: '#/components/schemas/SubscriptionType'
        subscriptionAuth:
          $ref: '#/components/schemas/SubscriptionAuth'
        subscriptionEventType:
          $ref: '#/components/schemas/SubscriptionEventType'
        recipients:
          type: array
          description: Represents list of groupId's, which are to be intended recipients for the subscription to be created.
          items:
            type: string

    FilteredSubscriptionRequest:
      type: object
      description: |
        A request body to retrieves a list of subscriptions.
      required:
        - filter
        - sort
      properties:
        filter:
          type: string
          description: |
            The filter string specifies the criteria for listing subscriptions.
            
            The filter supports below fields to specify criteria:
            - **subscriptionEventType**: Represents the subscription event type. (Optional).
                                         Supports == and IN operator. 
            
            - **recipientId**: Represents the recipient IDs. Supports == and IN operator. (Optional).
            
            - **SubscriptionStatus**: Represents the subscription status. (Optional). Supports == and IN operator
            The following eventTypes are allowed:
                - ACTIVE - The subscription has passed the verification and is active.
                - VERIFICATION_PENDING - The subscription request has been successful however the webhook verification could not be completed (due to 504 https Gateway Timeout response).
                - VERIFICATION_FAILED - The subscription request has been successful however the webhook verification has failed  (due to any non 504 https response).
                - INACTIVE - The subscription has been made inactive by the user. For inactive subscription, notification will not be sent.
            
            - **creationDate**: Filter by subscription creation date. (Optional). Supports == and =RANGE= operator
            
            - **modifiedDate**: Filter by subscription last modified date. (Optional). Supports == and =RANGE= operator
        sort:
          type: array
          description: |
            An array of sorting criteria.
            
            The list of available sort parameter names:
            
            - subscriptionEventType
            - recipientId
            - SubscriptionStatus
            - creationDate
            - ModifiedDate
          items:
            $ref: '#/components/schemas/SortCriterion'
      example:
        filter: "subscriptionEventType=in={{subscription-event-type}};subscriptionStatus=in={{subscription-status}};recipientId=in={{recipient-id}};creationDate==2025-01-01;modifiedDate==2025-01-01"
        sort:
          - columnName: "subscriptionEventType"
            order: "ASCENDING"

    SubscriptionUpdateRequest:
      type: object
      description: |
        A request body to update subscription.
      properties:
        subscriptionType:
          $ref: '#/components/schemas/SubscriptionType'
        subscriptionAuth:
          $ref: '#/components/schemas/SubscriptionAuth'
        subscriptionEventType:
          $ref: '#/components/schemas/SubscriptionEventType'
        recipients:
          type: array
          description: |
            The list of unique recipient Ids to update subscription. Client can obtain list of groupId's for the identified Users via `GET /groups` endpoint.
            
            **Note:** If the combination of recipientId and subscriptionEventType already exists, then System will not allow to update the subscription.
          items:
            type: string
        subscriptionStatus:
          $ref: '#/components/schemas/UpdateSubscriptionStatus'

    ScreeningRequest:
      type: object
      description: Defines Case data that can be sent when creating a synchronous screening request for a new Case.
      allOf:
        - $ref: '#/components/schemas/NewCase'
        - type: object
          properties:
            caseRating:
              description: The risk rating assigned to the case.
              allOf:
                - $ref: '#/components/schemas/CaseRatingRequest'
            startScreeningDate:
              type: string
              format: date-time
              description: |
                The case will be screened against records that are created or updated "from" the given date. 
                This date must be less than the current date.
            endScreeningDate:
              type: string
              format: date-time
              description: |
                This is applicable only for zfs groups.The case will be screened against records that are created or updated "until" the given date. 
                This date must be greater than 'startScreeningDate' and less than the current date.
                This date can be given only if 'startScreeningDate' is given.
          example:
            name: John Smith
            caseId: Client Case Id
            groupId: Client Group Id
            entityType: INDIVIDUAL
            providerTypes:
              - WATCHLIST
              - MEDIA_CHECK
            caseScreeningState:
              WATCHLIST: INITIAL
              MEDIA_CHECK: ONGOING
            caseRating:
              caseRating: MEDIUM
              reason: test medium risk rating
            customFields:
              - typeId: Custom Field Id 1
                value: Reference ID 1234567
              - typeId: Custom Field Id 2
                value: Deal Id 1234567
            secondaryFields:
              - typeId: SFCT_1
                value: MALE
              - typeId: SFCT_2
                dateTimeValue: '1990-11-20'

    ScreeningByNameBatchRequest:
      type: object
      description: |
        Metadata describing how the Cases contained in an uploaded batch file (see 'POST /batch/cases')
        should be created and screened.
      required:
        - groupId
        - batchFileType
        - batchId
        - providerTypes
        - caseScreeningState
      properties:
        groupId:
          maxLength: 255
          type: string
          description: Group identifier that the Cases created from the batch file will belong to.
        batchFileType:
          type: string
          enum:
            - CASES
          description: Fixed batch file type for Case screening uploads.
        batchId:
          type: string
          description: |
            Identifier of an existing Batch to associate this file with.
            A new Batch is created if not provided.
        providerTypes:
          minItems: 1
          uniqueItems: true
          type: array
          description: Array of provider types used in screening the Cases created from the batch file.
          items:
            $ref: '#/components/schemas/ProviderType'
        caseScreeningState:
          allOf:
            - $ref: '#/components/schemas/CaseScreeningState'
          description: |
            Ongoing Screening state to apply to the Cases created from the batch file.
            By default, value will be set from account settings.
        nameTransposition:
          type: boolean
          description: |
            Flag indicating whether name transposition should be enabled for the Cases created from the batch file.
            The value from the Account settings will be used if not provided.
        mediaCheckOngoingScreeningAtInitial:
          type: boolean
          description: |
            Flag indicating whether Media-Check Ongoing Screening should be enabled at initial screening
            for the Cases created from the batch file.
        vesselCheckOngoingMonitoringAtInitial:
          type: boolean
          description: |
            Flag indicating whether Vessel-Check Ongoing Monitoring should be enabled at initial screening
            for the Cases created from the batch file.
        notes:
          type: string
          description: Optional free-text notes associated with the batch file upload.
      example:
        groupId: Client Group Id
        batchFileType: CASES
        providerTypes:
          - WATCHLIST
        caseScreeningState: INITIAL
        nameTransposition: true
        mediaCheckOngoingScreeningAtInitial: false
        vesselCheckOngoingMonitoringAtInitial: false
        notes: Quarterly onboarding batch

