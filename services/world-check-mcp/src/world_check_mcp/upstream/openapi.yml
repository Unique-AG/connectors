          lastScreenedDate: '2016-07-27T15:30:10Z'
          providerSummaries:
            WATCHLIST:
              status: SCREENED
              totalMatches: 120
              reviewRequired: 20
              unresolved: 17
            PASSPORT_CHECK:
              isReviewRequired: false
        - caseSystemId: Case System ID 2
          requestFromScreenedDate: '2016-07-27T15:35:10Z'
          lastScreenedDate: '2016-07-27T15:30:10Z'
          providerSummaries:
            WATCHLIST:
              status: NOT_SCREENED
              totalMatches: 0
              reviewRequired: 0
              unresolved: 0

    SearchParameterCollection:
      type: object
      description: This object containing various search filter parameters that are available to the User.
      properties:
        freeTextParameters:
          type: array
          description: A set of free text query parameters.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/QuerySearchParameter'
        customFieldParameters:
          type: array
          description: |
            A set of custom field query parameters.

            **Note:** Custom field names may not be the same because 'Search Cases' feature requires a unique key.

            Subsequent changes will be applied to the name:
              - Space (` `) will be replaced with an underscore (`%20`).
              - Reserved RSQL/FIQL parser characters `'"' | "'" | "(" | ")" | ";" | "," | "=" | "!" | "~" | "<" | ">" | "|"` will be encoded into a '%' followed by two hexadecimal digits that represent the ASCII code of the character.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/QuerySearchParameter'
        predefinedParameters:
          type: array
          description: A set of filter parameters with predefined values.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/FilterSearchParameter'
      example:
        freeTextParameters:
          - fields:
              - caseName
              - caseId
            type: QUERY
            valueType: STRING
        customFieldParameters:
          - fieldIds:
              - customFieldId1
              - customFieldId2
            type: QUERY
            valueType: STRING
            label: Custom Field Label
        predefinedParameters:
          - fields:
              - caseSystemId
            type: FILTER
            valueType: STRING
          - fields:
              - creationDate
              - modificationDate
            type: FILTER
            valueType: DATE_TIME
          - fields:
              - primaryCase
              - nameTransposition
            type: FILTER
            valueType: STRING
            availableValues:
              - false
              - true
          - fields:
              - secondaryFieldCountryLocation
            type: FILTER
            valueType: STRING
            availableCodes:
              - code: ABW
                label: Aruba
          - fields:
              - groupId
            type: FILTER
            valueType: STRING
            availableIds:
              - id: groupId
                label: Group Name

