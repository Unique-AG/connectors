      description: |
        Specifies the type of report to be generated. Available report types:
        
        - CASE_DOSSIER: A comprehensive report containing complete case details including screening results, 
                   resolutions and audit history. It is available for download in PDF format.
        - CASE_SUMMARY: A concise report containing essential case information and key findings. It is available for download in CSV format.
        - CASE_DETAILS: A detailed report focused on case specifics including both case and match data. It is available for download in CSV format.
        - UBO_REPORT: A detailed report containing UBO Structure information. And if filters are applied, then only filtered data will be exported. It is available for download in pdf format.
      enum:
        - CASE_DOSSIER
        - CASE_SUMMARY
        - CASE_DETAILS
        - UBO_REPORT
      x-enum-varnames:
        - CASE_DOSSIER
        - CASE_SUMMARY
        - CASE_DETAILS
        - UBO_REPORT

    SubscriptionEventType:
      type: string
      description: |
        The event type that subscribed by the subscription. i.e, OGS_UPDATES or CASE_RESOLUTION etc.
          - OGS_UPDATES: Refers to updates related to Ongoing Screening processes. These updates notify subscribers about changes or results in ongoing monitoring.
          - CASE_RESOLUTION: Refers to notifications about the resolution of cases. This notification is triggered when all the matches within a case from World-check and Client Watchlist have been resolved.
          - CASE_ASSIGN: Refers to notifications triggered when a case is assigned to or unassigned from a user.
          - CASE_LINK: Refers to notifications triggered when a case is linked with another case or unlinked from an existing linked case.
          - CASE_ARCHIVE: Refers to notifications triggered when a case is archived or restored from an archived state.
          - CASE_OGS_STATUS_UPDATE: Refers to notifications triggered when Ongoing Screening (OGS) is enabled or disabled for a case.
          - CASE_REVIEW: Refers to notifications triggered when one or more case matches are reviewed.
          - CASE_RISK_RATING_UPDATE: Refers to notifications triggered when the rating of a case is added or modified.
          - CASE_GROUP_CHANGE: Refers to notifications triggered when a case is moved from one group to another.
          - CASE_INITIAL_ASYNC_SCREEN: Refers to notifications triggered when an asynchronous initial screening operation completes and screening results become available.
          - CASE_FULL_ASYNC_RESCREEN: Refers to notifications triggered when an asynchronous rescreening operation completes and updated screening results become available.
          - CASE_DETAILS_UPDATE: Refers to notifications triggered when case attributes are added, updated, or removed.
          - CASE_RESOLUTION_CHANGE: Refers to notifications triggered when the resolution status of one or more matches within a case changes.
      enum:
        - OGS_UPDATES
        - CASE_RESOLUTION
        - CASE_ASSIGN
        - CASE_LINK
        - CASE_ARCHIVE
        - CASE_OGS_STATUS_UPDATE
        - CASE_REVIEW
        - CASE_RISK_RATING_UPDATE
        - CASE_GROUP_CHANGE
        - CASE_INITIAL_ASYNC_SCREEN
        - CASE_FULL_ASYNC_RESCREEN
        - CASE_DETAILS_UPDATE
        - CASE_RESOLUTION_CHANGE

