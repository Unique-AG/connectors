          $ref: '#/components/schemas/UserSummaryDetails'
        modifier:
          $ref: '#/components/schemas/UserSummaryDetails'
        assignee:
          $ref: '#/components/schemas/UserSummaryDetails'
        creationDate:
          type: string
          description: The date and time when the Case was created.
          format: date-time
        modificationDate:
          type: string
          description: The date and time when the Case was last modified.
          format: date-time
        nameTransposition:
          type: boolean
          description: A flag indicating whether name transposition is enabled for the Case.
        outstandingActions:
          type: boolean
          description: A flag indicating outstanding actions on a Case.
        lastScreenedDatesByProviderType:
          type: object
          description: Case screenings date and time by Provider type.
          additionalProperties:
            type: string
            format: date-time
            description: Date and time by Provider Type.
            maxLength: 255
        lastIndexDatesByProviderType:
          type: object
          x-wc1-field-extra-annotations: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_EMPTY)"
          description: |
            Case index date and time by Provider Type. Represents date and time that should be used during
            'Zero Footprint Screening (ZFS)' as starting point to not lose any results. Available only for 
            'Zero Footprint Screening (ZFS)'.
          additionalProperties:
            type: string
            format: date-time
            description: Date and time by Provider Type.
            maxLength: 255
        providerTypeDetails:
          $ref: '#/components/schemas/ProviderTypeDetails'
        caseRating:
          $ref: '#/components/schemas/CaseRatingType'
        parentCaseSystemId:
          type: string
          description: |
            Parent Case System Id provided by the Client. It is identifier id of parent case which will be linked with newly created case.
          maxLength: 192
          x-wc1-field-extra-annotations: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
        results:
          description: Contains the Screening Result objects of the screening.
          type: array
          items:
            $ref: '#/components/schemas/AbstractScreeningResult'
        caseResultsSummary:
