servers:
  - url: https://api.risk.lseg.com/screening/v3
    description: Production API server

paths:
  /apiInfo:
    get:
      operationId: getApiInfo
      tags:
        - api-info
      summary: Get information about the Public API.
      description: Get information about the version of the Public API, a link to the documentation, and a date and time that can be used to verify the 'Date' header.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
      responses:
        "200":
          description: The information about the Public API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/CannotReturnResponse'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/UnexpectedError'

  /groups:
    get:
      operationId: getGroups
      tags:
        - groups
        - zfs
      summary: Get all the top-level groups and their descendants.
      description: |
        * If no query parameters are given, then by default the response will include only top-level group and its immediate descendants.

      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - name: showAllChildGroups
          description: If set to true, shows all the hierarchy including all the descendant groups along with the top-level group.
          in: query
          schema:
            type: boolean
          required: false
        - name: showOnlyZfs
          description: If set to true, shows only "ZFS" groups.
          in: query
          schema:
            type: boolean
          required: false
      responses:
        '200':
          description: A list of all top-level Groups containing their immediate descendants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CannotReturnResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /groups/{groupId}:
    get:
      operationId: getGroupById
      tags:
        - groups
        - zfs
      summary: Get a specified group and its descendants.
      description: Get a specified Group including its immediate descendants.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: A specified Group including its immediate descendants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CannotReturnResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /groups/{groupId}/case-template:
    get:
      operationId: getCaseTemplateForGroup
      tags:
        - groups
        - zfs
      summary: Get the case template for a given 'groupId'.
      description: |
        Get the CaseTemplate for the given Group, used for constructing a Case.

        **Available secondary fields:**
        <details>
          <summary>Click here to expand</summary>

          | Type ID   | NAME                    | VALUE                     |
          |-----------|-------------------------|---------------------------|
          | SFCT_1    | GENDER                  | MALE, FEMALE, UNSPECIFIED |
          | SFCT_2    | DATE OF BIRTH           | DATE                      |
          | SFCT_3    | COUNTRY LOCATION        | COUNTRY CODE              |
          | SFCT_4    | PLACE OF BIRTH          | COUNTRY CODE              |
          | SFCT_5    | NATIONALITY             | COUNTRY CODE              |
          | SFCT_6    | REGISTERED COUNTRY      | COUNTRY CODE              |
          | SFCT_7    | IMO NUMBER              | TEXT                      |
          | SFCT_8    | PASSPORT GIVEN NAMES    | TEXT                      |
          | SFCT_9    | PASSPORT LAST NAME      | TEXT                      |
          | SFCT_10   | PASSPORT GENDER         | MALE, FEMALE, UNSPECIFIED |
          | SFCT_11   | PASSPORT ISSUING STATE  | STATE CODE                |
          | SFCT_12   | PASSPORT NATIONALITY    | STATE CODE                |
          | SFCT_13   | PASSPORT DATE OF BIRTH  | DATE                      |
          | SFCT_14   | PASSPORT DOCUMENT TYPE  | PASSPORT, ID1, ID2        |
          | SFCT_15   | PASSPORT ID NUMBER      | TEXT                      |
          | SFCT_16   | PASSPORT DATE OF EXPIRY | DATE                      |
          | SFCT_191  | DOCUMENT ID             | TEXT                      |
          | SFCT_192  | DOCUMENT ID COUNTRY     | COUNTRY CODE              |
          | SFCT_193  | DOCUMENT ID TYPE        | TEXT                      |

        </details>
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: A specified Group including its immediate descendants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseTemplateResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/CannotReturnResponse'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/UnexpectedError'

  /groups/{groupId}/resolution-toolkits:
    get:
      operationId: getResolutionToolkitsForGroup
      tags:
        - groups
      summary: Get all the resolution toolkits for a given 'groupId'.
      description: |
        Get the 'ResolutionToolkits' for the given Group for all enabled provider types, used to construct a valid
        resolution request(s) on the results for a Case belonging to the given Group.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Map of 'ResolutionToolkits' for the given Group keyed by provider type.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ResolutionToolkitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CannotReturnResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /references/cases/{*caseId}:
    head:
      operationId: checkCaseIdentifierAvailability
      tags:
        - cases
      summary: Check if a given 'caseId' is available for use.
      description: |
        The 'caseIds' must be unique within each Client. If any Group under a Client has a Case with a particular 'caseId',
        that 'caseId' cannot be reused on another Case within the same Client. This endpoint allows the User to check
        if a given 'caseId' is available to use when creating or updating a Case.

        **Note:** Ensure that endpoint URL is encoded if there are any special characters in caseId."*" is a wildcard character that is automatically added to the given case id as this allows using special characters such as slash (/) within the case id - which is otherwise not allowed in the path parameters.
        'caseId' must not start or end with a slash or contain two consecutive slashes (//) as this may result in errors.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/CaseId'
      responses:
        "200":
          description: |
            The given 'caseId' is in use within the current user's Client, therefore is not available to use on a
            different Case.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: |
            The given 'caseId' is not found within the current user's Client, therefore is available to use as a 'caseId'
            on any Case.
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/UnexpectedError'

    get:
      operationId: getCaseReference
      tags:
        - cases
      summary: Returns the CaseReference containing the 'caseId' and 'caseSystemId' pair for an existing Case with the given 'caseId'.
      description: |
        Returns the CaseReference containing the 'caseId' and 'caseSystemId' pair for an existing Case with the given 'caseId'.
        This is useful if only the 'caseId' is known but 'caseSystemId' is required by other endpoints such as
        `GET /cases/{caseSystemId}` endpoint.
        
        **Note:** "*" is a wildcard character that is automatically added to the given case id as this allows using special characters such as slash (/) within the case id - which is otherwise not allowed in the path parameters.
        'caseId' must not start or end with a slash or contain two consecutive slashes (//) as this may result in errors.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: CaseReference for the given 'caseId'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseReference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CannotReturnResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /references/records/{id}:
    get:
      operationId: getRecord
      tags:
        - references
        - zfs
      summary: Get a record by its ID
      description: |
        Get a record by its ID.
        This service returns a specific subclass of 'Entity', depending on its particular 'RecordEntityType' discriminator field. Please note in the context of World-Check One, 'Record' and 'Entity' are synonymous concepts.

        The 'Entity' subclasses corresponding to each type of entity are:

            'COUNTRY' : 'CountryEntity'
            'INDIVIDUAL' : 'IndividualEntity'
            'ORGANISATION' : 'OrganisationEntity'
            'VESSEL' : 'VesselEntity'
        The response will contain translated details of the 'details' section when Accept-Language header is specified.

        The example response body:

      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/id'
      responses:
        "200":
          description: The details of the Entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/CannotReturnResponse'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/UnexpectedError'

  /references/providers/client-watchlist:
    post:
      operationId: saveWatchlist
      tags:
        - client-watchlist
        - zfs
      summary: Maintain client-watchlist data.
      description: |
        Maintain your Watchlist data using the following supported entity actions.

        * entityCreateOrUpdate - Add a new entity to your Watchlist or replace if it already exists.

        * entityDelete - Mark the given entity as deleted in your Watchlist.

        * entitySupersede - Supersede enables you to redirect matches against your superseded entity to a new entity. This
        is useful if you want to redirect users with existing matches against an old entity to a newer / more accurate
        version of those entities.

        * entityPurge - Purge enables you to remove an entity as required by GDPR whereby the personally identifiable
        information is removed.

        Due to the large number of entries within a Watchlist it is not possible to update the entire Watchlist in a single request
        The overall request must be split into blocks of up to 500 individual entity actions.


        The response consists of a list of any entities which were not successfully processed and a reason for failure.

        **Note:** The client watchlist record may not be considered for re-screening if the 'modificationDate' field 
                  has not been specified while modifying the record.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/ContentLength'
        - $ref: '#/components/parameters/Date'
      requestBody:
        description: A collection of maintenance actions to be performed on your Watchlist.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistDataSet'
      responses:
        "201":
          description: Request to maintain Watchlist data has succeeded. Please review the contents of
            WatchlistResponse errors for details on any individual entity actions which were not successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/CannotReturnResponse'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/UnexpectedError'

  /cases:
    post:
      operationId: saveAndScreenCase
      tags:
        - cases
        - zfs
      summary: Save and Screen a Case
      description: |
        This endpoint creates and screens new cases. Cases can be screened by using two modes in query parameter ?screen=SYNC/ASYNC:

        * ASYNC: Case is created and automatically added to an asynchronous screening queue. The response includes only Case details. To check screening progress, use `POST /cases/screening-status` endpoint. To check match results, use POST `/cases/{caseSystemId}/results`.
        * SYNC:  Case is created and screened synchronously. The response includes case details as well as match results.

        **Note:**
        - Only SYNC option should be used for ZFS screening.
        - In names and secondary fields where free text is allowed, any symbol is allowed except control characters like '\n' (new line) and '\t' (tab). Additionally, using operator words even when combined with an apostrophe, for example the below combinations, may cause an error 403 to be returned.
            - String ‘AND (String)
            - String ‘OR (String)
            - String ‘AND NOT (String)
            - String ‘OR NOT (String)
            - String ‘AND AS (String)
            - String ‘OR AS (String)
        - 'caseId' must not start or end with a slash or contain two consecutive slashes (//) as this may result in errors.

      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/ContentLength'
        - $ref: '#/components/parameters/Date'
        - name: screen
          description: Screen mode.
          in: query
          schema:
            $ref: '#/components/schemas/CaseCreateScreenMode'
          required: false
      requestBody:
        description: Create case payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningRequest'
      responses:
        "200":
          description: Case Created.
          x-wc1-doc-exclude-properties:
            - caseResultsSummary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningResultCollection'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/CannotReturnResponse'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/UnexpectedError'

  /cases/screening-status:
    post:
      operationId: getScreeningStatus
      tags:
        - cases
      summary: Retrieve case screening status.
      description: |
        Case screening statuses can be returned using this endpoint. The status for multiple cases (up to 1000) can be requested in a single request.
        Results returned show a status and aggregated screening results for each Case.
        
        **Example HTTP response**

        ```
          Response example returned for request not containing 'providerTypes' field.
          [
              {
                  "caseSystemId": "Case System ID 1",
                  "screeningStatus": "SCREENED",
                  "requestFromScreenedDate": "2020-10-24T11:40:21.517Z",
                  "lastScreenedDate": "2019-12-16T14:44:15.582Z",
                  "providerSummaries": {
                      "WATCHLIST": {
                          "totalMatches": 38,
                          "reviewRequired": 0,
                          "unresolved": 35
                      }
                  }
              },
              {
                  "caseSystemId": "Case System ID 2",
                  "screeningStatus": "NOT_SCREENED",
                  "requestFromScreenedDate": "2020-10-24T11:40:21.517Z",
                  "providerSummaries": {
                      "WATCHLIST": {
                          "totalMatches": 0,
                          "reviewRequired": 0,
                          "unresolved": 0
                      },
                      "PASSPORT_CHECK": {
                          "isReviewRequired": false
                      }
                  }
              },
              {
                  "caseSystemId": "Case System ID 3",
                  "screeningStatus": "SCREENED",
                  "requestFromScreenedDate": "2019-10-24T11:40:21.517Z",
                  "lastScreenedDate": "2019-12-20T08:25:32.146Z",
                  "providerSummaries": {
                      "WATCHLIST": {
                          "totalMatches": 625,
                          "reviewRequired": 0,
                          "unresolved": 618
                      }
                  }
              }
          ]

          Response example returned for request containing 'providerTypes' field.
          [
              {
                  "caseSystemId": "Case System ID 1",
                  "requestFromScreenedDate": "2020-10-24T11:40:21.517Z",
                  "lastScreenedDate": "2019-12-16T14:44:15.582Z",
                  "providerSummaries": {
                      "WATCHLIST": {
                          "status": "SCREENED",
                          "totalMatches": 38,
                          "reviewRequired": 0,
                          "unresolved": 35
                      }
                  }
              },
              {
                  "caseSystemId": "Case System ID 2",
                  "requestFromScreenedDate": "2020-10-24T11:40:21.517Z",
                  "providerSummaries": {
                      "WATCHLIST": {
                          "status": "SCREENED",
                          "totalMatches": 0,
                          "reviewRequired": 0,
                          "unresolved": 0
                      },
                      "PASSPORT_CHECK": {
                          "isReviewRequired": false
                      }
                  }
              },
              {
                  "caseSystemId": "Case System ID 3",
                  "requestFromScreenedDate": "2019-10-24T11:40:21.517Z",
                  "lastScreenedDate": "2019-12-20T08:25:32.146Z",
                  "providerSummaries": {
                      "WATCHLIST": {
                          "status": "SCREENED",
                          "totalMatches": 625,
                          "reviewRequired": 0,
                          "unresolved": 618
