        - url: https://api.risk.lseg.com
      x-wc1-skip-endpoint-generation: true
      operationId: revokeOAuthToken
      tags:
        - oauth
      summary: Revoke an OAuth Access Token
      description: |
        Revokes an existing OAuth 2.0 access token.
        The client must authenticate using the HTTP Basic authentication scheme with its service-account-uuid and service-account-password.
        The token to be revoked must be provided in the request body as a form parameter.
      parameters:
