            subscriptionId: "671b4135d9fbf263ded6d740"
            creationDate: "2025-01-01T06:56:53.000Z"
            modifiedDate: "2025-01-01T06:56:53.000Z"
            subscriptionStatus:
              status: "ACTIVE"
          - subscriptionType: "WEBHOOK"
            subscriptionAuth:
