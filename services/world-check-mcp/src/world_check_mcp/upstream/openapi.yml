    NotificationResponse:
      type: object
      description: |
        Represents the list of notifications that match the filter criteria passed in request payload.
        The notification response object provides all the details which are delivered to the webhook along 
        with the delivery status.
      properties:
        notificationId:
          type: string
          description: Unique identifier for the notification which is delivered to the client.
        createdDateTime:
          type: string
          format: date-time
          description: The creation date of the notification.
        updatedDateTime:
          type: string
          format: date-time
          description: The last update date of the notification.
        event:
          $ref: '#/components/schemas/NotificationEvent'
        deliveryStatus:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryStatus'

    NotificationEvent:
      type: object
      description: |
        Represents the details of the event either OGS_UPDATES or CASE_RESOLUTION that triggered the notification.
      properties:
        eventId:
          type: string
          description: The unique identifier for the notification event.
        eventTimeStamp:
          type: string
          format: date-time
          description: The timestamp of the notification event.
        eventTypeId:
          type: string
          description: Represents the event type of the notification either **OGS_UPDATES** or **CASE_RESOLUTION**.
        eventObjectType:
          type: string
          description: Represents the type of the event object. i.e. **CASE**.
        eventObjectId:
          type: string
          description: |
            Represents the caseSystemId (System generated ID for the Case) for the Case for which OGS_UPDATES
            or CASE_RESOLUTION event is triggered.
        eventUserId:
          type: string
          description: Unique identifier for the user associated with the notification event.
        eventSourceId:
          type: string
          description: Represents the Source ID of the event. i.e. **WC1**.
        eventPayload:
          type: string
          additionalProperties:
            type: object
          description: |
            Represents the payload of the either OGS_UPDATES or CASE_RESOLUTION associated with the notification.
            
            The OGS_UPDATES event payload will contain groupId and ogs updates for the case. 
            example : 
            
            ```
            {
            "groupId": "5v0f8asysc1p1jjg2k1zki680",
            "watchlist": {
                         "numberOfNewResults": 51,
                         "numberOfUpdatedResults": 0
                        }
            }
            ```
            
            The CASE_RESOLUTION event payload will contain the groupId and the caseResolution details.
            example : 
            
            ```
            {
             "groupId": "5v0f5s0pu0ds1j4rgt1rt1mmo",
             "watchlist": {
               "numberOfPositiveMatches": 0,
               "numberOfPossibleMatches": 0,
               "numberOfFalseMatches": 34,
               "numberOfUnspecifiedMatches": 0,
               "categorisedMatches": {
                 "watchlistResolvedPositiveBySubCategory": {
                    "Other Bodies": 0,
                    "Law Enforcement": 0,
                    "PEP": 0,
                    "Special Interest Categories": 0,
                    "Regulatory Enforcement": 0,
                    "Sanctions": 0
                 },
                 "watchlistResolvedPossibleBySubCategory": {
                    "Other Bodies": 0,
                    "Law Enforcement": 0,
                    "PEP": 0,
                    "Special Interest Categories": 0,
                    "Regulatory Enforcement": 0,
                    "Sanctions": 0
                 },
                 "watchlistResolvedFalseBySubCategory": {
                   "Other Bodies": 11,
                   "Law Enforcement": 7,
                   "PEP": 19,
                   "Special Interest Categories": 0,
                   "Regulatory Enforcement": 7,
                   "Sanctions": 3
                },
                "watchlistResolvedUnspecifiedBySubCategory": {
                   "Other Bodies": 0,
                   "Law Enforcement": 0,
                   "PEP": 0,
                   "Special Interest Categories": 0,
                   "Regulatory Enforcement": 0,
                   "Sanctions": 0
                 }
                }
              },
              "clientWatchlist": {
                "numberOfPositiveMatches": 10,
                "numberOfPossibleMatches": 0,
                "numberOfFalseMatches": 6,
                "numberOfUnspecifiedMatches": 0
                }
               }
            ```
    DeliveryStatus:
      type: object
      description: |
        Represents the delivery status of the notification along with recipientId and lastDeliveryAttemptTimeStamp.
      properties:
        recipientId:
          type: string
          description: Unique identifier for the recipient of the notification.
        status:
          type: string
          description: |
            Represents status of the notification delivery.
            The status includes :
            
            - SUCCESS : Indicates the notification is delivered to Client Webhook successfully.
            - PENDING : Indicates the delivery of notification to Client Webhook is pending.
            - FAILED  : Indicates the delivery of notification to Client Webhook is Failed.
        lastDeliveryAttemptTimeStamp:
          type: string
          format: date-time
          description: Represents the timestamp of the last attempt to deliver the notification.
          
    OAuthTokenGenerationResponse:
      type: object
      description: Represents the response from a successful token generation request.
      properties:
        access_token:
          type: string
          description: The access token issued by the authorization server.
        token_type:
          type: string
          description: The type of the token issued (e.g., Bearer).
        expires_in:
          type: integer
          format: int32
          description: The lifetime in seconds of the access token.
      example:
        access_token: "access-token-example"
        token_type: "Bearer"
        expires_in: 3600
        
    OAuthTokenError:
      type: object
      required:
        - error
        - cause
      description: Represents a standardized error response for OAuth endpoints.
      properties:
        error:
          type: string
          description: The error code.
        cause:
          type: string
          description: A descriptive message explaining the cause of the error.
      example:
        error: "ERROR_CODE"
        cause: "Error message"

    ScreeningBatchStatusResponse:
      type: object
      description: Batch file execution status response.
      properties:
        filter:
          type: string
          description: A FIQL query filter expression passed in the filter notification request payload.
        sort:
          $ref: '#/components/schemas/SortCriterion'
          description: The sorting criteria passed in the filter notification request payload.
        pagination:
          $ref: '#/components/schemas/PaginationReferenceResponse'
        batches:
          type: array
          description: Filtered and sorted list of existing batch file execution objects.
          items:
            $ref: '#/components/schemas/ScreeningCasesBatchExecution'

    GenericBatchExecution:
      type: object
      description: Generic batch file execution object.
      required:
        - batchUploadId
        - batchFileName
        - actionedByUserId
        - startDate
        - status
      properties:
        batchUploadId:
          type: string
          description: Batch file execution identifier.
          minLength: 1
          maxLength: 255
        batchName:
          type: string
          description: Batch file name as it was provided by the user.
          minLength: 1
          maxLength: 1000
        actionedByUserId:
          type: string
          description: User identifier who started this batch file execution.
          minLength: 1
          maxLength: 255
        startDate:
          type: string
          description: Start date and time of this batch file execution in ISO 8601 format excluding Week and Ordinal dates.
          format: date-time
          x-wc1-field-extra-annotations: "@com.fasterxml.jackson.databind.annotation.JsonSerialize(using = com.thomsonreuters.grc.fsp.api.controller.client.core.jackson.serializer.VariablePrecisionDateTimeToISO8601NoMillisSerializer.class)"
        completionDate:
          type: string
          description: Completion date and time of this batch file execution in ISO 8601 format excluding Week and Ordinal dates.
          format: date-time
          x-wc1-field-extra-annotations: "@com.fasterxml.jackson.databind.annotation.JsonSerialize(using = com.thomsonreuters.grc.fsp.api.controller.client.core.jackson.serializer.VariablePrecisionDateTimeToISO8601NoMillisSerializer.class)"
        status:
          $ref: '#/components/schemas/BatchExecutionStatusType'

    ScreeningCasesBatchExecution:
      type: object
      description: Object represents Screening Cases batch file execution.
      x-class-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
      allOf:
        - $ref: '#/components/schemas/GenericBatchExecution'
        - type: object
          properties:
            metadata:
              $ref: '#/components/schemas/ScreeningCasesBatchMetadata'
            summary:
              $ref: '#/components/schemas/ScreeningBatchExecutionSummary'

    ScreeningCasesBatchMetadata:
      type: object
      description: Generic screening batch file metadata object.
      discriminator:
        propertyName: metadataType
      x-wc1-model-discriminator-map:
        - key: ScreeningByNameBatchMetadata
          value: ScreeningByNameBatchMetadata
        - key: ScreeningByImoBatchMetadata
          value: ScreeningByImoBatchMetadata
      required:
        - metadataType
        - groupId
        - batchId
        - providerTypes
      properties:
        metadataType:
          $ref: '#/components/schemas/BatchScreeningMetadataType'
        groupId:
          type: string
          description: Group identifier owning the batch and cases.
          minLength: 1
          maxLength: 255
        batchId:
          type: string
          description: Batch identifier containing the cases.
          minLength: 1
          maxLength: 255
        providerTypes:
          type: array
          description: Array of provider types used in screening the cases.
          uniqueItems: true
          minItems: 1
          items:
            $ref: '#/components/schemas/ProviderTypeForAudit'
        caseScreeningState:
          type: object
          description: |
            Mapping from 'ProviderType' to indicate whether Ongoing Screening is enabled for this cases
            on the specific 'ProviderType'. By default, value will be set from account settings.
          additionalProperties:
            $ref: '#/components/schemas/CaseScreeningState'
          x-wc1-map-key-value: ProviderType

    BatchScreeningMetadataType:
      type: string
      description: Represents types of ScreeningCasesBatchMetadata.
      enum:
        - ScreeningByNameBatchMetadata
        - ScreeningByImoBatchMetadata
      x-enum-varnames:
        - SCREENING_BY_NAME_BATCH_METADATA
        - SCREENING_BY_IMO_BATCH_METADATA

    ScreeningByNameBatchMetadata:
      type: object
      description: Batch file metadata object for the batch screening by names.
      x-wc1-model-discriminator-map:
        - key: BatchScreeningMetadataType
          keyAlias: MetadataType
          value: ScreeningByNameBatchMetadata
      allOf:
        - $ref: '#/components/schemas/ScreeningCasesBatchMetadata'
        - type: object
          properties:
            nameTransposition:
              type: boolean
              description: |
                Flag indicating whether name transposition should be enabled for the cases.
                The value from the Account settings will be used if not provided.

    ScreeningByImoBatchMetadata:
      type: object
      description: Batch file metadata object for the batch screening by IMO.
      x-wc1-model-discriminator-map:
        - key: BatchScreeningMetadataType
          keyAlias: MetadataType
          value: ScreeningByImoBatchMetadata
      allOf:
        - $ref: '#/components/schemas/ScreeningCasesBatchMetadata'
        - type: object
          properties:
            associateDetails:
              $ref: '#/components/schemas/BatchFileExecutionAssociate'

    BatchFileExecutionAssociate:
      type: object
      description: Object represents the associate details of the batch file execution.
      properties:
        batchAssociateStatusType:
          $ref: '#/components/schemas/BatchAssociateStatusType'
        batchAssociateTypes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BatchAssociateType'
        enableOgsForLinkedCases:
          type: boolean
          description: Flag indicating whether on-going screening is enabled for linked cases.

    ScreeningBatchExecutionSummary:
      type: object
      description: Batch file processing summary.
      properties:
        processed:
          type: integer
          description: Number of processed cases uploaded in a batch file.
          format: int32
        created:
          type: integer
          description: Number of new cases uploaded in a batch file.
          format: int32
        updated:
          type: integer
          description: Number of updated cases uploaded in a batch file.
          format: int32
        failed:
          type: integer
          description: Number of failed cases uploaded in a batch file.
          format: int32
        skipped:
          type: integer
          description: Number of skipped cases uploaded in a batch file.
          format: int32
        parentCaseSummary:
          $ref: '#/components/schemas/ParentCaseExecutionSummary'

    ParentCaseExecutionSummary:
      type: object
      description: Batch file processing summary for parent cases.
      properties:
        created:
          type: integer
          description: Number of created primary cases uploaded in a batch file.
          format: int32
        updated:
          type: integer
          description: Number of updated primary cases uploaded in a batch file.
          format: int32
        createdSub:
          type: integer
          description: Number of created subcases uploaded in a batch file.
          format: int32
        linkedSub:
          type: integer
          description: Number of linked subcases uploaded in a batch file.
          format: int32

