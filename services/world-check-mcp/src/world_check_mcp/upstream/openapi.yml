  /cases/{caseSystemId}/links:
    post:
      operationId: linkUnlinkCases
      tags:
        - cases
      summary: Link cases to a given case.
      description: |
        Create or delete links between Cases based on link type strategy (`linkType`). You can link / unlink cases in two ways:

         * `primary-to-subcase` : declares `caseSystemId` as a primary case and cases listed in `linkedCasesRequest`
                                  as subcases which will be linked to / unlinked from a primary case.
         * `subcase-to-primary` : declares `caseSystemId` as a subcase and cases listed in `linkedCasesRequest`
                                  as primary cases which will be linked to / unlinked from a subcase.

        **Note:** There is a maximum number of World-Check One links between cases:
        * Maximum 500 primary cases are allowed per a subcase.
        * Maximum 50 subcases are allowed per a primary case.

        **Example HTTP request**

        ```
            {
              "linkedCases":[
                "Case System ID 1",
                "Case System ID 2",
              ]
            }
        ```
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/ContentLength'
        - $ref: '#/components/parameters/CaseSystemId'
      requestBody:
        description: The payload for linked cases request.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkedCasesRequest'
      responses:
        '201':
          description: Links between cases have been created.
        '204':
          description: Links between cases have been deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CannotReturnResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /bulk/cases:
    post:
      operationId: saveAndScreenLinkedCases
      tags:
