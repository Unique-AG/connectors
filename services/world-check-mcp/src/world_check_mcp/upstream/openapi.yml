      summary: Get List of Subcription based on the filter subscription request.
      description: |
        Submit a filter request to retrieve a list of subscriptions based on the specified filter criteria.
        
        This endpoint allows you to submit filter subscription request to retrieve a list of subscriptions
        based on the specified criteria. User can submit the filter subscription request through the
        request object, which includes 'filter', 'sort' fields. Expressions in 'filter' must
        adhere to the Atom Feed Item Query Language (FIQL), which is documented in [RFC 4288](https://tools.ietf.org/html/rfc4288)
        and the superset supported by the WC1 API, as documented in [WC1 API Query Language](https://github.com/jirutka/rsql-parser).
        User can retrieve list of subscriptions for both 'OGS_UPDATES' and 'CASE_RESOLUTION' eventType.
        
        List Subscriptions response will contain all the details which are delivered to the webhook along with the 
        delivery status.

      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/ContentLength'
