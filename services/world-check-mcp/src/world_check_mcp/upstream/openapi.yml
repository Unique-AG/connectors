                active:
                  $ref: '#/components/examples/SubscriptionResponseActive'
                verificationFailed:
                  $ref: '#/components/examples/SubscriptionResponseVerificationFailed'
                inactive:
                  $ref: '#/components/examples/SubscriptionResponseInactive'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
