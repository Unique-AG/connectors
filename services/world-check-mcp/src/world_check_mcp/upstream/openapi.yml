components:
  parameters:

    #---------------------------------------------------------------------------#
    #                         Common header parameters                          #
    #---------------------------------------------------------------------------#

    OAuthAuthorization:
      in: header
      name: Authorization
      required: true
      description: |
        Use HTTP Basic Authentication with the service-account-uuid as the username and the service-account-password as the password. 

        For example, if your service-account-uuid is `my-uuid` and your service-account-password is `my-password`, Base64-encode the string `my-uuid:my-password`. 
        The resulting Authorization header would be: `Authorization: Basic <bXktdXVpZDpteS1wYXNzd29yZA==`
      schema:
        type: string
    OAuthContentType:
      in: header
      name: Content-Type
      required: true
      description: |
        The media type of the request, for the OAuth revoke endpoint it must be 'application/x-www-form-urlencoded'.
      schema:
        type: string
    Authorization:
      in: header
      name: Authorization
      required: true
      description: |
        The authorization credentials:

        - For HMAC authorization: include 'keyId', 'algorithm', 'headers', and 'signature' (refer to the "Authorization" section of the documentation for more details).

        - For OAuth: use the access token in the header as: `Authorization: Bearer <access_token>`.
      schema:
        type: string

    ContentType:
      in: header
      name: Content-Type
      required: false
      description: |
        The media type of the request (e.g., 'application/json').
        
        This header is required when using HMAC authorization.
      schema:
        type: string

    ContentLength:
      in: header
      name: Content-Length
      required: false
      description: | 
        The length of the request body in octets (8-bit bytes). 
      
        This header is required when using HMAC authentication, but should be omitted when using OAuth authorization.
      schema:
        type: integer

    Date:
      in: header
      name: Date
      required: false
      description: |
        The date and time at which the message was originated in 'RFC 1123' format. 
        
        This header is required when using HMAC authentication, but should be omitted when using OAuth authorization.
      schema:
        type: string

    UserName:
      in: header
      name: user_name
      required: false
      description: The unique user id for the client making a request to the WC1 Public API.
      schema:
        type: string

    UniqueRequestId:
      in: header
      name: X-Request-ID
      required: false
      description: The unique request Id for each request generated by the WC1 API Gateway.
      schema:
        type: string

    Accept-Language:
      in: header
      name: Accept-Language
      required: false
      description: |
        A value that identifies language for request where applicable. The response will contain translated content of the 'details' section in the selected 'Accept-Language', otherwise it will be returned only with original 'detail' section in English. 
        Accepted language codes are: 

        * French - 'fr'
        * Japanese - 'ja'
        * Spanish - 'es'
        * Russian - 'ru'
        * Portuguese - 'pt'
        * Chinese Simplified - 'zh_cn' 
        * Chinese Traditional - 'zh_tw'
        * Italian - 'it_it'
        * German - 'de_de'
        * Arabic - 'ar_sa'
        * Hebrew - 'he_il'
      schema:
        type: string
        default: en

    #---------------------------------------------------------------------------#
    #                 Common header parameters - end of section                 #
    #---------------------------------------------------------------------------#

    #---------------------------------------------------------------------------#
    #                          Common path parameters                           #
    #---------------------------------------------------------------------------#

    CaseId:
      in: path
      name: caseId
      required: true
      description: Case ID provided by the Client or else generated by the system for the Client.
      schema:
        type: string
        maxLength: 512

    CaseSystemId:
      in: path
      name: caseSystemId
      required: true
      description: System generated ID for the Case.
      schema:
        type: string
        maxLength: 192

    AuditEventId:
      in: path
      name: auditEventId
      required: true
      description: ID of the audit event.
      schema:
        type: string

    GroupId:
      in: path
      name: groupId
      required: true
      description: The Group ID.
      schema:
        type: string
        maxLength: 255

    ReportId:
      in: path
      name: reportId
      required: true
      description: Unique report ID.
      schema:
        type: string

    BatchUploadId:
      in: path
      name: batchUploadId
      required: true
      description: Identifier of the batch file execution for which errors should be retrieved
      schema:
        type: string

    id:
      in: path
      name: id
      required: true
      description: Record identifier.
      schema:
        type: string

    identifier:
      in: path
      name: identifier
      required: true
      description: Unique identifier for this provider source. Has to be alphanumeric.
      schema:
        type: string

    SubscriptionId:
      in: path
      name: subscriptionId
      required: true
      description: The Unique Subscription ID.
      schema:
        type: string
        maxLength: 1000

    OnlySummary:
      in: query
      name: onlySummary
      required: false
      description: If true, then only send results filters summary in response, if false or not given then respond with results filters summary plus all results.
      schema:
        type: boolean

    UniqueBusinessId:
      in: path
      name: uniqueBusinessId
      required: true
      description: Unique identifier for a UBO case. Represents DUNS number for DnB and Entity Id for Sayari.
      schema:
        type: string

    case-system-id:
      in: path
      name: case-System-Id
      required: true
      description: System generated ID for the Case.
      schema:
        type: string
        maxLength: 192
    #---------------------------------------------------------------------------#
    #                          Common path parameters - end of section          #
    #---------------------------------------------------------------------------#

  responses:

    #---------------------------------------------------------------------------#
    #                              Error responses                              #
    #---------------------------------------------------------------------------#

    Unauthorized:
      description: |
        
        **HMAC Authorization:**
        The request has failed an authorization check. Possible reasons include:
        - Invalid or expired API key
        - Invalid HMAC signature
        - Request timing issue or problem with the Date header value

        The API client should ensure a correctly synchronised clock is used to generate request timestamps.

        **OAuth:**
        The request has failed an authorization check. Possible reasons include:
        - Invalid, expired, or incorrect access token

        The API client should ensure a valid OAuth access token is used for authorization.
      content:
        application/json:
          schema:
            type: string

    CannotReturnResponse:
      description: Not Found.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ErrorsOld'

    UnsupportedMediaType:
      description: For requests with payloads, an unsupported Content-Type was specified. The World-Check One API only supports a content type of application/json.
      content:
        application/json:
          schema:
            type: string

    PreconditionRequired:
      description: |
        The server cannot validate the OAuth JWT token because the required JWKS (JSON Web Key Set) is missing or expired in the cache. 
        This status is returned only for OAuth flows, not for HMAC. 
        Clients receiving this response should regenerate their access token to ensure it is signed with a valid key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthTokenError'

