          description: Specifies the minimum beneficial ownership percentage greater than or to equal to which the ownership percentage has to be filtered.
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 2
        countryCode:
          description: The 3-letter country code for the UBO case.
          type: string
          example: USA
        ownersType:
          type: string
          description: Types of owners - could be Individual, Business or Unspecified.
          enum:
            - Individual
            - Business
            - Unspecified

    FilteredNotificationRequest:
      type: object
      required:
        - filter
        - pagination
        - sort
      properties:
        filter:
          type: string
          description: |
            The filter string specifies the criteria for listing notifications.
            
            The filter supports below fields to specify criteria:
            - **updatedDate**: Represents the date and time in ISO 8601 format(excluding Week and Ordinal dates)
                               when the notification was last updated. Supports only == operator. 
                                e.g. `2025-01-01T00:00:00Z` (Mandatory).
            
            - **recipientId**: Represents the unique recipient Id for which notifications need to be listed.
                               Supports == and IN operator. The maximum number of recipientId allowed is 50. (Mandatory) 
            
            - **eventType**: Represents the type of event that triggered the notification. (Optional).
                             Supports == and IN operator.
            
            
            - **status**: Represents the notification delivery status to the client Webhook. (Optional).
                          Supports == and IN operator. The following delivery status are allowed.
            
                - SUCCESS : Represents the delivery of notification to webhook is successful.
                - PENDING : Represents the delivery of notification to webhook is in pending state.
                - FAILED  : Represents the delivery of notification to webhook is in failed state.
        pagination:
          $ref: '#/components/schemas/PaginationReferenceRequest'
        sort:
          type: array
          description: |
            An array of sorting criteria for listing the notifications.
            
            The list of available sort parameter names:
            - 'updatedDate' - Represents the date when the notification was last updated.
            - 'recipientId' - Represents the unique recipient Ids for which notifications need to be retrieved.
            - 'eventType'   - Represents the type of event that triggered the notification.
            - 'status'      - Represents the notification delivery status to the client Webhook.
          items:
            $ref: '#/components/schemas/SortCriterion'
      example:
        filter: updatedDate==2025-05-15; recipientId=in=(5v0f8asysc1p1jjg2k1zki680,9v0f8asysc1p1mmg2k1zki123); eventType=in=(OGS_UPDATES, CASE_RESOLUTION); status=in=(SUCCESS, PENDING, FAILED)
        sort:
          - columnName: updatedDate
            order: DESCENDING
        pagination:
          itemsPerPage: 1000
          pageReference: "Reference ID of the requested page"

