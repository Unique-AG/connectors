  /batch/cases:
    post:
      x-wc1-raw-request-method: true
      operationId: uploadBatchScreeningFile
      tags:
        - batch
      summary: File Upload for Batch Screening Endpoint
      description: |
        Uploads a CSV or XLSX file containing Cases and queues the file for asynchronous Case creation
        and screening.

        The request body must be `multipart/form-data` with a `metadata` part (JSON, see
        `ScreeningByNameBatchRequest`) and a `fileContent` part containing the CSV/XLSX file to upload. Order of
        the parts does not matter. The successful response returns the batch file execution identifier that can
        be used with `POST /batch/cases/status` to track processing.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/ContentLength'
      requestBody:
        description: |
          Multipart form data containing the batch metadata and the CSV/XLSX file with Cases to create and
          screen.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                payload:
                  $ref: '#/components/schemas/ScreeningByNameBatchRequest'
                fileContent:
                  type: string
                  format: binary
                  description: |
                    Part which contains file data along with 'Content-Type' and 'Content-Disposition' headers.
                    File name must be provided in the 'filename' attribute of the 'Content-Disposition' header.
              required:
                - payload
                - fileContent
            encoding:
              payload:
                contentType: application/json
              fileContent:
                contentType: text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '200':
          description: The batch file has been uploaded successfully and queued for case creation and screening.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningCasesBatchExecution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '502':
          $ref: '#/components/responses/BadGateway'

