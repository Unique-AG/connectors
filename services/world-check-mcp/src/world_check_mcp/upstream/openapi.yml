  /cases/{caseSystemId}/ubo/resolution:
    put:
      tags:
        - ubo-check
      summary: Associate the entity with a case or mark all resolved.
      description: |
        This endpoint is used to either associate an entity with the given case or resolve all entities.
         ** Note ** Please enter a valid unique business Id. If invalid unique business Id is given in the request, case will be marked as resolved but UBO details cannot be fetched.

        To associate the entity with the given case, give the unique business id as part of request as shown below.
         ```
            {
              "uniqueBusinessId": ["123456"],
              "remarks": "remarks"
            }
        ```
        To mark all entities as resolved, skip <uniqueBusinessId> in the request as shown below. In this example, no entities will be associated with the case.
         ```
            {
              "remarks": "remarks"
            }
        ```
      operationId: resolveUboCase
      parameters:
