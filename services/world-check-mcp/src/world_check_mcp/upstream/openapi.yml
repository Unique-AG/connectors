      description: |
        The case matched event type enumeration. 
         The below case match event types are available:
         - UNRESOLVED : Indicates the case match is unresolved.
         - AUTO_RESOLVED : Indicates the case match is autoresolved.
         - AI_AUTO_RESOLVED : Indicates the case match is autoresolved by Artificial Intelligence (AI).
         - REVIEW_REQUIRED : Indicates the reviewRequired action on unresolved case match.
         - REVIEW_REQUIRED_ALERT : Indicates the reviewRequired action on resolved case match.
      enum:
        - UNRESOLVED
        - AUTO_RESOLVED
        - AI_AUTO_RESOLVED
        - REVIEW_REQUIRED
        - REVIEW_REQUIRED_ALERT

    ResolutionType:
      type: string
      description: The resolution type of a case screening result.
      enum:
        - UNRESOLVED
        - POSITIVE
        - POSSIBLE
        - 'FALSE'
        - UNSPECIFIED

    MatchedStrength:
      type: string
      description: The strength of the match of a case screening result.
      enum:
        - WEAK
        - MEDIUM
        - STRONG
        - EXACT

    CompositeMatchStrength:
      type: string
      description: Match strength derived from the composite match score.
      enum:
        - UNSPECIFIED
        - VERY_HIGH
        - HIGH
        - MODERATE
        - LOW
        - VERY_LOW

    TextSearchMode:
      type: string
      description: |
        The search mode for case search query fields. 
        The following search types are available:
        
        * DEFAULT: Searches for the words in the search string in any order.  
           e.g. Searching for "smith fred" would match a case name of "fred james smith". 
           Supports wildcard searches using the * and ? characters:
             * " * " : matches zero or more characters. e.g. "*ed j*es sm*" would match "fred james smith".
             * " ? " : matches one character. e.g. "fr?d" would match "fred" but not "freed".
        
        * BEGINS_WITH: The text to be searched must begin with the search string. 
           e.g. Searching for "fred ja" would match a case name of "fred james smith".
           Does not support wildcard searches.
        
        * EXACT: The text to be searched must exactly match the search string. 
           e.g. Searching for "fred james smith" would match a case name of "fred james smith".
           Does not support wildcard searches.
        
        * CONTAINS: The text must contain all the words in the search string in the same order.
           e.g. Searching for "james smith" or "fred james" would match a case name of "fred james smith".
           Does not support wildcard searches.
      enum:
        - DEFAULT
        - BEGINS_WITH
        - EXACT
        - CONTAINS

    #---------------------------------------------------------------------------#
    #                  Reference definitions - end of section                   #
    #---------------------------------------------------------------------------#
