    HmacSubscriptionRequest:
      summary: Request - HMAC
      description: Example request payload for creating a subscription with hmac credentials.
      value:
        subscriptionType: WEBHOOK
        subscriptionAuth:
          url: https://www.example.com/hmac
          authType: HMAC
          credentials:
            apiKey: myApiKey
            apiSecret: myApiSecret
        subscriptionEventType: OGS_UPDATES
        recipients: ["recipientId1", "recipientId2", "recipientId3"]

    OauthSubscriptionRequest:
      summary: Request - OAUTH
      description: Example request payload for creating a subscription with oauth credentials.
      value:
        subscriptionType: WEBHOOK
        subscriptionAuth:
          url: https://www.example.com/oauth
          authType: OAUTH
          credentials:
            clientId: myApiKey
            clientSecret: myApiSecret
            tokenUrl: https://www.example.com/oauth/token
        subscriptionEventType: OGS_UPDATES
        recipients: [ recipientId1, recipientId2, recipientId3 ]

    SubscriptionUpdateRequestForRecipients:
      summary: Update recipients
      description: |
        Example request payload for updating recipients of a subscription.
        
        **Note** : Existing recipients will be overridden with the recipients provided in the request.
      value:
        recipients: [ recipientId1, recipientId2, recipientId3, updateRecipientId1 ]

    SubscriptionUpdateRequestForStatus:
      summary: Update subscription status
      description: Example request payload for updating subscription status of an active subscription to INACTIVE.
      value:
        subscriptionStatus:
          status: INACTIVE

    SubscriptionUpdateRequestForSubscriptionAuth:
      summary: Update subscriptionAuth
      description: Example request payload for updating subscription auth credentials.
      value:
        subscriptionAuth:
          url: https://www.example.com/hmac
          authType: HMAC
          credentials:
            apiKey: updateApiKey
            apiSecret: myApiSecret

    SubscriptionResponseActive:
      summary: Subscription - ACTIVE
      description: |
        Example response of an active subscription with hmac credentials.
        
        **Note** : Subscription response for OAUTH auth type will be the same with respective subscriptionAuth details for OAUTH.
      value:
        subscriptionType: WEBHOOK
        subscriptionAuth:
          url: https://www.example.com/hmac
          authType: HMAC
          credentials:
            apiKey: Mm************************************************************6K
            apiSecret: "************************"
        subscriptionEventType: OGS_UPDATES
        recipients: [ recipientId1, recipientId2, recipientId3 ]
        subscriptionId: 6728a25f15abcd307ae54a081
        creationDate: 2025-09-10T05:02:11.000Z
        modifiedDate: 2025-09-10T07:08:09.000Z
        subscriptionStatus:
          status: ACTIVE

    SubscriptionResponseVerificationFailed:
      summary: Subscription - VERIFICATION_FAILED
      description: |
        Example response of a subscription when verification fails for the respective credentials.
        
        **Note** : Subscription response for OAUTH auth type will be the same with respective subscriptionAuth details for OAUTH.
      value:
        subscriptionType: WEBHOOK
        subscriptionAuth:
          url: https://www.example.com/hmac
          authType: HMAC
          credentials:
            apiKey: Mm************************************************************6K
            apiSecret: "************************"
        subscriptionEventType: OGS_UPDATES
        recipients: [ recipientId1, recipientId2, recipientId3 ]
        subscriptionId: 6728a25f15abcd307ae54a081
        creationDate: 2025-09-10T05:02:11.000Z
        modifiedDate: 2025-09-10T07:08:09.000Z
        subscriptionStatus:
          status: VERIFICATION_FAILED
          reason: 404 NOT_FOUND

    SubscriptionResponseInactive:
      summary: Subscription - INACTIVE
      description: |
        Example response of an active subscription with hmac credentials.

        **Note** : Subscription response for OAUTH auth type will be the same with respective subscriptionAuth details for OAUTH.
      value:
        subscriptionType: WEBHOOK
        subscriptionAuth:
          url: https://www.example.com/hmac
          authType: HMAC
          credentials:
            apiKey: Mm************************************************************6K
            apiSecret: "************************"
        subscriptionEventType: OGS_UPDATES
        recipients: [ recipientId1, recipientId2, recipientId3 ]
        subscriptionId: 6728a25f15abcd307ae54a081
        creationDate: 2025-09-10T05:02:11.000Z
        modifiedDate: 2025-09-10T07:08:09.000Z
        subscriptionStatus:
          status: INACTIVE

