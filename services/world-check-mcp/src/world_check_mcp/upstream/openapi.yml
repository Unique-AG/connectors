          $ref: '#/components/schemas/ResolutionFields'
        resolutionRules:
          type: object
          description: A collection of StatusRules keyed by Status ID.
          additionalProperties:
            $ref: '#/components/schemas/StatusRule'
      example:
        groupId: Group ID
        providerType: WATCHLIST
        resolutionFields:
          statuses:
            - id: Status ID 1
              label: 'FALSE'
              type: 'FALSE'
            - id: Status ID 2
              label: POSSIBLE
              type: POSSIBLE
            - id: Status ID 3
              label: POSITIVE
              type: POSITIVE
            - id: Status ID 4
              label: UNSPECIFIED
              type: UNSPECIFIED
          risks:
            - id: Risk ID 1
              label: MEDIUM
              type: null
            - id: Risk ID 2
              label: LOW
              type: null
            - id: Risk ID 3
              label: HIGH
              type: null
            - id: Risk ID 4
              label: UNKNOWN
              type: null
          reasons:
            - id: Reason ID 1
              label: unreasonable
              type: null
            - id: Reason ID 2
              label: reasonable
              type: null
        resolutionRules:
          STATUS_ID_1:
            reasons:
              - Reason ID 1
              - Reason ID 2
            remarkRequired: true
            reasonRequired: true
            risks:
              - RISK_ID_1:
              - RISK_ID_2:
          STATUS_ID_2:
            reasons: [ ]
            remarkRequired: false
            reasonRequired: false
            risks: [ ]
          STATUS_ID_3:
            reasons:
              - Reason ID 2
            remarkRequired: false
            reasonRequired: true
            risks:
              - RISK_ID_3:
          STATUS_ID_4:
            reasons:
              - Reason ID 1
            remarkRequired: false
            reasonRequired: true
            risks:
              - RISK_ID_4:
              - RISK_ID_2:

