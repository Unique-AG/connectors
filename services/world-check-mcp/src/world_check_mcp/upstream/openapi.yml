      summary: Save and screen multiple cases.
      description: |
        Save and screen multiple cases for the given group Id. Caller may include multiple cases with up to 1000 entities in a single request (see *Example HTTP request* below).
        Also it is possible to include audit note, start screening date and  parent case system id. If parent case system id is present then newly created case will be linked to specified parent.
        In response, the caller receives a summary of the creation operation for each case.

        *Example HTTP response* below, shows the following summary:

          1. The first case has been created successfully.
          2. The second case has not been created successfully because it does not meet the validation criteria;
           "errors" and "cause" fields contain detailed information.

        **Example HTTP response**

        ```
          [
              {
                  "name": "Name 1",
                  "caseId": "Case ID 1",
                  "caseSystemId": "Case System ID 1",
                  "nameTransposition": true,
                  "caseScreeningState": {
                      "WATCHLIST": "INITIAL"
                  }
              },
              {
                  "name": "Name 2",
                  "caseId": "Case ID 2",
                  "errors": [
                      {
                          "error": "CASE_ID_EXISTS",
                          "cause": "Case IDs must be unique within the same client and request."
                      }
                  ]
              }
          ]
        ```

        **Note:** The maximum number of World-Check screenings (including initial, rescreening, and ZFP ones)
                  that a client can perform in an hour is limited.'caseId' must not start or end with a slash or contain two consecutive slashes (//) as this may result in errors.
