[project]
name = "world-check-mcp"
revision = "1.0"

[providers]
onepassword = "onepassword://Employee"
dotenv = "dotenv:.env"

[profiles.default]
UPSTREAM_API_KEY = { description = "LSEG service-account id (short id, not a UUID)", ref = { item = "LSEG World-Check One", section = "service account", field = "UUID" }, providers = ["onepassword"] }
UPSTREAM_API_SECRET = { description = "LSEG service-account password (a UUID)", ref = { item = "LSEG World-Check One", section = "service account", field = "password" }, providers = ["onepassword"] }

[profiles.local]
UPSTREAM_API_KEY = { description = "LSEG service-account id, from .env", ref = { item = "UPSTREAM_API_KEY" }, providers = ["dotenv"] }
UPSTREAM_API_SECRET = { description = "LSEG service-account password, from .env", ref = { item = "UPSTREAM_API_SECRET" }, providers = ["dotenv"] }
