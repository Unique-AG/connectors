[project]
name = "kb-mcp"
version = "0.1.7"
description = "Knowledge Base Search MCP — Unique KB search, content tree, and read_file tools"
requires-python = ">=3.14"
dependencies = [
    "cryptography==50.0.2",
    "fastmcp==4.1.4",
    "mcp-configs==0.1.0",
    "mcp-observability==0.1.0",
    "pydantic==2.14.1",
    # fastmcp already depends on py-key-value-aio[filetree,memory];
    # this adds the postgresql extra (asyncpg) for durable OAuth storage.
    "py-key-value-aio[postgresql]==0.4.6",
    "tenacity==9.2.1",
    "tiktoken==0.12.0",
    "unique-mcp==2026.44.2",
    "unique-toolkit[monitoring,otel]==2026.44.2",
    "unique-sdk==2026.44.2",
    "httpx==0.28.1",
    "starlette==1.10.0",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "mcp==2.3.0",
]

[project.scripts]
kb-mcp = "kb_mcp.main:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/kb_mcp" = "kb_mcp"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "hatchling==1.33.0",
    "ruff==0.17.3",
    "basedpyright==1.40.2",
    "poethepoet==0.49.0",
]

[tool.poe.tasks]
# Run from the service's folder: uv run poe <task>
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
fix = ["format", "lint-fix", "format"]
typecheck = "basedpyright"
test = "pytest"
ci = { cmd = "bash ../../scripts/check-python-service.sh .", help = "every check CI runs, in its order" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "ai: AI-authored or AI-generated tests",
    "asyncio: asyncio tests",
    "integration: integration tests that require API access or credentials",
    "serial: tests that must run serially",
    "unit: unit tests",
    "verified: AI-generated tests with human verification",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py314"
exclude = [".venv"]

[tool.ruff.lint]
extend-select = ["I"]
# FastMCP tool DI uses Depends(...) in parameter defaults (same pattern as FastAPI).
ignore = ["B008"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "recommended"
include = ["src"]
reportMissingTypeStubs = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportCallInDefaultInitializer = "none"
reportUnusedCallResult = "none"
reportUnusedFunction = "none"
reportImplicitStringConcatenation = "none"
reportDeprecated = "none"
reportUnannotatedClassAttribute = "none"

[tool.uv.sources]
mcp-configs = { path = "../../packages/mcp-configs" }
mcp-observability = { path = "../../packages/mcp-observability" }
