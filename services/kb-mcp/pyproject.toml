[project]
name = "kb-mcp"
version = "0.0.1"
description = "Knowledge Base Search MCP — Unique KB search, content tree, and read_file tools"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.0",
    "fastmcp==3.4.5",
    "pydantic==2.12.5",
    # fastmcp already depends on py-key-value-aio[filetree,keyring,memory];
    # this adds the postgresql extra (asyncpg) for durable OAuth storage.
    "py-key-value-aio[postgresql]==0.4.5",
    "tiktoken==0.12.0",
    "unique-mcp==2026.34.0.dev5",
    "unique-toolkit[monitoring,otel]==2026.34.0.dev8",
    "unique-sdk==2026.34.0.dev4",
]

[project.scripts]
kb-mcp = "kb_mcp.main:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/kb_mcp" = "kb_mcp"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "hatchling==1.31.0",
    "ruff==0.16.0",
    "basedpyright==1.39.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "ai: AI-authored or AI-generated tests",
    "asyncio: asyncio tests",
    "integration: integration tests that require API access or credentials",
    "serial: tests that must run serially",
    "unit: unit tests",
    "verified: AI-generated tests with human verification",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
extend-select = ["I"]
# FastMCP tool DI uses Depends(...) in parameter defaults (same pattern as FastAPI).
ignore = ["B008"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
include = ["src"]
reportMissingTypeStubs = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportCallInDefaultInitializer = "none"
reportUnusedCallResult = "none"
reportUnusedFunction = "none"
reportImplicitStringConcatenation = "none"
reportDeprecated = "none"
reportUnannotatedClassAttribute = "none"
