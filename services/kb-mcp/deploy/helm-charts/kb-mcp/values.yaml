nameOverride: kb-mcp
fullnameOverride: kb-mcp
selectorComponentLabel: server

# Loki scrapes use this label to parse stderr as pino-json
# (unique_mcp.configure_logging).
podLabels:
  logging.unique.app/format: pino-json

env:
  LOG_LEVEL: info
  # Bind address inside the pod. Leave this alone in Argo overlays.
  UNIQUE_MCP_LOCAL_BASE_URL: http://0.0.0.0:8000
  # PYTHONMALLOC: malloc # PID-1 glibc allocator; enable with content_tree
  # MEMORY_TRIM_INTERVAL_SECONDS: "30" # periodic malloc_trim; toolkit default is 120s

mcpConfig:
  enabled: true
  app:
    publicBaseUrl: "" # e.g. https://kb-mcp.<tenant>.unique.app. Must match routes.hostname
    frontendBaseUrl: "" # optional, e.g. https://<tenant>.unique.app
  zitadel:
    baseUrl: "" # e.g. https://id.<tenant>.unique.app
    clientId: ""
  # -- MCP tool names to advertise, e.g. [search, read_file] to hide
  # content_tree. Server-wide. Empty means all tools.
  enabledTools: []
  search:
    scopeLookupConcurrency: 8
  # -- Folder-walk cache and wait tuning, shared by content_tree and
  # content_metadata.
  folderWalk:
    cache:
      ttlSeconds: 600
      maxEntries: 24
    timeoutSeconds: 30
    maxTimeoutSeconds: 45
  http:
    maxConnections: 100
    maxKeepaliveConnections: 20
    poolTimeoutSeconds: 60

# A Unique cluster puts these in extraEnvSecrets (external-secrets).
# Elsewhere, use envVars and secretKeyRef. ENCRYPTION_KEY protects
# OAuth proxy state in Postgres. Generate it with:
#   openssl rand -hex 32
#
#   envVars:
#     - name: ZITADEL_JWT_SIGNING_KEY
#       valueFrom:
#         secretKeyRef:
#           name: kb-mcp-zitadel-secret
#           key: ZITADEL_JWT_SIGNING_KEY
#     - name: ENCRYPTION_KEY
#       valueFrom:
#         secretKeyRef:
#           name: kb-mcp-oauth-storage-secret
#           key: ENCRYPTION_KEY
envVars: []

image:
  registry: ghcr.io
  repository: unique-ag/connectors/services/kb-mcp
  tag: 0.1.5 # x-release-please-version
  pullPolicy: IfNotPresent

ports:
  application: 8000

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 50m
    memory: 512Mi

probes:
  enabled: true
  liveness:
    failureThreshold: 6
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
  readiness:
    failureThreshold: 6
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
  startup:
    failureThreshold: 30
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5

serviceAccount:
  enabled: true

# Writable /tmp. The base chart sets readOnlyRootFilesystem: true.
volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi

volumeMounts:
  - name: tmp
    mountPath: /tmp

# OAuth proxy storage. Settings refuses to boot without a durable DATABASE_URL
# from this block and ENCRYPTION_KEY from envVars above.
# A Unique cluster with in-cluster CloudNativePG sets host and url like this.
# Without the operator, set postgresql.enabled to false and pass DATABASE_URL
# through extraEnvSecrets.
postgresql:
  enabled: true
  connection:
    sslMode: verify
    # host:
    #   fromKubernetesService:
    #     name: <release-name>-pg-cluster-rw
    #     namespace: <namespace>
    #     podPort: 5432
    #     podSelectorLabels:
    #       cnpg.io/cluster: <release-name>-pg-cluster
    # url:
    #   fromSecret:
    #     name: <release-name>-pg-cluster-app
    #     key: fqdn-uri

rabbitmq:
  enabled: false

service:
  port: 80

internalServices:
  dependents:
    ingressGateway:
      name: gateway
      namespace: system

# Off until an overlay sets hostname + paths.
routes:
  hostname: ""
  auth:
    jwt: false

hooks:
  migration:
    enabled: false

# postgresql.connection.url hides the real host inside the secret, so the chart
# skips egress for it and does not fail. An overlay that enables networkPolicy
# against connection.url must set postgresql.networkPolicyEgressManaged: true
# and add its own Postgres egress rule under networkPolicy.egress[].
networkPolicy:
  enabled: false
  flavor: cilium
  enableDefaultDeny:
    ingress: true
    egress: true
  baseline:
    prometheus:
      enabled: false
    ephemeralPorts:
      enabled: false
    # A Unique cluster's Zitadel and gateway hostnames match *.unique.app.
    egress:
      unique:
        toFQDNs:
          - matchPattern: "*.unique.app"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP

# Do not set UNIQUE_AUTH_USER_ID or UNIQUE_AUTH_COMPANY_ID in production.
# Those are local unauthenticated-dev fallbacks. Identity comes from OIDC / _meta.
