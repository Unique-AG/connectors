[project]
name = "with-intelligence-mcp"
version = "0.2.0"
description = "With Intelligence FastMCP server with OAuth credential bridging"
requires-python = ">=3.14"
dependencies = [
    "fastmcp==4.1.4",
    "uvicorn[standard]==0.54.0",
    "pydantic[email]==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-prometheus==0.66b1",
    "opentelemetry-instrumentation-asgi==0.66b1",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "cryptography==50.0.2",
    "jinja2==3.1.6",
    "markdownify==1.2.3",
    "tenacity==9.2.1",
    "typing-extensions==4.16.0",
    "unique-mcp==2026.44.2",
    "starlette==1.10.0",
    "mcp==2.3.0",
    "mcp-credential-auth==0.1.0",
]

[project.scripts]
with-intelligence-mcp = "with_intelligence_mcp.main:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/with_intelligence_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/with_intelligence_mcp" = "with_intelligence_mcp"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "hatchling==1.33.0",
    "ruff==0.17.3",
    "basedpyright==1.40.2",
    "respx==0.23.1",
    "testcontainers[postgres]==4.15.0",
    "poethepoet==0.49.0",
]

[tool.poe.tasks]
# Run from the service's folder: uv run poe <task>
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
fix = ["format", "lint-fix", "format"]
typecheck = "basedpyright"
test = "pytest"
ci = { cmd = "bash ../../scripts/check-python-service.sh .", help = "every check CI runs, in its order" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning:testcontainers"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv"]

[tool.ruff.lint]
# ANN: requires type annotations on function arguments (ANN001-003) and return
# values (ANN2xx) — enforced everywhere, not just public functions.
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastmcp.dependencies.Depends"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "all"
include = ["src", "tests", "agentic/skills/with-intelligence-api/scripts"]
extraPaths = ["src", "."]
reportUnusedCallResult = false
reportMissingTypeStubs = false
reportUnusedFunction = false
reportCallInDefaultInitializer = false

[tool.uv.sources]
mcp-credential-auth = { path = "../../packages/mcp-credential-auth" }
