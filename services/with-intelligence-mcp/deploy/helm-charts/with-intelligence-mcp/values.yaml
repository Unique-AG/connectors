nameOverride: with-intelligence-mcp
fullnameOverride: with-intelligence-mcp
selectorComponentLabel: server

podLabels:
  logging.unique.app/format: pino-json

env:
  APP_ENV: production
  LOG_LEVEL: info
  PORT: "8000"
  WITH_INTELLIGENCE_ASSET_CLASS_GROUPS: '["hfm"]'
  # CA the database certificate is verified against, mounted from pg-cluster-ca below. When the
  # file is absent (no CloudNativePG cluster), the system trust store is used instead.
  DB_SSL_ROOT_CERT: /etc/postgresql-ca/ca.crt

# Overlay secrets: WITH_INTELLIGENCE_MCP_ENCRYPTION_KEY, PUBLIC_BASE_URL, and DB_URL unless postgresql.enabled injects DATABASE_URL.
envVars: []

image:
  registry: ghcr.io
  repository: unique-ag/connectors/services/with-intelligence-mcp
  tag: 0.2.1 # x-release-please-version
  pullPolicy: IfNotPresent

ports:
  application: 8000

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 25m
    memory: 256Mi

probes:
  enabled: true
  # /health is process-up; /ready checks Postgres. Liveness must not restart the pod
  # when the database is briefly unreachable.
  liveness:
    failureThreshold: 6
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    failureThreshold: 6
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    failureThreshold: 30
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  enabled: true

# Base chart defaults to readOnlyRootFilesystem: true.
# pg-cluster-ca: CloudNativePG CA for the server and migration Job; optional for managed Postgres.
# An overlay that sets volumes or volumeMounts replaces these lists and must repeat it.
volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi
  - name: pg-cluster-ca
    secret:
      secretName: with-intelligence-mcp-pg-cluster-ca
      optional: true
      items:
        - key: ca.crt
          path: ca.crt

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: pg-cluster-ca
    mountPath: /etc/postgresql-ca
    readOnly: true

postgresql:
  enabled: true
  connection:
    sslMode: verify

rabbitmq:
  enabled: false

service:
  port: 80

internalServices:
  dependents:
    ingressGateway:
      name: gateway
      namespace: system

routes:
  hostname: ""
  auth:
    jwt: false

hooks:
  migration:
    enabled: true
    command: |
      alembic upgrade head

networkPolicy:
  enabled: false
  flavor: cilium
  enableDefaultDeny:
    ingress: true
    egress: true
  baseline:
    prometheus:
      namespace: system
    ephemeralPorts:
      enabled: false
