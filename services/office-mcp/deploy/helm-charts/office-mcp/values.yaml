# office-mcp chart defaults — portable app only.
# Unique hostname / TLS / NP-on live in the monorepo Argo overlay (Gateway API routes).
# Third parties: helm install + expose however they want (LB, Ingress controller, Mesh…).

nameOverride: office-mcp
fullnameOverride: office-mcp
selectorComponentLabel: server

# Loki scrapes use this label to parse stderr as pino-json
# (unique_mcp.configure_logging).
podLabels:
  logging.unique.app/format: pino-json

env:
  APP_ENV: production
  LOG_LEVEL: info
  PORT: "8000"
  # PUBLIC_BASE_URL must be the externally-reachable OAuth issuer URL (set in overlay).
  # ENTRA_TENANT_ID and ENTRA_CLIENT_ID identify the app registration users sign in through;
  # both are required and set in the overlay (not secrets). ENTRA_TENANT_ID must be a single
  # tenant's ID — a multi-tenant authority is rejected at startup.

envVars: []
# Required secrets (provide via envVars in overlay):
# - DB_URL (or rely on base-chart DATABASE_URL when postgresql.enabled — app accepts both)
# - ENTRA_CLIENT_SECRET, the app registration's client secret. Also the key material for the
#   OAuth state rows in Postgres, so rotating it costs every signed-in user one re-login.

image:
  registry: ghcr.io
  repository: unique-ag/connectors/services/office-mcp
  tag: 0.1.0 # x-release-please-version
  pullPolicy: IfNotPresent

ports:
  application: 8000

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 128Mi

probes:
  enabled: true
  # /health is process-up (setup_ops); /ready checks Postgres. Liveness must not restart the pod
  # when the database is briefly unreachable — readiness alone keeps it out of service.
  liveness:
    failureThreshold: 6
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    failureThreshold: 6
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    failureThreshold: 30
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  enabled: true

# Writable /tmp — base chart defaults to readOnlyRootFilesystem: true.
volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi

volumeMounts:
  - name: tmp
    mountPath: /tmp

postgresql:
  enabled: true
  connection:
    sslMode: verify
    # Overlay supplies host/url (CloudNativePG or external). Base chart injects
    # DATABASE_URL / POSTGRESQL_* — office-mcp also accepts DB_URL.

rabbitmq:
  enabled: false

service:
  port: 80

# Who may call this service (used by base NetworkPolicy generators).
internalServices:
  dependents:
    ingressGateway:
      name: gateway
      namespace: system

# Gateway API (HTTPRoute) via base chart — off until overlay sets hostname + paths.
routes:
  hostname: ""
  auth:
    jwt: false

# No migration hook: this service has no schema of its own. Its one table (`oauth_kv`) is created
# by the OAuth state store on first use, so the app's database user needs CREATE on its schema.

# NetworkPolicy stub (off). Unique QA overlay sets enabled: true.
networkPolicy:
  enabled: false
  flavor: cilium
  enableDefaultDeny:
    ingress: true
    egress: true
  baseline:
    prometheus:
      enabled: false
    ephemeralPorts:
      enabled: false
