# mcp-scaffold-commit: f07e25a209f4, timestamp: 2026-11-09T11:34:03+00:00
# polixis-mcp chart defaults — portable app only.
# Unique hostname / TLS / NP-on live in the monorepo Argo overlay (Gateway API routes).
# Third parties: helm install + expose however they want (LB, Ingress controller, Mesh…).

nameOverride: polixis-mcp
fullnameOverride: polixis-mcp
selectorComponentLabel: server

# Loki scrapes use this label to parse stderr as pino-json (mcp_observability.configure_logging).
podLabels:
  logging.unique.app/format: pino-json

# Per-deployment, non-secret settings, mapped to environment variables on the app container. A
# field renders only when set, so an empty or null one keeps the app default. Set here, a
# variable wins over the same one under env. Secrets stay in envVars.
mcpConfig:
  enabled: true
  server:
    # MCP_BASE_URL, the public https origin, matching routes.hostname.
    baseUrl: ""
  zitadel:
    # ZITADEL_BASE_URL, the issuer users sign in with.
    baseUrl: ""
    # ZITADEL_ORG_ID. Restricts sign-in to one organisation.
    orgId: ""
  polixis:
    # UPSTREAM_API_URL. App default: https://api-polixis.polixis.com
    apiUrl: ""
    # UPSTREAM_TOKEN_URL. App default: Polixis's production Keycloak realm.
    tokenUrl: ""
    # UPSTREAM_TIMEOUT_SECONDS. App default: 30.
    timeoutSeconds: null
    # UPSTREAM_MAX_CONCURRENT_REQUESTS, per process. App default: 4.
    maxConcurrentRequests: null
    # UPSTREAM_QUOTA_COOLDOWN_SECONDS. How long a process stops calling Polixis after it answers
    # that the API request limit is exceeded. App default: 900.
    quotaCooldownSeconds: null
    retry:
      # UPSTREAM_RETRY_ENABLED. false sends every request once: a throttled (429) or unavailable
      # (503) answer fails the call. An exceeded request limit is never retried.
      enabled: true
      # UPSTREAM_RETRY_MAX_ATTEMPTS, the first attempt included. App default: 5.
      maxAttempts: null
      # UPSTREAM_RETRY_MAX_WAIT_SECONDS. App default: 30.
      maxWaitSeconds: null
  rateLimit:
    # MCP_RATE_LIMIT_TOOL_CALLS_PER_WINDOW. Tool calls one user may make per window, counted in
    # each replica.
    toolCallsPerWindow: 20
    # MCP_RATE_LIMIT_WINDOW_SECONDS.
    windowSeconds: 60
  logging:
    # LOG_LEVEL, the level of polixis-mcp's own loggers.
    level: info
    # LIBRARY_LOG_LEVELS, rendered as JSON. Logger name to level, over the app's defaults, e.g.
    # {httpx: INFO}. A library not named logs at INFO.
    libraryLevels: {}
    # LOGS_DIAGNOSTICS_DATA_POLICY. conceal: identifying strings in logs become hmac-sha256:<hex>.
    # disclose: the original, for debugging.
    diagnosticsDataPolicy: conceal
    # ERROR_DETAILS_POLICY. redact: exception messages and stack text stay out of logs and spans.
    # disclose: all, for debugging.
    errorDetailsPolicy: redact

env:
  HOST: "0.0.0.0"
  PORT: "8000"
  # The CloudNativePG CA, mounted below. Without it, the system trust store verifies.
  DB_SSL_ROOT_CERT: /etc/postgresql-ca/ca.crt

# Set per deployment in the overlay. The app refuses to start without them.
# - mcpConfig.server.baseUrl and mcpConfig.zitadel.baseUrl
# - every secret in .env.example, from a secret through envVars: UPSTREAM_CLIENT_ID,
#   UPSTREAM_CLIENT_SECRET, UPSTREAM_API_KEY, ZITADEL_CLIENT_ID, ZITADEL_CLIENT_SECRET,
#   ZITADEL_JWT_SIGNING_KEY
envVars: []

image:
  registry: ghcr.io
  repository: unique-ag/connectors/services/polixis-mcp
  tag: 0.0.0 # x-release-please-version
  pullPolicy: IfNotPresent

ports:
  application: 8000

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

probes:
  enabled: true
  liveness:
    failureThreshold: 6
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    failureThreshold: 6
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    failureThreshold: 30
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  enabled: true

# Writable /tmp — base chart defaults to readOnlyRootFilesystem: true.
volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi
  # Optional for a managed Postgres. An overlay that sets volumes repeats it.
  - name: pg-cluster-ca
    secret:
      secretName: polixis-mcp-pg-cluster-ca
      optional: true
      items:
        - key: ca.crt
          path: ca.crt

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: pg-cluster-ca
    mountPath: /etc/postgresql-ca
    readOnly: true

postgresql:
  enabled: true
  connection:
    sslMode: verify
    # The overlay supplies the host or URL. The base chart injects DATABASE_URL and
    # PG_DATABASE_SSL_MODE, which mcp_configs.PostgresSettings reads.

rabbitmq:
  enabled: false

service:
  port: 80

# Who may call this service (used by base NetworkPolicy generators).
internalServices:
  dependents:
    ingressGateway:
      name: gateway
      namespace: system

# Gateway API (HTTPRoute) via base chart — off until overlay sets hostname + paths.
# Unique QA example overlay:
#   routes:
#     hostname: polixis-mcp.mcp.qa.unique.app
#     auth:
#       jwt: false
#     paths:
#       default:
#         enabled: true
#       probe:
#         enabled: true
routes:
  hostname: ""
  auth:
    jwt: false

hooks:
  migration:
    enabled: false

# NetworkPolicy stub (off). Unique QA overlay sets enabled: true.
# Kong ingress allow is generated from internalServices.dependents.ingressGateway.
networkPolicy:
  enabled: false
  flavor: cilium
  enableDefaultDeny:
    ingress: true
    egress: true
  baseline:
    prometheus:
      enabled: false
    ephemeralPorts:
      enabled: false
