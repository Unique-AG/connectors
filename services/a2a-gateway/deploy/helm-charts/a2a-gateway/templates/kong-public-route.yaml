{{- if .Values.kong.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "a2a-gateway.fullname" . }}-public
spec:
  parentRefs: {{ .Values.kong.parentRefs | toYaml | nindent 4 }}
  hostnames: {{ .Values.kong.hostnames | toYaml | nindent 4 }}
  rules:
    - matches:
        - method: GET
          path:
            type: RegularExpression
            value: '^/a2a/agents/pub_[0-9a-z]+/\.well-known/agent-card\.json$'
        - method: GET
          path:
            type: Exact
            value: /.well-known/oauth-protected-resource/a2a
      backendRefs:
        - name: {{ include "a2a-gateway.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
