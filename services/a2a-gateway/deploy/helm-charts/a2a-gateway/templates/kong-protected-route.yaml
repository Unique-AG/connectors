{{- if .Values.kong.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "a2a-gateway.fullname" . }}-protected
  annotations:
    konghq.com/plugins: {{ include "a2a-gateway.fullname" . }}-auth
spec:
  parentRefs: {{ required "kong.parentRefs is required" .Values.kong.parentRefs | toYaml | nindent 4 }}
  hostnames: {{ required "kong.hostnames is required" .Values.kong.hostnames | toYaml | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /a2a}
        - path: {type: PathPrefix, value: /management}
      backendRefs:
        - name: {{ include "a2a-gateway.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
