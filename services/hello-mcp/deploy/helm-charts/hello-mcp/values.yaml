# hello-mcp chart defaults — portable app only.
# Unique hostname / TLS / NP-on live in the monorepo Argo overlay.
# Third parties: helm install + expose however they want (LB, Ingress, Mesh…).

nameOverride: hello-mcp
fullnameOverride: hello-mcp
selectorComponentLabel: server

env:
  LOG_LEVEL: info

envVars: []

image:
  registry: ghcr.io
  repository: unique-ag/connectors/services/hello-mcp
  tag: 0.0.1 # x-release-please-version
  pullPolicy: IfNotPresent

ports:
  application: 8000

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

probes:
  enabled: true
  liveness:
    failureThreshold: 6
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    failureThreshold: 6
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    failureThreshold: 30
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  enabled: true

postgresql:
  enabled: false

rabbitmq:
  enabled: false

service:
  port: 80

# Who may call this service (used by base NetworkPolicy generators).
# Overlay Unique keeps this; third parties can drop/override.
internalServices:
  dependents:
    ingressGateway:
      name: gateway
      namespace: system

# Gateway API (HTTPRoute) — off by default. Unique overlay sets hostname + paths.
routes:
  hostname: ""

# Optional classic Ingress — off by default (customers / legacy MCP wildcard cases).
ingress:
  enabled: false
  ingressClassName: kong
  hosts: []
  tls: []

hooks:
  migration:
    enabled: false

# NetworkPolicy stub (off). Unique QA overlay sets enabled: true.
# Shape mirrors monorepo mcp/hello network-policy.values.yaml.
networkPolicy:
  enabled: false
  flavor: cilium
  enableDefaultDeny:
    ingress: true
    egress: true
  baseline:
    prometheus:
      enabled: false
    ephemeralPorts:
      enabled: false
  ingress:
    # kubelet probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Kong gateway (also covered via internalServices.dependents.ingressGateway)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": system
            "k8s:app.kubernetes.io/name": gateway
            "k8s:app.kubernetes.io/instance": kong
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
