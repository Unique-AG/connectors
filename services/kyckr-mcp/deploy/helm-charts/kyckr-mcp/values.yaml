# mcp-scaffold-commit: 6474bb8667dc, timestamp: 2026-11-16T10:36:30+00:00
# kyckr-mcp chart defaults — portable app only.
# Unique hostname / TLS / NP-on live in the monorepo Argo overlay (Gateway API routes).
# Third parties: helm install + expose however they want (LB, Ingress controller, Mesh…).

nameOverride: kyckr-mcp
fullnameOverride: kyckr-mcp
selectorComponentLabel: server

# Loki scrapes use this label to parse stderr as pino-json (mcp_observability.configure_logging).
podLabels:
  logging.unique.app/format: pino-json

env:
  HOST: "0.0.0.0"
  LOG_LEVEL: info
  LOGS_DIAGNOSTICS_DATA_POLICY: conceal
  # The CloudNativePG CA, mounted below. Without it, the system trust store verifies.
  DB_SSL_ROOT_CERT: /etc/postgresql-ca/ca.crt
  # zitadel is the default and needs mcpConfig.zitadel and the secrets (see README) to start.
  # none serves without sign-in, on loopback only: HOST must then be a loopback address, not 0.0.0.0.
  MCP_AUTH_MODE: zitadel

# One replica: the rate limit counts per replica, and replicas that start together on an empty
# database race to create the sign-in table (one pod restarts once).
replicaCount: 1

# Restarts the pods when a secret they read changes, so a rotated Kyckr key takes effect.
deployment:
  metadata:
    annotations:
      reloader.stakater.com/auto: "true"

# Non-secret settings, mapped to environment variables. The app refuses to start without
# publicBaseUrl and zitadel.baseUrl, so the overlay sets them. Unset values use the app default.
mcpConfig:
  app:
    publicBaseUrl: "" # MCP_BASE_URL, e.g. https://kyckr-mcp.<tenant>.unique.app. Must match routes.hostname
  zitadel:
    baseUrl: "" # ZITADEL_BASE_URL, e.g. https://id.<tenant>.unique.app
    # ZITADEL_ORG_ID, optional. Verify in Zitadel that the id token carries the resourceowner
    # claim, or every sign-in is refused.
    orgId: ""
  kyckr:
    # UPSTREAM_API_URL. The test API, so the egress rule has a host. Production is https://api.kyckr.com/v2
    apiUrl: https://test-api.kyckr.com/v2
    defaultCustomerReference: ""
    defaultContactEmail: ""
  # Per signed-in user and per replica: N replicas allow N times toolCallsPerWindow.
  rateLimit: {}

# Secrets stay out of mcpConfig: set extraEnvSecrets (or envVars) with UPSTREAM_API_KEY,
# ZITADEL_CLIENT_ID, ZITADEL_JWT_SIGNING_KEY and, if needed, ZITADEL_CLIENT_SECRET. See README.
envVars: []

image:
  registry: ghcr.io
  repository: unique-ag/connectors/services/kyckr-mcp
  tag: 0.1.1-alpha # x-release-please-version
  pullPolicy: IfNotPresent

ports:
  application: 8000

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

probes:
  enabled: true
  liveness:
    failureThreshold: 6
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    failureThreshold: 6
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    failureThreshold: 30
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  enabled: true

# Writable /tmp — base chart defaults to readOnlyRootFilesystem: true.
volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi
  # Optional for a managed Postgres. An overlay that sets volumes repeats it.
  - name: pg-cluster-ca
    secret:
      secretName: kyckr-mcp-pg-cluster-ca
      optional: true
      items:
        - key: ca.crt
          path: ca.crt

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: pg-cluster-ca
    mountPath: /etc/postgresql-ca
    readOnly: true

postgresql:
  enabled: true
  connection:
    sslMode: verify
    # The overlay supplies the host or URL. The base chart injects DATABASE_URL and
    # PG_DATABASE_SSL_MODE, which mcp_configs.PostgresSettings reads.

rabbitmq:
  enabled: false

service:
  port: 80

# Who may call this service (used by base NetworkPolicy generators).
internalServices:
  dependents:
    ingressGateway:
      name: gateway
      namespace: system

# Gateway API (HTTPRoute) via base chart — off until overlay sets hostname + paths.
# Unique QA example overlay:
#   routes:
#     hostname: kyckr-mcp.mcp.qa.unique.app
#     auth:
#       jwt: false
#     paths:
#       default:
#         enabled: true
#       probe:
#         enabled: true
routes:
  hostname: ""
  auth:
    jwt: false

# NetworkPolicy stub (off). Unique QA overlay sets enabled: true.
# connection.url hides the Postgres host, so no Postgres egress renders: set connection.host, or
# postgresql.networkPolicyEgressManaged: true plus a networkPolicy.egress[] rule.
networkPolicy:
  enabled: false
  flavor: cilium
  enableDefaultDeny:
    ingress: true
    egress: true
  baseline:
    prometheus:
      enabled: false
    ephemeralPorts:
      enabled: false
