[project]
name = "hello-mcp"
version = "0.0.1"
description = "Minimal no-auth FastMCP Hello World server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0,<4",
]

[project.scripts]
hello-mcp = "hello_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/hello_mcp" = "hello_mcp"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
