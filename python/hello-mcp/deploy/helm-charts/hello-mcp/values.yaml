# Defaults for hello-mcp. Environment-specific bits (DNS host, TLS, NP, secrets)
# belong in the monorepo Argo overlay — Helm merges them over these values.

nameOverride: hello-mcp
fullnameOverride: hello-mcp
selectorComponentLabel: server

env:
  LOG_LEVEL: info

envVars: []

image:
  registry: ghcr.io
  repository: unique-ag/connectors/python/hello-mcp
  tag: 0.0.1 # x-release-please-version
  pullPolicy: IfNotPresent

ports:
  application: 8000

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

probes:
  enabled: true
  liveness:
    failureThreshold: 6
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    failureThreshold: 6
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    failureThreshold: 30
    httpGet:
      path: /probe
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  enabled: true

postgresql:
  enabled: false

rabbitmq:
  enabled: false

service:
  port: 80

# Prefer custom ingress.yaml over base HTTPRoute for MCP hostnames.
routes:
  hostname: ""

ingress:
  enabled: false
  ingressClassName: kong
  hosts: []
  tls: []

hooks:
  migration:
    enabled: false

networkPolicy:
  enabled: false
