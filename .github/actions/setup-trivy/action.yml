name: Setup Trivy
description: Install Trivy. If the download fails, wait and install a second time.

runs:
  using: composite
  steps:
    - id: first
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      continue-on-error: true
      with:
        version: v0.70.0 # keep equal to the default of aquasecurity/trivy-action
        cache: true

    - if: steps.first.outcome == 'failure'
      shell: bash
      run: sleep 30

    - if: steps.first.outcome == 'failure'
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      with:
        version: v0.70.0 # keep equal to the default of aquasecurity/trivy-action
        cache: true
