name: Release gate
description: >
  Fail a release pull request while its image has a fixable critical or high
  vulnerability, unless security-exception is set and a comment approves the head commit.

inputs:
  trivy_report:
    description: Path to the Trivy JSON report of the image
    required: true
  github_token:
    description: Workflow token with pull-requests read permission
    required: true
  security_exception_label:
    description: PR label that records an accepted exception
    required: false
    default: security-exception

runs:
  using: composite
  steps:
    - name: Check live pull request labels
      id: security-exception
      uses: ./.github/actions/pull-request-labels
      with:
        github_token: ${{ inputs.github_token }}
        label: ${{ inputs.security_exception_label }}
    - name: Evaluate release gate
      shell: bash
      env:
        TRIVY_REPORT_PATH: ${{ inputs.trivy_report }}
        HAS_LABEL: ${{ steps.security-exception.outputs.has_label }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: node "${{ github.action_path }}/run.mjs"
