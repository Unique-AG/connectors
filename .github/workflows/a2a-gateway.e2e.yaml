name: "A2A Gateway e2e"

# Runs the official A2A 1.0 TCK and the security boundary e2e tests against the gateway backed by
# a stub core. Unit and contract tests run in services-ci.yaml.
on:
  pull_request:
    paths:
      - "services/a2a-gateway/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/a2a-gateway.e2e.yaml"
  workflow_dispatch:

concurrency:
  group: a2a-gateway-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a2a-gateway
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine@sha256:9a5494b32def2c288a755c933ea2ffd7f4a28647f7648776ad8b15507493f702
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/a2a-gateway
      AMQP_URL: amqp://guest:guest@localhost:5672
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @unique-ag/a2a-gateway...

      - name: Build
        working-directory: services/a2a-gateway
        run: pnpm build

      - name: Run TCK
        working-directory: services/a2a-gateway
        run: ./test/tck/run-tck.sh

      # Reuses the database the TCK run migrated and initialised.
      - name: Run security e2e tests
        if: success() || failure()
        working-directory: services/a2a-gateway
        env:
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
          E2E_AMQP_URL: ${{ env.AMQP_URL }}
        run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: a2a-tck-reports
          path: services/a2a-gateway/test/tck/reports/
