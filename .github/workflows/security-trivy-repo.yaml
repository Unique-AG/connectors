name: "[Security] Trivy Repository Scan"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "services/*/deploy/**"
      - "**/*docker-compose*.yaml"
      - ".github/workflows/security-trivy-repo.yaml"
  push:
    branches:
      - main

permissions:
  contents: read # to read the repository

concurrency:
  group: security-trivy-repo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy-config:
    name: Misconfiguration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # to read the repository
      security-events: write # to upload the results to code scanning
    env:
      TRIVY_DISABLE_VEX_NOTICE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"
          timeout: 10m
          cache: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy-config.sarif') != ''
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
