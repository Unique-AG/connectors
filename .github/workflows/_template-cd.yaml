name: "[Template] CD"

on:
  workflow_call:
    inputs:
      service-name:
        description: "Name of the service (e.g., outlook-semantic-mcp,teams-mcp)"
        required: true
        type: string
      service-version:
        description: "Version of the package (e.g., 1.2.0)"
        required: true
        type: string
      ref:
        description: "Git ref to build from (default: the ref that started the workflow)"
        required: false
        default: ""
        type: string
      publish-docs:
        description: "Publish the docs of the service to Confluence"
        required: false
        default: true
        type: boolean

jobs:
  containerize:
    concurrency:
      group: release-${{ inputs.service-name }}-${{ inputs.service-version }}
      cancel-in-progress: false
    permissions:
      contents: read # to read the repository
      packages: write # to push the image and the charts to GHCR
      id-token: write # to sign in to Azure and to sign the image with OIDC
    outputs:
      digest: ${{ steps.existing.outputs.digest || steps.build-and-push.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GHCR_REGISTRY: ghcr.io
      GHCR_REPO: unique-ag/connectors/services/${{ inputs.service-name }}
      GHCR_CHART_REPO: unique-ag/connectors/helm
      UNIQUECR_REGISTRY: uniquecr.azurecr.io
      UNIQUECR_REPO: connectors/services/${{ inputs.service-name }}
      UNIQUECR_CHART_REPO: connectors/helm
      GETUNIQUE_REGISTRY: getunique.azurecr.io
      GETUNIQUE_CHART_REPO: helm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Add docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}
            ${{ env.UNIQUECR_REGISTRY }}/${{ env.UNIQUECR_REPO }}
          tags: |
            type=raw,value=${{ inputs.service-version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Azure as uniquecr token issuer (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: 46c63b6f-67ac-476a-9d5d-6db2d18743bb # acr_oidc uniquecr_push
          tenant-id: 99330c76-81d2-460e-861e-35af8e2a4266
          subscription-id: fb8bce09-908a-459f-b200-a578005bfeb2

      - name: Get ACR access token
        id: acr-token
        run: |
          TOKEN=$(az acr login --name uniquecr --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.UNIQUECR_REGISTRY }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr-token.outputs.token }}

      - name: Login to Azure as getunique token issuer (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: daa88f8d-0943-459c-890a-17b1a018d11e # acr_oidc getunique_push
          tenant-id: 99330c76-81d2-460e-861e-35af8e2a4266
          subscription-id: fb8bce09-908a-459f-b200-a578005bfeb2

      - name: Get getunique ACR access token
        id: acr-token-getunique
        run: |
          TOKEN=$(az acr login --name getunique --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Login to helm registries
        env:
          UNIQUECR_TOKEN: ${{ steps.acr-token.outputs.token }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GETUNIQUE_TOKEN: ${{ steps.acr-token-getunique.outputs.token }}
        run: |
          echo "$UNIQUECR_TOKEN" | helm registry login "$UNIQUECR_REGISTRY" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          echo "$GHCR_TOKEN" | helm registry login "$GHCR_REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          echo "$GETUNIQUE_TOKEN" | helm registry login "$GETUNIQUE_REGISTRY" --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Look for an existing image
        id: existing
        env:
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}:${{ inputs.service-version }}
          UNIQUECR_IMAGE: ${{ env.UNIQUECR_REGISTRY }}/${{ env.UNIQUECR_REPO }}:${{ inputs.service-version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          digest_of() {
            local output error
            error=$(mktemp)
            if output=$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>"$error"); then
              echo "$output"
            elif grep -qiE 'not found|NAME_UNKNOWN|MANIFEST_UNKNOWN|404' "$error"; then
              echo ""
            else
              echo "::error::Could not look up $1: $(cat "$error")" >&2
              return 1
            fi
          }
          ghcr_digest=$(digest_of "$GHCR_IMAGE")
          uniquecr_digest=$(digest_of "$UNIQUECR_IMAGE")
          if [ -z "$ghcr_digest" ] && [ -z "$uniquecr_digest" ]; then
            echo "No image for this version yet. The next step builds it."
            exit 0
          fi
          if [ -n "$ghcr_digest" ] && [ -n "$uniquecr_digest" ] && [ "$ghcr_digest" != "$uniquecr_digest" ]; then
            echo "::error::The registries hold different images for this version. GHCR: $ghcr_digest. uniquecr: $uniquecr_digest. Delete one tag by hand. This workflow never overwrites a released tag."
            exit 1
          fi
          # The label does not prove who built the image. It stops a reuse of an image from another commit.
          if [ -n "$ghcr_digest" ]; then
            existing_ref="$GHCR_REGISTRY/$GHCR_REPO@$ghcr_digest"
          else
            existing_ref="$UNIQUECR_REGISTRY/$UNIQUECR_REPO@$uniquecr_digest"
          fi
          image_config=$(docker buildx imagetools inspect "$existing_ref" --format '{{json .Image}}')
          revision=$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<< "$image_config")
          if [ "$revision" != "$SOURCE_SHA" ]; then
            echo "::error::The existing image for this version comes from ${revision:-an unknown commit}, not from the commit $SOURCE_SHA of the release tag. This workflow does not reuse or sign it. If the image is wrong, delete the tag by hand."
            exit 1
          fi
          if [ -z "$uniquecr_digest" ]; then
            echo "::notice::Only GHCR has this version. Copying the image to uniquecr."
            docker buildx imagetools create --tag "$UNIQUECR_IMAGE" "$GHCR_REGISTRY/$GHCR_REPO@$ghcr_digest"
            digest=$ghcr_digest
          elif [ -z "$ghcr_digest" ]; then
            echo "::notice::Only uniquecr has this version. Copying the image to GHCR."
            docker buildx imagetools create --tag "$GHCR_IMAGE" "$UNIQUECR_REGISTRY/$UNIQUECR_REPO@$uniquecr_digest"
            digest=$uniquecr_digest
          else
            digest=$ghcr_digest
          fi
          echo "::notice::The image for this version exists ($digest). This run reuses it and does not build again."
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build and push container
        id: build-and-push
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ inputs.service-name }}/deploy/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          no-cache-filters: runtime,runner
          cache-from: |
            type=gha,scope=${{ inputs.service-name }}
            type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}:cache
          cache-to: |
            type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}:cache,mode=min

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify the images with GitHub OIDC Token
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              images+=("${tag}@${DIGEST}")
            fi
          done <<< "$TAGS"
          cosign sign --yes "${images[@]}"
          cosign verify "${images[@]}" \
            --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/.*@refs/heads/main$" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Push Helm charts
        env:
          DESTINATION: /tmp
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          deno run \
            --allow-run \
            --allow-read \
            --allow-write="$DESTINATION" \
            scripts/helm-package-push.ts \
            --chart "services/$SERVICE_NAME/deploy/helm-charts/$SERVICE_NAME" \
            --destination "$DESTINATION" \
            --registry "oci://$UNIQUECR_REGISTRY/$UNIQUECR_CHART_REPO" \
            --registry "oci://$GHCR_REGISTRY/$GHCR_CHART_REPO" \
            --registry "oci://$GETUNIQUE_REGISTRY/$GETUNIQUE_CHART_REPO"

  security-trivy-image-scan:
    needs: containerize
    permissions:
      contents: read # to read the repository
      packages: read # to pull the image from GHCR
      security-events: write # to upload the results to code scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GHCR_REGISTRY: ghcr.io
      GHCR_REPO: unique-ag/connectors/services/${{ inputs.service-name }}
      TRIVY_DISABLE_VEX_NOTICE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/trivy-templates
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}@${{ needs.containerize.outputs.digest }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          timeout: 15m
          cache: true

      - name: Convert Trivy results to SARIF
        if: always() && hashFiles('trivy-results.json') != ''
        run: trivy convert --format sarif trivy-results.json -o trivy-image-scan-results.sarif

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-image-scan-results.sarif') != ''
        with:
          sarif_file: trivy-image-scan-results.sarif
          category: trivy-image/${{ inputs.service-name }}

      - name: Write Trivy summary
        if: always() && hashFiles('trivy-results.json') != ''
        run: |
          trivy convert --format template \
            --template @.github/trivy-templates/image-summary-markdown.tpl \
            trivy-results.json > trivy-report.md || true
          if [ -s trivy-report.md ]; then
            cat trivy-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  security-trivy-license-scan:
    needs: containerize
    permissions:
      contents: read # to read the repository
      packages: read # to pull the image from GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GHCR_REGISTRY: ghcr.io
      GHCR_REPO: unique-ag/connectors/services/${{ inputs.service-name }}
      TRIVY_DISABLE_VEX_NOTICE: "true"
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}@${{ needs.containerize.outputs.digest }}
          scanners: license
          format: json
          output: trivy-license.json
          severity: UNKNOWN,HIGH,CRITICAL
          exit-code: "0"
          timeout: 15m
          cache: true

      - name: Write license summary
        if: always() && hashFiles('trivy-license.json') != ''
        run: |
          jq -r '
            [.Results[]?.Licenses[]?]
            | group_by([.Severity, .Name])
            | map({severity: .[0].Severity, license: (.[0].Name | gsub("[|\n]"; " ")), packages: length})
            | sort_by(.severity, .license)
            | ["| Severity | License | Packages |", "| --- | --- | --- |"] + map("| \(.severity) | \(.license) | \(.packages) |")
            | .[]
          ' trivy-license.json >> "$GITHUB_STEP_SUMMARY"

  publish-docs:
    if: inputs.publish-docs
    permissions:
      contents: read # to let the called workflow read the repository
    uses: ./.github/workflows/_template-docs-confluence.yaml
    secrets: inherit
    with:
      docs-path: services/${{ inputs.service-name }}/docs
