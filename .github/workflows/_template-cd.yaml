name: "[TEMPLATE] CD"

on:
  workflow_call:
    inputs:
      service-name:
        description: "Name of the service (e.g., outlook-semantic-mcp,teams-mcp)"
        required: true
        type: string
      service-version:
        description: "Version of the package (e.g., 1.2.0)"
        required: true
        type: string
      dockerfile:
        description: "Path to a specific Dockerfile (e.g., services/outlook-semantic-mcp/deploy/Dockerfile)"
        default: "./Dockerfile"
        type: string
      docs-path:
        description: "Path to the docs directory relative to repo root (optional)"
        required: false
        type: string

jobs:
  # Build and push container to registry
  containerize:
    permissions:
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GHCR_REGISTRY: ghcr.io
      GHCR_REPO: unique-ag/connectors/services/${{ inputs.service-name }}
      GHCR_CHART_REPO: unique-ag/connectors/helm
      UNIQUECR_REGISTRY: uniquecr.azurecr.io
      UNIQUECR_REPO: connectors/services/${{ inputs.service-name }}
      UNIQUECR_CHART_REPO: connectors/helm
      GETUNIQUE_REGISTRY: getunique.azurecr.io
      GETUNIQUE_CHART_REPO: helm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Add docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}
            ${{ env.UNIQUECR_REGISTRY }}/${{ env.UNIQUECR_REPO }}
          tags: |
            type=raw,value=${{ inputs.service-version }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Azure as uniquecr token issuer (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # Azure Login Action v3.0.0
        with:
          client-id: 46c63b6f-67ac-476a-9d5d-6db2d18743bb # acr_oidc uniquecr_push
          tenant-id: 99330c76-81d2-460e-861e-35af8e2a4266
          subscription-id: fb8bce09-908a-459f-b200-a578005bfeb2

      - name: Get ACR access token
        id: acr-token
        run: |
          TOKEN=$(az acr login --name uniquecr --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Login to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.UNIQUECR_REGISTRY }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr-token.outputs.token }}

      - name: Login to Azure as getunique token issuer (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: daa88f8d-0943-459c-890a-17b1a018d11e # acr_oidc getunique_push
          tenant-id: 99330c76-81d2-460e-861e-35af8e2a4266
          subscription-id: fb8bce09-908a-459f-b200-a578005bfeb2

      - name: Get getunique ACR access token
        id: acr-token-getunique
        run: |
          TOKEN=$(az acr login --name getunique --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Login to helm registries
        run: |
          echo "${{ steps.acr-token.outputs.token }}" | helm registry login ${{ env.UNIQUECR_REGISTRY }} --username 00000000-0000-0000-0000-000000000000 --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.GHCR_REGISTRY }} --username ${{ github.actor }} --password-stdin
          echo "${{ steps.acr-token-getunique.outputs.token }}" | helm registry login ${{ env.GETUNIQUE_REGISTRY }} --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Build and push container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-and-push
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: |
            type=gha,scope=${{ inputs.service-name }}
            type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}:cache
          cache-to: |
            type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}:cache,mode=min

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify the images with GitHub OIDC Token
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
          cosign verify ${images} \
          --certificate-identity-regexp="^https://github.com/${{ github.repository }}/\.github/workflows/.*@refs/heads/main$" \
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Push Helm charts
        env:
          DESTINATION: /tmp
        run: |
          deno run \
          --allow-run \
          --allow-read \
          --allow-write=${{ env.DESTINATION }} \
          scripts/helm-package-push.ts \
          --chart services/${{ inputs.service-name }}/deploy/helm-charts/${{ inputs.service-name }} \
          --destination ${{ env.DESTINATION }} \
          --registry oci://${{ env.UNIQUECR_REGISTRY }}/${{ env.UNIQUECR_CHART_REPO }} \
          --registry oci://${{ env.GHCR_REGISTRY }}/${{ env.GHCR_CHART_REPO }} \
          --registry oci://${{ env.GETUNIQUE_REGISTRY }}/${{ env.GETUNIQUE_CHART_REPO }}

  publish-docs:
    if: ${{ inputs.docs-path != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_template-docs-confluence.yaml
    with:
      service-name: ${{ inputs.service-name }}
      docs-path: ${{ inputs.docs-path }}
    secrets: inherit
