name: "[TEMPLATE] Containerize"

on:
  workflow_call:
    inputs:
      service-name:
        description: "Name of the service (e.g., sharepoint-connector)"
        required: true
        type: string
      service-path:
        description: "Path to the service directory (e.g., services/sharepoint-connector)"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  containerize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICE_PATH: ${{ inputs.service-path }}
      SERVICE_NAME: ${{ inputs.service-name }}
      GHCR_REPO: ghcr.io/unique-ag/connectors/services/${{ inputs.service-name }}
      GHA_CACHE_SCOPE: ${{ inputs.service-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if Dockerfile exists
        id: check-dockerfile
        run: |
          if [ -f "${{ env.SERVICE_PATH }}/deploy/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tar path
        id: image-tar
        if: steps.check-dockerfile.outputs.exists == 'true'
        shell: bash
        run: echo "path=${RUNNER_TEMP}/${{ inputs.service-name }}.tar" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.check-dockerfile.outputs.exists == 'true'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.check-dockerfile.outputs.exists == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image (no push)
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.SERVICE_PATH }}/deploy/Dockerfile
          platforms: linux/amd64
          push: false
          pull: true
          provenance: false
          tags: ${{ env.GHCR_REPO }}:ci
          cache-from: |
            type=gha,scope=${{ env.GHA_CACHE_SCOPE }}
            type=registry,ref=${{ env.GHCR_REPO }}:cache
          cache-to: type=gha,scope=${{ env.GHA_CACHE_SCOPE }},mode=max,ignore-error=true
          outputs: type=docker,dest=${{ steps.image-tar.outputs.path }}

      - name: Vulnerability gate (CRITICAL)
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: ./.github/actions/container-image-vuln-gate
        with:
          image_tar: ${{ steps.image-tar.outputs.path }}
          severity: CRITICAL
