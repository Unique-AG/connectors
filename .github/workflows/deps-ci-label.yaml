name: "[Deps] CI label"

on:
  workflow_run:
    workflows: ["[CI] Python", "[CI] Services", "[CI] Packages"]
    types: [completed]

permissions:
  contents: read # to read the repository
  pull-requests: write # to add and remove the label on the pull request
  issues: write # to create the labels
  actions: read # to list the workflow runs of the commit

concurrency:
  group: deps-ci-label-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  label:
    name: Label
    if: github.event.workflow_run.event == 'pull_request' && contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Update the labels
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
        run: node .github/scripts/deps-nightly/ci-label.cli.mjs
