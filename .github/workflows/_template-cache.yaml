name: "[Template] Cache Warming"

on:
  workflow_call:
    inputs:
      service-name:
        description: "Name of the service (e.g., sharepoint-connector)"
        required: true
        type: string
      service-path:
        description: "Path to the service directory (e.g., services/sharepoint-connector)"
        required: true
        type: string

permissions:
  contents: read # to read the repository
  packages: read # to log in to GHCR and read the cache image
  actions: read # to read the GitHub Actions cache (cache-from type=gha)

env:
  GHCR_REPO: ghcr.io/unique-ag/connectors/services/${{ inputs.service-name }}
  GHA_CACHE_SCOPE: ${{ inputs.service-name }}

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-warm GHA cache (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ inputs.service-path }}/deploy/Dockerfile
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: |
            type=gha,scope=${{ env.GHA_CACHE_SCOPE }}
            type=registry,ref=${{ env.GHCR_REPO }}:cache
          cache-to: |
            type=gha,scope=${{ env.GHA_CACHE_SCOPE }},mode=max,ignore-error=true
