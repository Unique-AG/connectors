name: "[Deps] Nightly"

on:
  schedule:
    - cron: "0 2 * * *" # every night at 02:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Write the plan to the job summary and open no pull request"
        type: boolean
        default: true

permissions:
  contents: read # to read the repository

concurrency:
  group: deps-nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # to read the repository
      pull-requests: read # to list the open dependency pull requests
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      entries: ${{ steps.plan.outputs.entries }}
      updates: ${{ steps.plan.outputs.updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.33"

      - name: Set up Python
        run: uv python install 3.14

      - name: Run the unit tests of the scripts
        run: node --test .github/scripts/deps-nightly/*.test.mjs

      - name: Decide the mode
        id: mode
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          APP_CLIENT_ID: ${{ vars.DEPS_APP_CLIENT_ID }}
          APP_KEY_SET: ${{ secrets.DEPS_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            mode="plan"
            note="This run is a dry run. It opens no pull request."
          elif [ -z "$APP_CLIENT_ID" ] || [ "$APP_KEY_SET" != "true" ]; then
            mode="plan"
            note="The variable DEPS_APP_CLIENT_ID or the secret DEPS_APP_PRIVATE_KEY is missing. This run opens no pull request."
          else
            mode="pr"
            note="This run opens one pull request for each entry in the first list."
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "PLAN_NOTE=$note" >> "$GITHUB_ENV"

      - name: Restore the tag ledger
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tag-ledger.json
          key: deps-tag-ledger-${{ github.run_id }}
          restore-keys: deps-tag-ledger-

      - name: List the updates
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_LEDGER: ${{ runner.temp }}/tag-ledger.json
          DASHBOARD_FILE: ${{ runner.temp }}/dashboard.md
        run: node .github/scripts/deps-nightly/plan.cli.mjs

      - name: Save the tag ledger
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tag-ledger.json
          key: deps-tag-ledger-${{ github.run_id }}

      - name: Keep the dashboard text
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard
          path: ${{ runner.temp }}/dashboard.md
          retention-days: 1
          if-no-files-found: ignore

  dashboard:
    name: Dashboard
    needs: plan
    if: needs.plan.outputs.mode == 'pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # to keep the dashboard issue
    steps:
      - name: Fetch the dashboard text
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard
          path: ${{ runner.temp }}

      - name: Update the dashboard issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create dependency-dashboard --color 0e8a16 --description "The nightly dependency job keeps this issue" || true
          number=$(gh issue list --label dependency-dashboard --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/dashboard.md"
          else
            gh issue create --title "Dependency dashboard" --label dependency-dashboard --body-file "$RUNNER_TEMP/dashboard.md"
          fi

  update:
    name: Update ${{ matrix.entry.slug }}
    needs: plan
    if: needs.plan.outputs.mode == 'pr' && needs.plan.outputs.updates != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # this job reads no content, the App token does the write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.updates) }}
    steps:
      - name: Create the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Merge main into the branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ matrix.entry.number }}
        run: |
          gh pr update-branch "$NUMBER" || echo "::warning::#$NUMBER does not update from main. A person must resolve the conflict."
          echo "- #$NUMBER: main merged in, because a person pushed a commit to this pull request." >> "$GITHUB_STEP_SUMMARY"

  bump:
    name: Bump ${{ matrix.entry.slug }}
    needs: plan
    if: needs.plan.outputs.mode == 'pr' && needs.plan.outputs.entries != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # to read the repository, this job holds no secret because uv can run package build code
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.entries) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.33"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Terraform
        if: matrix.entry.ecosystem == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Make the update
        id: bump
        env:
          ENTRY: ${{ toJSON(matrix.entry) }}
        run: node .github/scripts/deps-nightly/bump.cli.mjs

      - name: Keep the patch
        if: steps.bump.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-${{ matrix.entry.slug }}
          path: ${{ runner.temp }}/patch
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.entry.slug }}
    needs: [plan, bump]
    if: always() && needs.plan.outputs.mode == 'pr' && needs.plan.outputs.entries != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # to read the repository, the App token does the writes
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.entries) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Fetch the patch
        id: patch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patch-${{ matrix.entry.slug }}
          path: ${{ runner.temp }}/patch

      - name: Check and apply the patch
        if: steps.patch.outcome == 'success'
        env:
          ENTRY: ${{ toJSON(matrix.entry) }}
          PATCH_DIR: ${{ runner.temp }}/patch
        run: node .github/scripts/deps-nightly/publish.cli.mjs

      - name: Create the App token
        id: app-token
        if: steps.patch.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Push the branch and open the pull request
        if: steps.patch.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ matrix.entry.slug }}
          ECOSYSTEM: ${{ matrix.entry.ecosystem }}
          ACTION: ${{ matrix.entry.action }}
          NUMBER: ${{ matrix.entry.number }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="deps/$SLUG"
          title=$(cat "$RUNNER_TEMP/patch/pr-title.txt")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "$title"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force origin "$branch"

          ecosystem_label="$ECOSYSTEM"
          if [ "$ecosystem_label" = actions ]; then ecosystem_label=github-actions; fi
          gh label create dependencies --color 0366d6 --description "Updates to dependencies" || true
          gh label create "$ecosystem_label" --color 6f42c1 --description "Updates to $ecosystem_label packages" || true
          gh label create ai-assisted --color 5319e7 --description "The AI agent handled this pull request" || true
          gh label create human-required --color d93f0b --description "A person must finish this pull request" || true

          if [ "$ACTION" = rebuild ]; then
            gh pr edit "$NUMBER" --title "$title" --body-file "$RUNNER_TEMP/patch/pr-body.md"
            url=$(gh pr view "$NUMBER" --json url --jq .url)
          else
            if [ "$ACTION" = replace ]; then
              gh label create superseded --color ededed --description "The nightly job closed this pull request for a newer version" || true
              gh pr edit "$NUMBER" --add-label superseded
              gh pr close "$NUMBER" --comment "A newer version replaces this update. A new PR follows."
            fi
            url=$(gh pr create --base "$BASE" --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/patch/pr-body.md" --label dependencies --label "$ecosystem_label")
          fi
          echo "- $url" >> "$GITHUB_STEP_SUMMARY"
