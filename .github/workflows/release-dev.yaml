name: "[Release] Dev Build"

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build."
        required: true
        type: choice
        options:
          - backstop-mcp
          - confluence-connector
          - hello-mcp
          - kb-mcp
          - office-365-mcp
          - outlook-semantic-mcp
          - sharepoint-connector
          - teams-mcp
          - with-intelligence-mcp
      ref:
        description: "Branch, tag, or commit to build (for example my-feature-branch)."
        required: true
        type: string

permissions:
  contents: read # to let the called workflow read the repository
  packages: write # to let the called workflow push the image to GHCR
  id-token: write # to let the called workflow sign in to Azure and sign the image
  security-events: write # to let the called workflow declare the scan permission

concurrency:
  group: release-dev-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # to read the repository
    env:
      SERVICE: ${{ inputs.service }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Start from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Start this workflow from main. The image signature check only accepts a workflow from main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve the dev version
        id: version
        run: |
          set -euo pipefail
          chart="services/$SERVICE/deploy/helm-charts/$SERVICE/Chart.yaml"
          if [ ! -f "$chart" ] || [ ! -f "services/$SERVICE/deploy/Dockerfile" ]; then
            echo "::error::$SERVICE has no Dockerfile or no Helm chart at this ref."
            exit 1
          fi
          base=$(jq -r --arg path "services/$SERVICE" '.[$path] // empty' .release-please-manifest.json)
          if [ -z "$base" ]; then
            echo "::error::.release-please-manifest.json has no version for $SERVICE at this ref."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    uses: ./.github/workflows/_template-cd.yaml
    secrets: inherit
    with:
      service-name: ${{ inputs.service }}
      service-version: ${{ needs.plan.outputs.version }}
      ref: ${{ needs.plan.outputs.sha }}
      publish-docs: false
      dev: true

  publish-branch:
    needs: [plan, build]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write # to push the dev branch of the service
    env:
      SERVICE: ${{ inputs.service }}
      VERSION: ${{ needs.plan.outputs.version }}
      SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Stamp the dev version and push the dev branch
        run: |
          set -euo pipefail
          chart="services/$SERVICE/deploy/helm-charts/$SERVICE"
          sed -i -E "s/^(version|appVersion): .*/\1: $VERSION/" "$chart/Chart.yaml"
          sed -i -E "s/^(  tag: ).* (# x-release-please-version)$/\1$VERSION \2/" "$chart/values.yaml"
          stat=$(git diff --shortstat)
          if [ "$stat" != " 2 files changed, 3 insertions(+), 3 deletions(-)" ]; then
            echo "::error::The stamp must change 3 lines in 2 files. It changed: $stat"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --all --message "chore($SERVICE): stamp dev build $VERSION"
          git push --force origin "HEAD:refs/heads/dev/$SERVICE"

      - name: Write the summary
        run: |
          {
            echo "## Dev build $VERSION"
            echo
            echo "- Image: \`ghcr.io/$GITHUB_REPOSITORY/services/$SERVICE:$VERSION\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Branch for ArgoCD: \`dev/$SERVICE\`"
          } >> "$GITHUB_STEP_SUMMARY"
