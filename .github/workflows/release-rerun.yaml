name: "[Release] Manual Re-Run"

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to release again"
        required: true
        type: choice
        options:
          - backstop-mcp
          - confluence-connector
          - hello-mcp
          - kb-mcp
          - office-365-mcp
          - outlook-semantic-mcp
          - sharepoint-connector
          - teams-mcp
          - with-intelligence-mcp
      existing-version:
        description: "Version to release again. The run stops when the image for this version exists."
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  manual-release:
    uses: ./.github/workflows/_template-cd.yaml
    with:
      service-name: ${{ inputs.service }}
      service-version: ${{ inputs.existing-version }}
