name: "[CI] Gatekeeper"

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]

concurrency:
  group: ci-gatekeeper-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-pr-title:
    name: Validate PR title
    # These labels skip the job: the two release-please labels and the title exception.
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease: tagged') &&
      !contains(github.event.pull_request.labels.*.name, 'title-exception')
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Pre-build cz
        run: nix build --no-link github:proventuslabs/scriptorium/db7be54d3f1b10f77e96f20694f4bcf9799de19e#cz

      - name: Validate PR title
        shell: nix shell github:proventuslabs/scriptorium/db7be54d3f1b10f77e96f20694f4bcf9799de19e#cz -c bash -e {0}
        run: |
          if ! OUTPUT=$(printenv PR_TITLE | cz --no-breaking-footer lint 2>&1); then
            echo "::error title=Invalid PR Title::$OUTPUT"
            exit 1
          fi

  gatekeeper:
    permissions:
      checks: read # to read the check runs of the pull request
      statuses: read # to read the commit statuses of the pull request
      pull-requests: read # to find the pull request of the commit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@09af7a82c1666d0e64d2bd8c01797a0bcfd3bb5d # v1.2.1
        with:
          self: gatekeeper
          token: ${{ secrets.GITHUB_TOKEN }}
          timeout: "1200"
          interval: "60"
          ignored: "Cursor Automation: Connectors Dependency PR Assess"
