name: "[Security] Trivy Registry Image Scan"

concurrency:
  group: security-trivy-registry
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to scan (comma-separated, or "all")'
        required: true
        default: all

permissions:
  contents: read

jobs:
  detect-services:
    name: Detect services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.build-matrix.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build service matrix
        id: build-matrix
        env:
          REQUESTED: ${{ inputs.services || 'all' }}
        run: |
          set -euo pipefail
          released=$(jq -c '[to_entries[] | {service: (.key | ltrimstr("services/")), version: .value}]' \
            .release-please-manifest.json)

          if [ "$REQUESTED" = "all" ]; then
            services="$released"
          else
            wanted=$(printf '%s' "$REQUESTED" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
            services=$(jq -c --argjson w "$wanted" '[.[] | select(.service as $s | $w | index($s))]' <<<"$released")
            missing=$(jq -r --argjson s "$services" '. - [$s[].service] | join(", ")' <<<"$wanted")
            if [ -n "$missing" ]; then
              echo "::error::Unknown services: ${missing}. Known services come from .release-please-manifest.json."
              exit 1
            fi
          fi

          if [ "$(jq 'length' <<<"$services")" -eq 0 ]; then
            echo "::error::No services selected."
            exit 1
          fi
          echo "services=${services}" >> "$GITHUB_OUTPUT"

  scan:
    name: Image ${{ matrix.service.service }}
    needs: detect-services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/unique-ag/connectors/services/${{ matrix.service.service }}
      VERSION: ${{ matrix.service.version }}
      TRIVY_DISABLE_VEX_NOTICE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/trivy-templates

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published digest
        id: resolve
        run: |
          set -uo pipefail
          if digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No published image::${IMAGE}:${VERSION} is in the release manifest, and the registry does not hold it."
            echo "⚠️ ${IMAGE}:${VERSION} is not published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.resolve.outputs.found == 'true'
        with:
          scan-type: image
          image-ref: ${{ steps.resolve.outputs.ref }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          timeout: 15m
          cache: true

      - name: Evaluate registry findings
        if: steps.resolve.outputs.found == 'true'
        env:
          SUMMARY_TEMPLATE: .github/trivy-templates/image-summary-markdown.tpl
        run: |
          set -euo pipefail
          if [ ! -s trivy-results.json ]; then
            echo "No trivy results file — treating as clean."
            echo "✅ ${IMAGE}:${VERSION} reports no CRITICAL,HIGH findings." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -f "$SUMMARY_TEMPLATE" ]; then
            trivy convert --format template --template @"$SUMMARY_TEMPLATE" trivy-results.json > trivy-report.md || true
            if [ -s trivy-report.md ]; then
              cat trivy-report.md >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          fixable_json=$(jq -c '[.Results[]?.Vulnerabilities[]? | select(.FixedVersion != null and .FixedVersion != "")]' trivy-results.json)
          fixable_count=$(echo "$fixable_json" | jq 'length')
          echo "Fixable CRITICAL,HIGH in ${IMAGE}:${VERSION}: ${fixable_count}"
          if [ "$fixable_count" -eq 0 ]; then
            echo "✅ ${IMAGE}:${VERSION} reports no patchable CRITICAL,HIGH findings." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$fixable_json" | jq -r '.[] | "::error title=Patchable finding::\(.PkgName) \(.InstalledVersion) → \(.FixedVersion) \(.VulnerabilityID) (\(.Severity))"'
          echo "::error::Patchable CRITICAL,HIGH findings: ${fixable_count} in ${IMAGE}:${VERSION}. Rebuild and release this service."
          exit 1
