name: "[Template] Helm"

on:
  workflow_call:
    inputs:
      service-name:
        description: "Name of the service (e.g., sharepoint-connector)"
        required: true
        type: string
      service-path:
        description: "Path to the service directory (e.g., services/sharepoint-connector)"
        required: true
        type: string

jobs:
  validate:
    permissions:
      contents: read # to read the repository
      packages: read # to pull the base chart from GHCR
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      SERVICE_PATH: ${{ inputs.service-path }}
      SERVICE_NAME: ${{ inputs.service-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check if Helm charts and tests exist
        id: check-helm
        run: |
          if [ -d "$SERVICE_PATH/deploy/helm-charts" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -d "$SERVICE_PATH/deploy/helm-charts/$SERVICE_NAME/tests" ]; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -x "$SERVICE_PATH/deploy/alert-tests/run.sh" ]; then
            echo "alert-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "alert-tests=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        if: steps.check-helm.outputs.exists == 'true'
        with:
          version: v3.19.0

      - name: Login to GHCR (for OCI chart dependencies)
        if: steps.check-helm.outputs.exists == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Render chart
        if: steps.check-helm.outputs.exists == 'true'
        working-directory: ${{ env.SERVICE_PATH }}/deploy/helm-charts/${{ env.SERVICE_NAME }}
        run: |
          helm dependency update
          if [ -f ci-values.yaml ]; then
            helm template . --values ci-values.yaml
          else
            helm template .
          fi

      - name: Lint chart
        if: steps.check-helm.outputs.exists == 'true'
        working-directory: ${{ env.SERVICE_PATH }}/deploy/helm-charts/${{ env.SERVICE_NAME }}
        run: |
          if [ -f ci-values.yaml ]; then
            helm lint . --strict --values ci-values.yaml
          else
            helm lint . --strict
          fi

      - name: Install the Helm unit test plugin
        if: steps.check-helm.outputs.tests == 'true'
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2

      - name: Run the Helm unit tests
        if: steps.check-helm.outputs.tests == 'true'
        working-directory: ${{ env.SERVICE_PATH }}/deploy/helm-charts/${{ env.SERVICE_NAME }}
        run: helm unittest .

      - name: Install promtool and yq
        if: steps.check-helm.outputs.alert-tests == 'true'
        env:
          PROMETHEUS_VERSION: "3.15.1"
          PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
          YQ_VERSION: "4.54.1"
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          archive="prometheus-$PROMETHEUS_VERSION.linux-amd64"
          curl -fsSL -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/$archive.tar.gz"
          echo "$PROMETHEUS_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP" "$archive/promtool"
          mv "$RUNNER_TEMP/$archive/promtool" "$RUNNER_TEMP/bin/promtool"
          curl -fsSL -o "$RUNNER_TEMP/bin/yq" \
            "https://github.com/mikefarah/yq/releases/download/v$YQ_VERSION/yq_linux_amd64"
          echo "$YQ_SHA256  $RUNNER_TEMP/bin/yq" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run the Prometheus alert rule tests
        if: steps.check-helm.outputs.alert-tests == 'true'
        run: "$SERVICE_PATH/deploy/alert-tests/run.sh"
