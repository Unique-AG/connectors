name: "[Security] Release Gate"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read # to read the repository

concurrency:
  group: security-release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-gate:
    if: startsWith(github.head_ref, 'release-please--branches--main--components--')
    permissions:
      contents: read # to read the repository
      packages: read # to read the cache image from GHCR
      pull-requests: read # to read the live security-exception label and the exception comment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve service
        id: service
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          service="${HEAD_REF#release-please--branches--main--components--}"
          if ! [[ "$service" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::The branch name does not hold a valid service name: ${service}"
            exit 1
          fi
          {
            echo "name=${service}"
            echo "image_tar=${RUNNER_TEMP}/${service}.tar"
            if [ -f "services/${service}/deploy/Dockerfile" ]; then
              echo "has_image=true"
            else
              echo "has_image=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        if: steps.service.outputs.has_image == 'true'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.service.outputs.has_image == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image (no push)
        if: steps.service.outputs.has_image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ steps.service.outputs.name }}/deploy/Dockerfile
          platforms: linux/amd64
          push: false
          pull: true
          provenance: false
          tags: ghcr.io/unique-ag/connectors/services/${{ steps.service.outputs.name }}:release-gate
          no-cache-filters: runtime,runner
          cache-from: |
            type=gha,scope=${{ steps.service.outputs.name }}
            type=registry,ref=ghcr.io/unique-ag/connectors/services/${{ steps.service.outputs.name }}:cache
          outputs: type=docker,dest=${{ steps.service.outputs.image_tar }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.service.outputs.has_image == 'true'
        with:
          scan-type: image
          input: ${{ steps.service.outputs.image_tar }}
          format: json
          output: ${{ runner.temp }}/trivy-results.json
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          timeout: 15m
          cache: true

      - name: Release gate
        if: steps.service.outputs.has_image == 'true'
        uses: ./.github/actions/release-gate
        with:
          trivy_report: ${{ runner.temp }}/trivy-results.json
          github_token: ${{ github.token }}
