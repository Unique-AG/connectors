name: "[CI] Packages"

on:
  pull_request:
    paths:
      - "packages/**"
      - "!packages/mcp-credential-auth/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "biome.json"
      - ".github/workflows/ci-packages.yaml"

concurrency:
  group: ci-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check syncpack format and lint
        run: pnpm syncpack format --check && pnpm syncpack lint

      - name: Run style (all packages)
        run: pnpm style

      - name: Type check (all packages)
        run: pnpm check-types --filter='./packages/*'

      - name: Build packages
        run: pnpm build --filter='./packages/*'

      - name: Run tests (all packages)
        run: pnpm test --filter='./packages/*'

      - name: Run tests:e2e (all packages)
        run: pnpm test:e2e --filter='./packages/*'
