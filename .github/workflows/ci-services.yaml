name: "[CI] Services"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "services/**"
      - "packages/**"
      - "!packages/mcp-credential-auth/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-services.yaml"
      - ".github/workflows/_template-ci.yaml"
      - ".github/workflows/_template-containerize.yaml"
      - ".github/workflows/_template-helm.yaml"
      - ".github/workflows/_template-terraform.yaml"
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to run CI for (comma-separated, e.g., "teams-mcp,outlook-semantic-mcp" or "all")'
        required: true
        default: "all"

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-services-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes (Node)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      services: ${{ steps.build-matrix.outputs.services }}
      packages-changed: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          list-files: json
          predicate-quantifier: some-with-excludes
          filters: |
            services:
              - 'services/**'
            packages:
              - 'packages/**'
              - '!packages/mcp-credential-auth/**'
            lockfile:
              - 'pnpm-lock.yaml'
            workflow:
              - '.github/workflows/ci-services.yaml'
              - '.github/workflows/_template-ci.yaml'
              - '.github/workflows/_template-containerize.yaml'
              - '.github/workflows/_template-helm.yaml'
              - '.github/workflows/_template-terraform.yaml'

      - name: Build service matrix
        id: build-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICES: ${{ github.event.inputs.services }}
          SERVICES_CHANGED: ${{ steps.filter.outputs.services }}
          SERVICES_FILES: ${{ steps.filter.outputs.services_files }}
          PACKAGES_CHANGED: ${{ steps.filter.outputs.packages }}
          LOCKFILE_CHANGED: ${{ steps.filter.outputs.lockfile }}
          WORKFLOW_CHANGED: ${{ steps.filter.outputs.workflow }}
        run: |
          list_node_services() {
            find services -mindepth 2 -maxdepth 2 -type f -name package.json | cut -d/ -f2 | sort
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            available=$(list_node_services)

            if [ "$INPUT_SERVICES" = "all" ]; then
              services=$(echo "$available" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            else
              IFS=',' read -ra requested <<< "$INPUT_SERVICES"
              valid=()
              for service in "${requested[@]}"; do
                service=$(echo "$service" | xargs)
                if echo "$available" | grep -qx "$service"; then
                  valid+=("$service")
                else
                  echo "::error::Unknown service: $service"
                  echo "Available services: $available"
                  exit 1
                fi
              done
              services=$(printf '%s\n' "${valid[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          elif [ "$PACKAGES_CHANGED" = "true" ] || [ "$LOCKFILE_CHANGED" = "true" ] || [ "$WORKFLOW_CHANGED" = "true" ]; then
            services=$(list_node_services | jq -R -s -c 'split("\n") | map(select(length > 0))')
          elif [ "$SERVICES_CHANGED" = "true" ]; then
            services=$(echo "$SERVICES_FILES" | jq -r '.[]' | grep -E '^services/[^/]+/' | cut -d'/' -f2 | sort -u | while read -r s; do
              [ -f "services/$s/package.json" ] && echo "$s"
            done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            services='[]'
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Services to validate: $services"

  syncpack:
    name: Syncpack
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check syncpack format and lint
        run: pnpm syncpack format --check && pnpm syncpack lint

  ci:
    name: ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    uses: ./.github/workflows/_template-ci.yaml
    with:
      service-name: ${{ matrix.service }}
      service-path: services/${{ matrix.service }}
