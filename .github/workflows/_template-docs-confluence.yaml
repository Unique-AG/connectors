name: "[Template] Docs to Confluence"

on:
  workflow_call:
    inputs:
      docs-path:
        description: "Path to the docs directory relative to repo root"
        required: true
        type: string

jobs:
  publish-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # to read the repository
    env:
      DOCS_PATH: ${{ inputs.docs-path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check if docs exist
        id: check-docs
        run: |
          if [ -d "$DOCS_PATH" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$DOCS_PATH does not exist, so there are no docs to publish."
          fi

      - name: Publish docs to Confluence
        if: steps.check-docs.outputs.exists == 'true'
        env:
          CONFLUENCE_DOMAIN: unique-ch.atlassian.net
          CONFLUENCE_PATH: /wiki/
          CONFLUENCE_USER_NAME: ${{ secrets.ATLASSIAN_UNIQUE_CODE_PUBLISHER_USERNAME }}
          CONFLUENCE_API_KEY: ${{ secrets.ATLASSIAN_UNIQUE_CODE_PUBLISHER_APIKEY }}
          MD2CONF_IMAGE: leventehunyadi/md2conf:0.6.1@sha256:c06844e455977be323fda0d6d709863dc84cf522ce4266ed1b68a45c45ddc6a6
        run: |
          echo "-- Publishing $DOCS_PATH to Confluence --"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/$DOCS_PATH:/data" \
            -e CONFLUENCE_DOMAIN \
            -e CONFLUENCE_PATH \
            -e CONFLUENCE_USER_NAME \
            -e CONFLUENCE_API_KEY \
            "$MD2CONF_IMAGE" \
            --no-generated-by \
            --render-mermaid \
            ./
          echo "-- Publishing complete --"
