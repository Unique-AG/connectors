name: "[office-365-mcp] Publish Docs to Confluence"

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish-docs:
    uses: ./.github/workflows/_template-docs-confluence.yaml
    secrets: inherit
    with:
      service-name: office-365-mcp
      docs-path: services/office-365-mcp/docs
