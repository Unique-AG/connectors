name: "[Release] Please"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /services/*/deploy/helm-charts/*/Chart.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      - name: Debug release outputs
        continue-on-error: true
        env:
          RELEASE_OUTPUTS: ${{ toJson(steps.release.outputs) }}
        run: |
          echo "$RELEASE_OUTPUTS" | jq
          {
            echo '## Release Please Outputs'
            echo '```json'
            echo "$RELEASE_OUTPUTS" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan the releases
        id: plan
        env:
          RELEASE_OUTPUTS: ${{ toJson(steps.release.outputs) }}
        run: |
          paths=$(jq -r '(.paths_released // "[]" | fromjson)[]' <<< "$RELEASE_OUTPUTS")
          releases='[]'
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            service=${path#services/}
            if [ -f "$path/deploy/helm-charts/$service/Chart.yaml" ]; then
              version=$(jq -r --arg key "$path--version" '.[$key] // empty' <<< "$RELEASE_OUTPUTS")
              tag=$(jq -r --arg key "$path--tag_name" '.[$key] // empty' <<< "$RELEASE_OUTPUTS")
              if [ -z "$version" ] || [ -z "$tag" ]; then
                echo "::error::release-please returned no version or tag for $path."
                exit 1
              fi
              releases=$(jq -c --arg service "$service" --arg version "$version" --arg ref "refs/tags/$tag" '. + [{service: $service, version: $version, ref: $ref}]' <<< "$releases")
            else
              echo "::notice::$service has no Helm chart, so its release publishes no image."
            fi
          done <<< "$paths"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.release.service }}
    needs: release-please
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.release-please.outputs.releases) }}
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    uses: ./.github/workflows/_template-cd.yaml
    secrets: inherit
    with:
      service-name: ${{ matrix.release.service }}
      service-version: ${{ matrix.release.version }}
      ref: ${{ matrix.release.ref }}
