name: "[Release] Please"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write

jobs:
  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      "services/sharepoint-connector--release_created": ${{ steps.release.outputs['services/sharepoint-connector--release_created'] }}
      "services/sharepoint-connector--version": ${{ steps.release.outputs['services/sharepoint-connector--version'] }}
      "services/teams-mcp--release_created": ${{ steps.release.outputs['services/teams-mcp--release_created'] }}
      "services/teams-mcp--version": ${{ steps.release.outputs['services/teams-mcp--version'] }}
      "services/confluence-connector--release_created": ${{ steps.release.outputs['services/confluence-connector--release_created'] }}
      "services/confluence-connector--version": ${{ steps.release.outputs['services/confluence-connector--version'] }}
      "services/outlook-semantic-mcp--release_created": ${{ steps.release.outputs['services/outlook-semantic-mcp--release_created'] }}
      "services/outlook-semantic-mcp--version": ${{ steps.release.outputs['services/outlook-semantic-mcp--version'] }}
      "services/hello-mcp--release_created": ${{ steps.release.outputs['services/hello-mcp--release_created'] }}
      "services/hello-mcp--version": ${{ steps.release.outputs['services/hello-mcp--version'] }}
      "services/kb-mcp--release_created": ${{ steps.release.outputs['services/kb-mcp--release_created'] }}
      "services/kb-mcp--version": ${{ steps.release.outputs['services/kb-mcp--version'] }}
      "services/backstop-mcp--release_created": ${{ steps.release.outputs['services/backstop-mcp--release_created'] }}
      "services/backstop-mcp--version": ${{ steps.release.outputs['services/backstop-mcp--version'] }}
      "services/office-365-mcp--release_created": ${{ steps.release.outputs['services/office-365-mcp--release_created'] }}
      "services/office-365-mcp--version": ${{ steps.release.outputs['services/office-365-mcp--version'] }}
      "services/with-intelligence-mcp--release_created": ${{ steps.release.outputs['services/with-intelligence-mcp--release_created'] }}
      "services/with-intelligence-mcp--version": ${{ steps.release.outputs['services/with-intelligence-mcp--version'] }}

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      - name: Debug release outputs
        continue-on-error: true
        env:
          RELEASE_OUTPUTS: ${{ toJson(steps.release.outputs) }}
        run: |
          echo "$RELEASE_OUTPUTS" | jq
          {
            echo '## Release Please Outputs'
            echo '```json'
            echo "$RELEASE_OUTPUTS" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release-sharepoint-connector:
    needs: release-please
    if: needs.release-please.outputs['services/sharepoint-connector--release_created'] == 'true'
    uses: ./.github/workflows/_template-cd.yaml
    secrets: inherit
    with:
      service-name: sharepoint-connector
      service-version: ${{ needs.release-please.outputs['services/sharepoint-connector--version'] }}
      docs-path: services/sharepoint-connector/docs

  release-teams-mcp:
    needs: release-please
    if: needs.release-please.outputs['services/teams-mcp--release_created'] == 'true'
    uses: ./.github/workflows/_template-cd.yaml
    secrets: inherit
    with:
      service-name: teams-mcp
      service-version: ${{ needs.release-please.outputs['services/teams-mcp--version'] }}
      docs-path: services/teams-mcp/docs

  release-confluence-connector:
    needs: release-please
    if: needs.release-please.outputs['services/confluence-connector--release_created'] == 'true'
    uses: ./.github/workflows/_template-cd.yaml
    with:
      service-name: confluence-connector
      service-version: ${{ needs.release-please.outputs['services/confluence-connector--version'] }}

  release-outlook-semantic-mcp:
    needs: release-please
    if: needs.release-please.outputs['services/outlook-semantic-mcp--release_created'] == 'true'
    uses: ./.github/workflows/_template-cd.yaml
    with:
      service-name: outlook-semantic-mcp
      service-version: ${{ needs.release-please.outputs['services/outlook-semantic-mcp--version'] }}

  release-hello-mcp:
    needs: release-please
    if: needs.release-please.outputs['services/hello-mcp--release_created'] == 'true'
    uses: ./.github/workflows/_template-cd.yaml
    with:
      service-name: hello-mcp
      service-version: ${{ needs.release-please.outputs['services/hello-mcp--version'] }}

  release-kb-mcp:
    needs: release-please
    if: needs.release-please.outputs['services/kb-mcp--release_created'] == 'true'
    uses: ./.github/workflows/_template-cd.yaml
    with:
      service-name: kb-mcp
      service-version: ${{ needs.release-please.outputs['services/kb-mcp--version'] }}

  release-backstop-mcp:
    needs: release-please
    if: needs.release-please.outputs['services/backstop-mcp--release_created'] == 'true'
    uses: ./.github/workflows/_template-cd.yaml
    with:
      service-name: backstop-mcp
      service-version: ${{ needs.release-please.outputs['services/backstop-mcp--version'] }}

  release-office-365-mcp:
    needs: release-please
    if: needs.release-please.outputs['services/office-365-mcp--release_created'] == 'true'
    uses: ./.github/workflows/_template-cd.yaml
    with:
      service-name: office-365-mcp
      service-version: ${{ needs.release-please.outputs['services/office-365-mcp--version'] }}

  release-with-intelligence-mcp:
    needs: release-please
    if: needs.release-please.outputs['services/with-intelligence-mcp--release_created'] == 'true'
    uses: ./.github/workflows/_template-cd.yaml
    with:
      service-name: with-intelligence-mcp
      service-version: ${{ needs.release-please.outputs['services/with-intelligence-mcp--version'] }}
