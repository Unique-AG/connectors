name: "[Template] CI"

on:
  workflow_call:
    inputs:
      service-name:
        description: "Name of the service (e.g., sharepoint-connector)"
        required: true
        type: string
      service-path:
        description: "Path to the service directory (e.g., services/sharepoint-connector)"
        required: true
        type: string

concurrency:
  group: _template-ci-${{ github.workflow }}-${{ inputs.service-name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVICE_PATH: ${{ inputs.service-path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect ORM
        run: |
          if [ -f "$SERVICE_PATH/drizzle.config.ts" ]; then
            echo "ORM=drizzle" >> "$GITHUB_ENV"
          elif [ -f "$SERVICE_PATH/prisma/schema.prisma" ]; then
            echo "ORM=prisma" >> "$GITHUB_ENV"
          else
            echo "ORM=none" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: ${{ env.SERVICE_PATH }}
        if: env.ORM == 'prisma'
        run: pnpm db:generate

      - name: Check Drizzle migrations
        working-directory: ${{ env.SERVICE_PATH }}
        if: env.ORM == 'drizzle'
        run: pnpm db:check

      - name: Run codegen
        working-directory: ${{ env.SERVICE_PATH }}
        run: pnpm codegen

      - name: Check syncpack format and lint
        run: pnpm syncpack format --check && pnpm syncpack lint

      - name: Run style
        working-directory: ${{ env.SERVICE_PATH }}
        run: pnpm style

      - name: Type check
        working-directory: ${{ env.SERVICE_PATH }}
        run: pnpm check-types

      - name: Build project
        working-directory: ${{ env.SERVICE_PATH }}
        run: pnpm build

      - name: Run tests
        working-directory: ${{ env.SERVICE_PATH }}
        run: pnpm test

  validate-helm:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICE_PATH: ${{ inputs.service-path }}
      SERVICE_NAME: ${{ inputs.service-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check if Helm charts exist
        id: check-helm
        run: |
          if [ -d "$SERVICE_PATH/deploy/helm-charts" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.check-helm.outputs.exists == 'true'
        with:
          version: v3.19.0

      - name: Login to GHCR (for OCI chart dependencies)
        if: steps.check-helm.outputs.exists == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Render chart
        if: steps.check-helm.outputs.exists == 'true'
        working-directory: ${{ env.SERVICE_PATH }}/deploy/helm-charts/${{ env.SERVICE_NAME }}
        run: |
          helm dependency update
          if [ -f ci-values.yaml ]; then
            helm template . --values ci-values.yaml
          else
            helm template .
          fi

  helm-schema-check:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICE_PATH: ${{ inputs.service-path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check if Helm charts exist
        id: check-helm
        run: |
          if [ -d "$SERVICE_PATH/deploy/helm-charts" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.check-helm.outputs.exists == 'true'
        with:
          version: v3.19.0

      - name: Login to GHCR (for OCI base chart schema pull)
        if: steps.check-helm.outputs.exists == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Check values.schema.json drift
        if: steps.check-helm.outputs.exists == 'true'
        run: scripts/render-values-schema.sh --check

  validate-terraform:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICE_PATH: ${{ inputs.service-path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check if Terraform exists
        id: check-terraform
        run: |
          if [ -d "$SERVICE_PATH/deploy/terraform" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.check-terraform.outputs.exists == 'true'
        with:
          terraform_version: 1.13.4

      - name: Validate Terraform modules
        if: steps.check-terraform.outputs.exists == 'true'
        run: |
          while IFS= read -r -d '' dir; do
            echo "Validating: $dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done < <(find "$SERVICE_PATH/deploy/terraform" -mindepth 2 -maxdepth 2 -type d -print0)

  containerize:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_template-containerize.yaml
    with:
      service-name: ${{ inputs.service-name }}
      service-path: ${{ inputs.service-path }}
