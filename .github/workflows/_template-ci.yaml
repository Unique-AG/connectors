name: "[Template] CI"

on:
  workflow_call:
    inputs:
      service-name:
        description: "Name of the service (e.g., sharepoint-connector)"
        required: true
        type: string
      service-path:
        description: "Path to the service directory (e.g., services/sharepoint-connector)"
        required: true
        type: string

concurrency:
  group: _template-ci-${{ github.workflow }}-${{ inputs.service-name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVICE_PATH: ${{ inputs.service-path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect ORM
        run: |
          if [ -f "$SERVICE_PATH/drizzle.config.ts" ]; then
            echo "ORM=drizzle" >> "$GITHUB_ENV"
          elif [ -f "$SERVICE_PATH/prisma/schema.prisma" ]; then
            echo "ORM=prisma" >> "$GITHUB_ENV"
          else
            echo "ORM=none" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: ${{ env.SERVICE_PATH }}
        if: env.ORM == 'prisma'
        run: pnpm db:generate

      - name: Check Drizzle migrations
        working-directory: ${{ env.SERVICE_PATH }}
        if: env.ORM == 'drizzle'
        run: pnpm db:check

      - name: Run codegen
        working-directory: ${{ env.SERVICE_PATH }}
        run: pnpm codegen

      - name: Run style
        working-directory: ${{ env.SERVICE_PATH }}
        run: pnpm style

      - name: Type check
        working-directory: ${{ env.SERVICE_PATH }}
        run: pnpm check-types

      - name: Build project
        working-directory: ${{ env.SERVICE_PATH }}
        run: pnpm build

      - name: Run tests
        working-directory: ${{ env.SERVICE_PATH }}
        run: pnpm test

  validate-helm:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_template-helm.yaml
    with:
      service-name: ${{ inputs.service-name }}
      service-path: ${{ inputs.service-path }}

  validate-terraform:
    permissions:
      contents: read
    uses: ./.github/workflows/_template-terraform.yaml
    with:
      service-path: ${{ inputs.service-path }}

  containerize:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_template-containerize.yaml
    with:
      service-name: ${{ inputs.service-name }}
      service-path: ${{ inputs.service-path }}
