name: "[CI] GitHub Actions"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/ci-github-actions.yaml"

permissions:
  contents: read # to read the repository

concurrency:
  group: ci-github-actions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test composite actions and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Run action and script unit tests
        run: node --test .github/actions/pull-request-labels/*.test.mjs .github/actions/release-gate/*.test.mjs .github/actions/trivy-report-slack/*.test.mjs .github/scripts/deps-nightly/*.test.mjs
