name: "[Release] Rebuild Service"

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to rebuild (comma-separated, or "all")'
        required: true

permissions:
  contents: write # to push one branch for each service
  pull-requests: write # to open one pull request for each service

concurrency:
  group: release-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED: ${{ inputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open one pull request for each service
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/release-rebuild/rebuild.sh "$REQUESTED"
