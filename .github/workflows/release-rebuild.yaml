name: "[Release] Rebuild Service"

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to rebuild (comma-separated, or "all")'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED: ${{ inputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open one pull request for each service
        run: |
          set -euo pipefail

          if [ "$REQUESTED" = "all" ]; then
            services=$(jq -r 'keys[] | ltrimstr("services/")' .release-please-manifest.json)
          else
            services=$(printf '%s' "$REQUESTED" | tr ',' '\n' | tr -d ' ' | sed '/^$/d')
          fi

          for service in $services; do
            if ! jq -e --arg path "services/${service}" 'has($path)' .release-please-manifest.json > /dev/null; then
              echo "::error::${service} is not a released service."
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          suffix=$(date -u +%Y%m%d%H%M%S)

          for service in $services; do
            title="build(${service}): rebuild for operating system patches"
            branch="rebuild/${service}-${suffix}"
            file="services/${service}/deploy/rebuild-date"
            git switch --detach --quiet "$base"
            git switch --create "$branch" --quiet
            printf '%s\n' "$stamp" > "$file"
            git add "$file"
            git commit --quiet --message "$title"
            git push --quiet origin "$branch"
            gh pr create \
              --base main \
              --head "$branch" \
              --title "$title" \
              --body "This pull request rebuilds ${service}. It changes one date file and no code. The release build takes the newest operating system patches. Merge this pull request. Then merge the release pull request that release-please opens."
          done
