name: "[Docs] Publish to Confluence"

on:
  workflow_dispatch:
    inputs:
      docs-path:
        description: "Docs directory to publish"
        required: true
        type: choice
        options:
          - docs/recordings-and-transcripts
          - services/confluence-connector/docs
          - services/office-365-mcp/docs
          - services/outlook-semantic-mcp/docs
          - services/sharepoint-connector/docs
          - services/teams-mcp/docs
  push:
    branches:
      - main
    paths:
      - "docs/recordings-and-transcripts/**"

permissions:
  contents: read

jobs:
  publish-docs:
    uses: ./.github/workflows/_template-docs-confluence.yaml
    secrets: inherit
    with:
      docs-path: ${{ inputs.docs-path || 'docs/recordings-and-transcripts' }}
