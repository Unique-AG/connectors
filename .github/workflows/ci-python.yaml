# Python services are not part of the pnpm and turbo workspace, so ci-services.yaml does not cover them.
# Each service job runs for a changed service and for every service that uses a changed shared package.
name: "[CI] Python"

on:
  # No `branches` filter. Stacked pull requests target their parent branch, not `main`.
  # A `branches: [main]` filter skips this workflow for all pull requests in a stack except the first.
  # Only `paths` decides when the workflow runs.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packages/mcp-architecture/**"
      - "packages/mcp-configs/**"
      - "packages/mcp-credential-auth/**"
      - "packages/mcp-observability/**"
      - "packages/mcp-openapi/**"
      - "packages/mcp-scaffold/**"
      # What mcp-scaffold edits by matching its text when it registers a new MCP.
      - ".gitcommitizen"
      - "release-please-config.json"
      - ".github/workflows/release-rerun.yaml"
      - "pnpm-workspace.yaml"
      - "services/**"
      - "scripts/check-python-service.sh"
      - "scripts/report-python-version-drift.py"
      - ".github/workflows/ci-python.yaml"
      - ".github/workflows/_template-containerize.yaml"
      - ".github/workflows/_template-helm.yaml"
      - ".github/workflows/_template-terraform.yaml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      packages:
        description: 'Python packages to run CI for (comma-separated, e.g., "hello-mcp" or "all")'
        required: true
        default: "all"

permissions:
  contents: read # to read the repository
  packages: read # to let the called workflows pull the base chart and the cache image from GHCR
  pull-requests: read # to let containerize read the live security-exception label

concurrency:
  group: ci-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes (Python)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.build-matrix.outputs.packages }}
      shared-auth-changed: ${{ steps.filter.outputs.shared_auth }}
      mcp-architecture-changed: ${{ steps.filter.outputs.mcp_architecture }}
      mcp-openapi-changed: ${{ steps.filter.outputs.mcp_openapi }}
      mcp-configs-changed: ${{ steps.filter.outputs.mcp_configs }}
      mcp-observability-changed: ${{ steps.filter.outputs.mcp_observability }}
      mcp-scaffold-changed: ${{ steps.filter.outputs.mcp_scaffold }}
      workflow-changed: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          list-files: json
          filters: |
            services:
              - 'services/**'
            shared_auth:
              - 'packages/mcp-credential-auth/**'
            mcp_architecture:
              - 'packages/mcp-architecture/**'
            mcp_openapi:
              - 'packages/mcp-openapi/**'
            mcp_configs:
              - 'packages/mcp-configs/**'
            mcp_observability:
              - 'packages/mcp-observability/**'
            # The MCPs the scaffold's tests generate depend on mcp-configs and mcp-observability, run
            # mcp-architecture's rules, and use mcp-openapi for an OpenAPI upstream, so a change to any
            # of them runs them too.
            # The scaffold also edits the registry files below by matching their text.
            mcp_scaffold:
              - 'packages/mcp-scaffold/**'
              - 'packages/mcp-architecture/**'
              - 'packages/mcp-openapi/**'
              - 'packages/mcp-configs/**'
              - 'packages/mcp-observability/**'
              - '.gitcommitizen'
              - 'release-please-config.json'
              - '.github/workflows/release-rerun.yaml'
              - 'pnpm-workspace.yaml'
            workflow:
              - '.github/workflows/ci-python.yaml'
              - 'scripts/check-python-service.sh'
              - '.github/workflows/_template-containerize.yaml'
              - '.github/workflows/_template-helm.yaml'
              - '.github/workflows/_template-terraform.yaml'
              - '.github/actions/**'

      # This step builds the list of Python services for the matrix jobs.
      # A change to a workflow file lists every service. A manual run lists the services that the input names.
      # Node services (package.json only) are never listed. ci-services.yaml covers them.
      - name: Build package matrix
        id: build-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
          SERVICES_CHANGED: ${{ steps.filter.outputs.services }}
          SERVICES_FILES: ${{ steps.filter.outputs.services_files }}
          MCP_ARCHITECTURE_CHANGED: ${{ steps.filter.outputs.mcp_architecture }}
          MCP_OPENAPI_CHANGED: ${{ steps.filter.outputs.mcp_openapi }}
          MCP_CONFIGS_CHANGED: ${{ steps.filter.outputs.mcp_configs }}
          MCP_OBSERVABILITY_CHANGED: ${{ steps.filter.outputs.mcp_observability }}
          SHARED_AUTH_CHANGED: ${{ steps.filter.outputs.shared_auth }}
          WORKFLOW_CHANGED: ${{ steps.filter.outputs.workflow }}
        run: |
          list_python_services() {
            find services -mindepth 2 -maxdepth 2 -type f -name pyproject.toml | cut -d/ -f2 | sort
          }

          list_changed_python_services() {
            echo "$SERVICES_FILES" | jq -r '.[]' | grep -E '^services/[^/]+/' | cut -d'/' -f2 | sort -u | while read -r pkg; do
              [ -f "services/$pkg/pyproject.toml" ] && echo "$pkg"
            done | jq -R -s -c 'split("\n") | map(select(length > 0))'
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            available=$(list_python_services)

            if [ "$INPUT_PACKAGES" = "all" ]; then
              packages=$(echo "$available" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            else
              IFS=',' read -ra requested <<< "$INPUT_PACKAGES"
              valid=()
              for pkg in "${requested[@]}"; do
                pkg=$(echo "$pkg" | xargs)
                if echo "$available" | grep -qx "$pkg"; then
                  valid+=("$pkg")
                else
                  echo "::error::Unknown python package: $pkg"
                  echo "Available python packages: $available"
                  exit 1
                fi
              done
              packages=$(printf '%s\n' "${valid[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          elif [ "$WORKFLOW_CHANGED" = "true" ]; then
            packages=$(list_python_services | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            packages='[]'
            if [ "$SERVICES_CHANGED" = "true" ]; then
              packages=$(list_changed_python_services)
            fi
            if [ "$SHARED_AUTH_CHANGED" = "true" ]; then
              consumers=$(grep -l '"mcp-credential-auth' services/*/pyproject.toml | cut -d/ -f2 | jq -R -s -c 'split("\n") | map(select(length > 0))')
              packages=$(jq -c --argjson consumers "$consumers" '. + $consumers | unique' <<< "$packages")
            fi
            if [ "$MCP_OPENAPI_CHANGED" = "true" ]; then
              consumers=$(grep -l '"mcp-openapi' services/*/pyproject.toml | cut -d/ -f2 | jq -R -s -c 'split("\n") | map(select(length > 0))')
              packages=$(jq -c --argjson consumers "$consumers" '. + $consumers | unique' <<< "$packages")
            fi
            if [ "$MCP_ARCHITECTURE_CHANGED" = "true" ]; then
              consumers=$(grep -l '"mcp-architecture' services/*/pyproject.toml | cut -d/ -f2 | jq -R -s -c 'split("\n") | map(select(length > 0))')
              packages=$(jq -c --argjson consumers "$consumers" '. + $consumers | unique' <<< "$packages")
            fi
            if [ "$MCP_CONFIGS_CHANGED" = "true" ]; then
              consumers=$(grep -l '"mcp-configs' services/*/pyproject.toml | cut -d/ -f2 | jq -R -s -c 'split("\n") | map(select(length > 0))')
              packages=$(jq -c --argjson consumers "$consumers" '. + $consumers | unique' <<< "$packages")
            fi
            if [ "$MCP_OBSERVABILITY_CHANGED" = "true" ]; then
              consumers=$(grep -l '"mcp-observability' services/*/pyproject.toml | cut -d/ -f2 | jq -R -s -c 'split("\n") | map(select(length > 0))')
              packages=$(jq -c --argjson consumers "$consumers" '. + $consumers | unique' <<< "$packages")
            fi
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Python packages to validate: $packages"

  # Each project keeps its own uv.lock, and a Dependabot security update bumps one at a time, so
  # versions drift between alignments. This lists the drift as a warning and never fails.
  version-drift:
    name: Report Python version drift
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.33"

      - name: Report the packages two projects' locks resolve to different versions
        run: uv run --no-project --python 3.14 python scripts/report-python-version-drift.py

  test:
    name: Test ${{ matrix.package }}
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # The same script runs every check locally. DEVELOP.md lists what it runs and why.
      - name: Check the service
        env:
          # A lint finding becomes an annotation on the line it is about.
          RUFF_OUTPUT_FORMAT: github
        run: bash ../../scripts/check-python-service.sh .

  test-shared-auth:
    name: Test mcp-credential-auth
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.shared-auth-changed == 'true' ||
      needs.detect-changes.outputs.workflow-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-credential-auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest

  test-mcp-openapi:
    name: Test mcp-openapi
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.mcp-openapi-changed == 'true' ||
      needs.detect-changes.outputs.workflow-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-openapi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest

  test-mcp-architecture:
    name: Test mcp-architecture
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.mcp-architecture-changed == 'true' ||
      needs.detect-changes.outputs.workflow-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-architecture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest

  test-mcp-configs:
    name: Test mcp-configs
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.mcp-configs-changed == 'true' ||
      needs.detect-changes.outputs.workflow-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-configs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest

  test-mcp-observability:
    name: Test mcp-observability
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.mcp-observability-changed == 'true' ||
      needs.detect-changes.outputs.workflow-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-observability
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest

  test-mcp-scaffold:
    name: Test mcp-scaffold
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.mcp-scaffold-changed == 'true' ||
      needs.detect-changes.outputs.workflow-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/mcp-scaffold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest

  validate-helm:
    name: Helm ${{ matrix.package }}
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    permissions:
      contents: read # to let the called workflow read the repository
      packages: read # to let the called workflow pull the base chart from GHCR
    uses: ./.github/workflows/_template-helm.yaml
    with:
      service-name: ${{ matrix.package }}
      service-path: services/${{ matrix.package }}

  validate-terraform:
    name: Terraform ${{ matrix.package }}
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    permissions:
      contents: read # to let the called workflow read the repository
    uses: ./.github/workflows/_template-terraform.yaml
    with:
      service-path: services/${{ matrix.package }}

  containerize:
    name: Containerize ${{ matrix.package }}
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    permissions:
      contents: read # to let the called workflow read the repository
      packages: read # to let the called workflow read the cache image from GHCR
      pull-requests: read # to let the called workflow read the live security-exception label
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    uses: ./.github/workflows/_template-containerize.yaml
    with:
      service-name: ${{ matrix.package }}
      service-path: services/${{ matrix.package }}
