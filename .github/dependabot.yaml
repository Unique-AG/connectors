version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - services/**/*
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
      - dependabot-docker
    groups:
      service-base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    rebase-strategy: disabled

  - package-ecosystem: helm
    directories:
      - services/**/*
    cooldown:
      default-days: 3
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directories:
      - services/**/*
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
