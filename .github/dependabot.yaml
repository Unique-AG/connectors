version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * 5"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    groups:
      per-dependency:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
        group-by: dependency-name

  - package-ecosystem: uv
