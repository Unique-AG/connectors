[project]
name = "mcp-credential-auth"
version = "0.1.0"
description = "Shared credential-backed OAuth infrastructure for MCP servers"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46,<51",
    "fastmcp>=4.0.3,<5",
    "mcp>=2.1.1,<3",
    "pydantic>=2.13,<3",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "starlette>=1.3.1,<2",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_credential_auth"]

[dependency-groups]
dev = [
    "asyncpg==0.31.0",
    "basedpyright==1.39.10",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
    "testcontainers[postgres]==4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "all"
include = ["src", "tests"]
reportUnusedCallResult = false
reportMissingTypeStubs = false
