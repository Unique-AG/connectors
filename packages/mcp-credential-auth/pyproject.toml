[project]
name = "mcp-credential-auth"
version = "0.1.0"
description = "Shared credential-backed OAuth infrastructure for MCP servers"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46,<51",
    "fastmcp>=4.0.3,<5",
    "mcp>=2.1.1,<3",
    "pydantic>=2.13,<3",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "starlette>=1.3.1,<2",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_credential_auth"]

[dependency-groups]
dev = [
    "asyncpg==0.32.0",
    "basedpyright==1.40.2",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.15.0",
    "poethepoet==0.49.0",
]

[tool.poe.tasks]
# Run from the package's folder: uv run poe <task>
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
fix = ["format", "lint-fix", "format"]
typecheck = "basedpyright"
test = "pytest"
ci = { sequence = [{ cmd = "ruff format --check ." }, "lint", "typecheck", "test"], help = "every check CI runs, in its order" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "all"
include = ["src", "tests"]
reportUnusedCallResult = false
reportMissingTypeStubs = false
