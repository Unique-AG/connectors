[project]
name = "mcp-auth"
version = "0.1.0"
description = "User sign-in for a Python MCP. Zitadel is mcp_auth.zitadel"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.6,<4.2",
    "mcp-configs==0.1.0",
    "py-key-value-aio[wrappers-encryption]>=0.4.6,<0.5",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_auth"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "httpx2==2.16.2",
    "poethepoet==0.49.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.uv.sources]
mcp-configs = { path = "../mcp-configs" }

[tool.poe.tasks]
# Run from the package's folder: uv run poe <task>
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
fix = ["format", "lint-fix", "format"]
typecheck = "basedpyright"
test = "pytest"
ci = { sequence = [{ cmd = "ruff format --check ." }, "lint", "typecheck", "test"], help = "every check CI runs, in its order" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TID", "RUF022"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "all"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
executionEnvironments = [{ root = "tests", extraPaths = ["."], reportPrivateUsage = false }]
