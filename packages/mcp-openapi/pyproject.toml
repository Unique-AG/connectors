[project]
name = "mcp-openapi"
version = "0.1.0"
description = "Shared building blocks for MCP servers generated from an OpenAPI spec with FastMCP"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.1,<5",
    "httpx2>=2.13,<3",
    "jsonschema-path>=0.5,<1",
    "mcp-types>=2.3,<3",
    "pydantic>=2.14,<3",
]

[project.optional-dependencies]
codegen = [
    "datamodel-code-generator>=0.83,<1",
    "openapi-pydantic>=0.6,<1",
    "pyyaml>=6,<7",
    "ruff>=0.17,<1",
]

[project.scripts]
mcp-openapi-codegen = "mcp_openapi.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_openapi"]

[dependency-groups]
dev = [
    "basedpyright==1.40.1",
    "datamodel-code-generator==0.83.0",
    "openapi-pydantic==0.6.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "all"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUnusedCallResult = false
