[project]
name = "mcp-openapi"
version = "0.1.0"
description = "Shared building blocks for MCP servers generated from an OpenAPI spec with FastMCP"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx2>=2.13,<3",
    "jsonschema-path>=0.5,<1",
    "mcp-types>=2.3,<3",
    "pydantic>=2.14,<3",
    "tenacity>=9.1,<10",
]

[project.optional-dependencies]
codegen = [
    "datamodel-code-generator>=0.83,<1",
    "openapi-pydantic>=0.6,<1",
    "pyyaml>=6,<7",
    "ruff>=0.17,<1",
]

[project.scripts]
mcp-openapi-codegen = "mcp_openapi.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_openapi"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "datamodel-code-generator==0.83.0",
    "openapi-pydantic==0.6.0",
    "poethepoet==0.49.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
]

[tool.poe.tasks]
# Run from the package's folder: uv run poe <task>
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
fix = ["format", "lint-fix", "format"]
typecheck = "basedpyright"
test = "pytest"
ci = { sequence = [{ cmd = "ruff format --check ." }, "lint", "typecheck", "test"], help = "every check CI runs, in its order" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "all"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUnusedCallResult = false
