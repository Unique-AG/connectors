[project]
name = "mcp-observability"
version = "0.1.0"
description = "What every Python MCP server reports: Pino-JSON logs, OpenTelemetry tracing, Prometheus metrics and the routes Kubernetes and Prometheus call"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1,<5",
    "mcp-configs==0.1.0",
    "mcp-types>=2.3,<3",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "prometheus-client>=0.24.1,<1",
    "pydantic>=2.13,<3",
    "starlette>=1.3.1,<2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_observability"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "httpx2==2.14.0",
    "poethepoet==0.49.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[tool.uv.sources]
mcp-configs = { path = "../mcp-configs" }

[tool.poe.tasks]
# Run from the package's folder: uv run poe <task>
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
fix = ["format", "lint-fix", "format"]
typecheck = "basedpyright"
test = "pytest"
ci = { sequence = [{ cmd = "ruff format --check ." }, "lint", "typecheck", "test"], help = "every check CI runs, in its order" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TID"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "all"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
