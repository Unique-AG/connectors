[project]
name = "mcp-runtime"
version = "0.1.0"
description = "What every Python MCP server shares at run time: its settings with their defaults, the HTTP server with its host and origin guard, telemetry and upstream retries"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx2>=2.13,<3",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "starlette>=1.8,<2",
    "unique-mcp>=2026.44.0.dev1",
    "unique-toolkit[monitoring,otel]>=2026.44.0.dev2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_runtime"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:unique_toolkit.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "all"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUnusedCallResult = false
