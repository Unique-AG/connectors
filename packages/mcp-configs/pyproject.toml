[project]
name = "mcp-configs"
version = "0.1.0"
description = "The settings every Python MCP server reads, with the defaults we always use: server, Postgres, Redis, Zitadel, upstream retries, logging and elicitation"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_configs"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "poethepoet==0.49.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.poe.tasks]
# Run from the package's folder: uv run poe <task>
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
fix = ["format", "lint-fix", "format"]
typecheck = "basedpyright"
test = "pytest"
ci = { sequence = [{ cmd = "ruff format --check ." }, "lint", "typecheck", "test"], help = "every check CI runs, in its order" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "all"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUnusedCallResult = false
