[project]
name = "mcp-skeleton"
version = "0.0.0"
description = "Set by mcp-scaffold"
classifiers = ["Development Status :: 3 - Alpha"]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mcp-skeleton = "mcp_skeleton.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning:unique_toolkit.*"]

[tool.ruff]
# The code style every MCP keeps: the Google Python Style Guide as far as ruff checks it.
# Add to it here, as for generated code, but never loosen it.
extend = "../../packages/mcp-architecture/src/mcp_architecture/code_style.toml"
target-version = "py314"
exclude = [".venv"]

[tool.ruff.lint.per-file-ignores]
# A context function takes keyword arguments only, so a call names what it passes. Here and not in
# the shared code style, since ruff reads a path there from the folder of that file.
"!src/mcp_skeleton/contexts/**" = ["PLR0917"]
# Generated from the vendor's spec, so its field names are the vendor's.
"src/mcp_skeleton/upstream/vendor_responses.py" = ["N815"]

[tool.basedpyright]
# The type check every MCP keeps. Make a report stricter here, but never turn one down.
extends = "../../packages/mcp-architecture/src/mcp_architecture/type_check.json"
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
include = ["src", "tests"]
# A test may reach a private name of the code it tests. Here and not in the shared type check,
# since basedpyright reads a root there from the folder of that file. `.` resolves `tests.*`.
executionEnvironments = [{ root = "tests", extraPaths = ["."], reportPrivateUsage = false }]

[tool.uv.sources]

[tool.mcp-openapi]
spec = "src/mcp_skeleton/upstream/openapi.yml"
operation-ids = []
operation-module = "mcp_openapi.upstream"
models-module = "mcp_skeleton.upstream.vendor_responses"
models-output = "src/mcp_skeleton/upstream/vendor_responses.py"
operations-output = "src/mcp_skeleton/upstream/operations.py"

# The architecture. packages/mcp-architecture/ARCHITECTURE.md explains each contract, and
# `uv run lint-imports` checks them.
# The scaffold writes the contracts every MCP keeps. Add a contract of the MCP's own after them.
[tool.importlinter]
