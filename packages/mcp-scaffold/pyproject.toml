[project]
name = "mcp-scaffold"
version = "0.0.1"
description = "Generates a new Python MCP service: the shared skeleton, the layers it asks for, its deploy and its release wiring"
requires-python = ">=3.14"
dependencies = [
    "jinja2==3.1.6",
    "mcp-architecture==0.1.0",
    "mcp-openapi==0.1.0",
    "pydantic>=2.13,<3",
    "pyyaml==6.0.3",
]

[project.scripts]
mcp-scaffold = "mcp_scaffold.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_scaffold"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "poethepoet==0.49.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]
# What a generated MCP pins, by the choice that brings it. The scaffold copies these versions,
# so the nightly dependency job bumping them here is what keeps the next MCP current. A shared package from
# packages/ is not listed: the scaffold pins its version from that package's pyproject.toml.
service = [
    "fastmcp==4.1.4",
    "httpx2==2.16.0",
    "mcp-types==2.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "starlette==1.10.0",
    "tenacity==9.2.1",
    "uvicorn[standard]==0.54.0",
]
service-dev = [
    "basedpyright==1.40.2",
    "poethepoet==0.49.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]
service-openapi = ["pyyaml==6.0.3"]
service-postgres = ["alembic==1.20.1", "asyncpg==0.32.0", "sqlalchemy[asyncio]==2.1.6"]
# The tests open SQLite in place of Postgres.
service-postgres-dev = ["aiosqlite==0.22.1"]
service-redis = ["py-key-value-aio[redis]==0.4.6"]
service-auth = ["cryptography==50.0.2", "jinja2==3.1.6", "mcp==2.3.0"]

[tool.uv.sources]
mcp-architecture = { path = "../mcp-architecture" }
mcp-openapi = { path = "../mcp-openapi" }

[tool.poe.tasks]
# Run from the package's folder: uv run poe <task>
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
fix = ["format", "lint-fix", "format"]
typecheck = "basedpyright"
test = "pytest"
ci = { sequence = [{ cmd = "ruff format --check ." }, "lint", "typecheck", "test"], help = "every check CI runs, in its order" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
# The skeleton is checked where it lands, in each generated MCP.
exclude = [".venv", "src/mcp_scaffold/files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "all"
include = ["src", "tests"]
exclude = ["src/mcp_scaffold/files"]
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
