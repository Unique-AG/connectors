[project]
name = "mcp-scaffold"
version = "0.0.1"
description = "Generates a new Python MCP service: the shared skeleton, the layers it asks for, its deploy and its release wiring"
requires-python = ">=3.14"
dependencies = [
    "jinja2==3.1.6",
    "mcp-openapi==0.1.0",
    "pydantic>=2.13,<3",
    "pyyaml==6.0.3",
]

[project.scripts]
mcp-scaffold = "mcp_scaffold.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_scaffold"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pytest==9.1.1",
    "ruff==0.17.0",
]
# What a generated MCP pins, by the choice that brings it. The scaffold copies these versions,
# so Dependabot bumping them here is what keeps the next MCP current. A shared package from
# packages/ is not listed: the scaffold pins its version from that package's pyproject.toml.
service = [
    "fastmcp==4.1.0",
    "httpx2==2.13.1",
    "mcp-types==2.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "starlette==1.8.0",
    "tenacity==9.1.4",
    "unique-mcp==2026.44.0.dev1",
    "unique-sdk==2026.44.0.dev10",
    "unique-toolkit[monitoring,otel]==2026.44.0.dev2",
    "uvicorn[standard]==0.53.0",
]
service-dev = [
    "basedpyright==1.40.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]
service-openapi = ["pyyaml==6.0.3"]
service-postgres = ["alembic==1.20.0", "asyncpg==0.31.0", "sqlalchemy[asyncio]==2.1.3"]
# The tests open SQLite in place of Postgres.
service-postgres-dev = ["aiosqlite==0.22.1"]
service-redis = ["py-key-value-aio[redis]==0.4.6"]

[tool.uv.sources]
mcp-openapi = { path = "../mcp-openapi" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
# The skeleton is checked where it lands, in each generated MCP.
exclude = [".venv", "src/mcp_scaffold/files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "all"
include = ["src", "tests"]
exclude = ["src/mcp_scaffold/files"]
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
