packages:
  - services/*
  - "!services/hello-mcp"
  - "!services/kb-mcp"
  - "!services/backstop-mcp"
  - "!services/office-365-mcp"
  - "!services/with-intelligence-mcp"
  - packages/*

injectWorkspacePackages: true
savePrefix: ""

# Versions shared by two or more workspace units live here, and the manifests reference them
# with `catalog:`. syncpack reports DiffersToCatalog if a manifest pins one of them directly.
# peerDependencies stay as ranges in each package.json: they are not exact versions, and pnpm
# does not validate a catalog reference in that section.
