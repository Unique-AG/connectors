name: Vulna Squash
description: "Vulnerability remediation from the nightly Trivy scan, and the assessment of open dependency PRs. Uses one subagent per batch or PR and reports to Slack."
enabled: true
scope: team_visible
model: cursor-grok-4.6-high
git_repo: https://github.com/Unique-AG/connectors
git_branch: main
memory_enabled: true
trigger:
  - cron:
      schedule: 0 5 * * *
action:
  - slack:
      channel: C0C1PR9CNMP
      generalized: false
      post_as_thread: false
prompt: |-
  Vulna Squash automation run on Unique-AG/connectors main.

  Read `agentic/skills/vulna-squash/SKILL.md` end to end and follow it. Do not repeat its rules here.

  Start one subagent per planned batch and one per swept dependency PR, as the skill says. Start them in parallel when more than one batch fits the open slots. Wait for all subagents before you post to Slack.

  Use the Slack action for every message the skill requires. Post exactly one message for each opened or swept PR. Post at most one stop message when this run opens no PR. Never put two PRs in one message.

  Never open a PR whose title fails `cz lint`. Every title is a conventional commit with `vulna squash` in the subject. Every PR carries the label `vulna-squash`.

  Never merge a PR. Never enable auto-merge.

  Do not change code in this run except through subagents.
